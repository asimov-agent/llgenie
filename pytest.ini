[pytest]
testpaths = tests
# A test that runs longer than 5 minutes prints the stack of every thread (it keeps
# running): shows the exact call a slow network test waits on, on Linux and macOS.
faulthandler_timeout = 300
markers =
    install: host install tests that require `make install` artifacts and ~/models
    health: end-to-end health check (launch a tiny model, hit the endpoint with a prompt)
    acceptance: real (no-mock) top-tier download + fit-gate + placement acceptance tests
    network: a test that calls the real Hub for real (huggingface.co/hf.co); owned by the `ci-network` pipeline and EXCLUDED from ci-unit by `-m "not network"` (issue #1000)
