# Linux sets up Docker + buildx. macOS never runs this action: the GitHub macOS
# runner has no dockerd, and starting Colima there hangs or shadows python3
# (issue #120). Engine images are tested on the Linux runner.
name: "Set up Docker"
description: "Linux: Docker + buildx. macOS does not call this action."
runs:
  using: composite
  steps:
    - name: Set up Docker (Linux only)
      if: runner.os == 'Linux'
      uses: docker/setup-buildx-action@v3
    - name: macOS must not call this action
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "macOS CI does not start Colima and does not run a Docker GitHub Action (issue #120)" >&2
        exit 1
