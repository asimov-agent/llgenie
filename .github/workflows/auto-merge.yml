name: auto-merge

# WHY THIS IS NOT A JOB IN ci.yml (issue #493).
#
# A `pull_request` run **from a fork** receives NO repository secrets — GitHub withholds them on purpose.
# #481 is a fork PR (`andyholst/llgenie`), so in ci.yml's auto-merge job `secrets.BUMP_TOKEN` resolved to the
# empty string: the job reported `success` while merging nothing, and the only trace was an empty
# `GH_TOKEN:` line in its log. Every agent PR in this repository is pushed to the fork, so every one of them
# was stuck behind a human click.
#
# A `workflow_run` workflow executes in the BASE repository with the BASE repository's secrets, so the owner
# PAT exists here — and it still only merges what CI has already built and tested: `conclusion == 'success'`
# means every job of the CI run passed, and `scripts/auto_merge.py` re-reads the PR (state, mergeability,
# head SHA, hold label, review requirement) before it touches anything.
#
# `trending-local-llms` never needed this because its bots push branches inside the repo; llgenie pushes to
# the fork by design.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # A deferral is exit 0 by design, so nothing retries it: this sweep re-runs the same decision for the PRs
  # the gate itself deferred at the head they still have (issue #545). Every 30 minutes; by hand with
  # `make auto-merge-recheck REPO=…` or a re-run of the last sweep.
  #
  # ODD MINUTES ONLY (issue #560). This cron was `*/30 * * * *` — minutes :00 and :30 — and produced ZERO
  # runs (0 `schedule` of 66 runs, measured 2026-10-23) while queued-alarm (:07/:37), fix-bot (:17),
  # issue-refiner (:43) and rebase-bot (:29) fired normally on the same repository. `*/30` was the only cron
  # in this tree expanding to even minutes, and this repo already recorded why that is fatal: queued-alarm's
  # comment says `an odd minute; GitHub drops top-of-hour runs` (#275, #301). Same cadence, odd minutes.
  schedule:
    - cron: "3,33 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

# THE MERGER MUST NOT QUEUE BEHIND ITSELF (issue #917).
#
# Every `CI` completion fires a sweep and the schedule fires one every 30 minutes. With
# `cancel-in-progress: false` those runs STACK instead of superseding: measured 22:36Z-23:12Z, NINE sweeps
# on `main` queued behind each other, and `auto-merge` became 12 of the 51 queued runs - behind a queue whose
# oldest item had waited 4h25m. PRs sat armed, green and BLOCKED while the job that would merge them waited
# for the job that would merge them.
#
# Cancelling the older run is correct, not lossy: a sweep holds NO state between runs (it re-reads every PR's
# current state - state, mergeability, head SHA, hold label, review decision), and each merge is ONE atomic
# `gh pr merge` call, so a cancellation lands before or after a merge, never inside one. A PR whose sweep is
# preempted is picked up by the next sweep, including the scheduled recheck, which is why repo-wide is safe
# here and a per-branch group was not enough.
#
# WHY REPO-WIDE AND NOT PER-BRANCH (measured by the tick, 01:15Z): `cancel-in-progress: false` does NOT
# protect a PENDING run - GitHub keeps one running plus one pending per group, and a newly queued run replaces
# the pending one whatever the flag says; the flag protects only the run already executing. With a per-branch
# group, the scheduled sweeps (which have no `head_branch`) all collapsed into `auto-merge-` and cancelled each
# other's pending slot: 16 of the last 25 runs were cancelled with NO job rows, so nothing drained and the
# queue looked like backlog when it was churn. One group for all sweeps makes "one at a time" absolute.
# `tests/test_auto_merge.py` and `tests/test_ci_concurrency.py` pin this shape, because a "harmless"
# concurrency setting has starved this board three times.
# concurrency: superseding is safe — a sweep re-reads the PR and merges with one atomic
# `gh pr merge`, so a cancelled sweep has done nothing that needs redoing, while sixteen sweeps
# waiting for each other cost the fleet its merger (issue #917).
concurrency:
  # REPO-WIDE within each OUTCOME, not per branch. Two facts decide this line:
  #
  # 1. `cancel-in-progress: false` does NOT protect a PENDING run — GitHub keeps one running plus one pending
  #    per group and replaces the pending one whatever the flag says. A per-branch group therefore let the
  #    scheduled sweeps (no `head_branch`) collapse into one empty-name group and cancel each other: 16 of the
  #    last 25 runs ended `cancelled` with no job rows, so nothing drained.
  # 2. A sweep fired by a FAILING CI run decides nothing — the `merge` job requires `conclusion == 'success'`
  #    — so under one group it would cancel the pending sweep of a PR that IS mergeable: a harmless extra run
  #    turned into a lost merge. Partitioning by conclusion costs one extra group and removes that.
  #
  #    `workflow_run.types` cannot filter by conclusion (it only offers `completed`), so this partition IS the
  #    filter: a failed or cancelled CI run gets its own group, supersedes only its own kind, and spends no
  #    runner deciding something the `if:` below would refuse anyway.
  #
  # "Newest replaces older" is safe here specifically: a sweep holds no state between runs, each merge is one
  # atomic `gh pr merge` so a cancel lands before or after a merge and never inside one, and a PR whose sweep
  # is preempted is picked up by the next sweep, including the scheduled recheck.
  group: auto-merge-${{ github.event.workflow_run.conclusion || 'schedule' }}
  cancel-in-progress: true

jobs:
  merge:
    # A PR run that finished green, and nothing else: a push run on main has no pull request to merge.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the owner PAT (an empty token must fail, never defer)
        env:
          BUMP_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: |
          if [ -z "$BUMP_TOKEN" ]; then
            echo "::error::secrets.BUMP_TOKEN is empty in the base repository - this workflow cannot merge, and must not pretend otherwise"
            exit 2
          fi

      # The BASE branch, never the PR head: this job holds a write token, so it runs trusted code only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve the pull request the finished run belongs to
        id: pr
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        # The logic lives in scripts/resolve_run_pr.py (make auto-merge-resolve, tested in
        # tests/test_resolve_run_pr.py): a fork run 404s on the runs endpoint and `gh api` prints the
        # error BODY on stdout, so a value is a PR number only when it is digits — otherwise the step
        # wrote the JSON blob to $GITHUB_OUTPUT and died with `Invalid format` (run 39735179724, #508).
        run: make auto-merge-resolve REPO="$REPO" RUN_ID="$RUN_ID" HEAD_OWNER="$HEAD_OWNER" HEAD_BRANCH="$HEAD_BRANCH"

      - name: make auto-merge (merge only a green, conflict-free PR; everything else defers to a human)
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # A green PR whose ONLY blocker is a required review is approved by the other allowed identity
          # and merged (issue #491). A same-account PR is still refused by GitHub's self-approval rule, and
          # the deferral comment says so on the PR.
          APPROVE: "1"
          # The OTHER allowed identity, used only when the PR author IS the merge token's account (every
          # bot PR): GitHub refuses a self-approval, so the job approves with this token and then merges
          # (issue #524). Optional — unset falls back to the --admin bypass, which GitHub refuses wherever
          # the review rule is enforced for admins. The value is read from the environment by
          # scripts/auto_merge.py and never reaches argv.
          APPROVER_TOKEN: ${{ secrets.APPROVER_TOKEN }}
          # Who triggered the CI run. A bot-authored PR is merged only when this is the owner, a write
          # collaborator, or the bot — the same gate ci.yml's guard already applied to the run.
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: make auto-merge PR="$PR" REPO="$REPO" HEAD_SHA="$HEAD_SHA" APPROVE=1 ACTOR="$ACTOR"

  recheck:
    # The retry half of the same gate (issue #545): only the PRs whose deferral marker names their CURRENT
    # head are re-evaluated, through the same make target.
    #
    # It runs on EVERY CI completion as well as on the cron (issue #558): the scheduled trigger produced no
    # runs at all while it sat on :00/:30 (measured: 0 `schedule` runs, while issue-refiner.yml's hourly cron
    # runs fine), so a deferral used to wait for a push that may never come. `always()` is what makes it run
    # after the merge job whether that job merged, deferred or was skipped. The cron itself moved to odd
    # minutes in issue #560 — it is the only retry for a deferral that clears with no push, so it must fire.
    needs: [merge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Require the owner PAT (an empty token must fail, never defer)
        env:
          BUMP_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: |
          if [ -z "$BUMP_TOKEN" ]; then
            echo "::error::secrets.BUMP_TOKEN is empty in the base repository - this workflow cannot merge, and must not pretend otherwise"
            exit 2
          fi
      - name: Re-evaluate the deferred PRs (approve as the other identity, then merge)
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          APPROVER_TOKEN: ${{ secrets.APPROVER_TOKEN }}
          REPO: ${{ github.repository }}
        run: make auto-merge-recheck REPO="$REPO"
