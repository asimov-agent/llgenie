name: registry-liveness — a committed pinned engine image whose manifest is missing must be named to the board, not left green
run-name: registry-liveness

# Issue #1365 class: a committed engine pin whose image was never published PASSES every committed CI, because the
# one check that would catch it (make check-engine-launchers CHECK_REGISTRY=1) is opt-in and no workflow sets it.
# ci-unit's plain check-engine-launchers only compares the launcher's tag to the params-computed tag (a
# stale-launcher freshness gate, issue #842); it is green at head for vllm:5df63a72 while
# ghcr.io/asimov-agent/llgenie/vllm:5df63a72-*-cuda resolves NO manifest (measured 2026-11-01, #1365).
#
# This pipeline is a control that READS the liveness gate on a schedule and on every merge to main, and on the
# first unpublished pinned image opens ONE tracking issue naming it. It sweeps EVERY backend (ARCH=all, derived
# from engine_image.CI_VARIANTS) so a cuda/rocm/vulkan pin that was never published reds it exactly like a cpu
# one (issue #1652) — a committed cuda pin used to pass every committed CI even though its image 404'd on GHCR,
# because the one gate that would catch it only read the run host's backend. It never runs in a pull request
# (a PR's pin
# tags are legitimately not yet published — engine-build publishes on merge), so it can never false-red a PR; it
# is the after-the-fact reader that the "#1365 class has no CI consumer" gap was about. It never merges and never
# touches main; it files GITHUB_ISSUES only, one per engine, idempotently. Not manually dispatchable: a scheduled
# monitor needs no inputs and a dispatch form would only add a second way to confuse its idempotence — the guard
# that owns this file reads it from the tree, matching the ci-hf-live precedent (issue #1002).
#
# Trigger surface: schedule (three times daily — odd minutes not shared with another bot, issue #275) + push to
#                  main (a merge-time red is caught here too). NOTHING else — no pull_request, no non-main branch,
#                  no workflow_dispatch (see dispatch note above).
# Flow: make test-env
#       -> make check-engine-launchers CHECK_REGISTRY=1 (the liveness gate) -> on non-zero, name every
#       unpublished pin and open one tracking issue per engine (idempotent).
# Never: never in a pull request, never gated by a PR, never merges, never pushes to main, never weakens the gate.
on:
  schedule:
    - cron: "35 3 * * *"
    - cron: "49 11 * * *"
    - cron: "1 19 * * *"
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  # The dispatch step (below) must be able to start the engine-build producer on the SAME
  # repository — `gh workflow run` on a workflow in this repo requires `actions: write`
  # (issue #2259 closes the "the gate only names the gap, nothing performs the publish"
  # gap). This does NOT grant engine-build's registry write (that stays in
  # engine-build.yml's `packages: write`, unchanged), and it does not touch the fork guard.
  actions: write

concurrency:
  group: registry-liveness
  cancel-in-progress: false

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: make test-env
        run: make test-env
      - name: full-fleet committed-tag pin-validity gate
        id: fleet
        run: |
          # The #2190 class: a committed engine tag (pin + params hash) that resolves
          # `manifest unknown` in ghcr must FAIL this job — not be filed as a soft issue
          # and swallowed. `check-engine-pins-published check --all` sweeps EVERY committed
          # enabled cell's exact tag (not just the songs a change repins), so a pin a prior
          # merged bump committed but the build never pushed (tensorfold/cuda @ #1519) reds
          # here and stays red until engine-build push=true publishes it. ALL=1 hard-fails:
          # the job's exit is the gate's, so a committed manifest-unknown turns the scheduled
          # run RED, not a silently-green issue-filer.
          set +e
          make check-engine-pins-published ALL=1 > fleet.out 2>&1
          rc=$?
          set -e
          sed 's/^/  /' fleet.out
          echo "fleet_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "fleet_rc=$rc"
          exit "$rc"
      - name: file one tracking issue per unpublished pinned image
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          make check-engine-launchers CHECK_REGISTRY=1 ARCH=all > liveness.out 2>&1
          rc=$?
          set -e
          sed 's/^/  /' liveness.out
          if [ "$rc" = "0" ] && [ "${{ steps.fleet.outputs.fleet_rc }}" = "0" ]; then
            echo "all committed engine tags published; nothing to file"
            exit 0
          fi
          grep "NOT PUBLISHED" liveness.out | sed -E 's/.*NOT PUBLISHED ([^:]+): ([^ ]+).*/\1 \2/' > unnamed.txt
          if [ ! -s unnamed.txt ]; then
            echo "gate red but no NOT PUBLISHED named:"
            cat liveness.out
            exit 1
          fi
          while read -r engine tag; do
            [ -n "$engine" ] || continue
            title="engine: committed tag $tag ($engine) is not published in ghcr"
            body="BOT registry-liveness: committed image tag $tag ($engine) has NO manifest in ghcr. A publish is the remedy, and #2259 now makes this gate DISPATCH it: the next registry-liveness run (or the config-page rerun button) fires engine-build push=true for this cell. Either confirm that dispatch/PR landed the tag, or move the pin to a published commit (#1365 class). See #2190/#2259."
            open=$(gh issue list --repo "$REPO" --state open --search "\"$tag\"" --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$open" ]; then
              echo "issue #$open already open for $tag"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body" --label bug >/dev/null && echo "filed issue for $engine ($tag)"
            fi
          done < unnamed.txt
      - name: dispatch engine-build push=true for every missing committed tag (#2259)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          make check-engine-pins-published ALL=1 > dispatch.out 2>&1
          rc=$?
          set -e
          if [ "$rc" = "0" ] && [ "${{ steps.fleet.outputs.fleet_rc }}" = "0" ]; then
            echo "all committed engine tags published; nothing to dispatch"
            exit 0
          fi
          # Issue #2561: dispatch ONLY from the gate's own [select] contract lines —
          #   [select] <committed engine id> <variant> <tag suffix>
          # with dots intact. The previous parse derived the engine from the ghcr
          # package URL, and package names legally replace dots with dashes:
          # llama.cpp reached engine-build as engine=llama-cpp, matrix matched no
          # params id, synthesized its none/none placeholder, and nine runs completed
          # "success" having built and published nothing (runs 43149732453,
          # 43149735782, 43149739069, 43149741957, 43149744886, 43149748002,
          # 43149751256, 43149753954, 43149757005 on aa700cf27). Never reverse-parse
          # an engine id from a package name.
          grep -E '^\[select\] ' dispatch.out | sort -u > select.txt
          if [ ! -s select.txt ]; then
            echo "gate red but no [select] line in dispatch.out:"
            cat dispatch.out
            exit 0   # the fleet step already reds the run; dispatch cannot name a cell, so do not fail twice
          fi
          # Issue #2567: this loop once read THREE variables from a FOUR-token line, so
          # every field shifted one slot right — $engine became the literal "[select]",
          # $variant the engine id, $tag the variant+suffix. All 22 dispatches on
          # e6b9b4b4f (43187181181..43187252711) ran engine-build with engine="[select]":
          # no committed params id matched, the matrix synthesized none/none, and the runs
          # "succeeded" publishing nothing (same class as the nine on aa700cf27, #2561).
          # The marker now has its own field; a line that violates the contract is
          # reported, never dispatched, and fails this step.
          bad_line=0
          while read -r sel engine variant tag extra; do
            if [ "$sel" != "[select]" ] || [ -z "$engine" ] || [ -z "$variant" ] \
               || [ -z "$tag" ] || [ -n "$extra" ]; then
              echo "UNRECOGNIZED select line (contract: '[select] <engine> <variant> <tag-suffix>'): $sel $engine $variant $tag $extra"
              bad_line=1
              continue
            fi
            echo "dispatching engine-build push=true for $engine/$variant (missing tag $tag)"
            gh workflow run engine-build.yml --repo "$REPO" --ref main \
              -f engine="$engine" -f arch="$variant" -f push=true \
              || echo "dispatch failed for $engine/$variant (rc $?); the tracking issue above stays the record"
          done < select.txt
          if [ "$bad_line" -ne 0 ]; then
            echo "registry-liveness: a select.txt line violated the [select] contract; malformed dispatch refused (#2567)"
            exit 1
          fi
          echo "dispatched for every [select] cell; re-run registry-liveness after the builds publish"
