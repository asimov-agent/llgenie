name: registry-liveness — a committed pinned engine image whose manifest is missing must be named to the board, not left green
run-name: registry-liveness

# Issue #1365 class: a committed engine pin whose image was never published PASSES every committed CI, because the
# one check that would catch it (make check-engine-launchers CHECK_REGISTRY=1) is opt-in and no workflow sets it.
# ci-unit's plain check-engine-launchers only compares the launcher's tag to the params-computed tag (a
# stale-launcher freshness gate, issue #842); it is green at head for vllm:5df63a72 while
# ghcr.io/asimov-agent/llgenie/vllm:5df63a72-*-cuda resolves NO manifest (measured 2026-11-01, #1365).
#
# This pipeline is a control that READS the liveness gate on a schedule and on every merge to main, and on the
# first unpublished pinned image opens ONE tracking issue naming it. It sweeps EVERY backend (ARCH=all, derived
# from engine_image.CI_VARIANTS) so a cuda/rocm/vulkan pin that was never published reds it exactly like a cpu
# one (issue #1652) — a committed cuda pin used to pass every committed CI even though its image 404'd on GHCR,
# because the one gate that would catch it only read the run host's backend. It never runs in a pull request
# (a PR's pin
# tags are legitimately not yet published — engine-build publishes on merge), so it can never false-red a PR; it
# is the after-the-fact reader that the "#1365 class has no CI consumer" gap was about. It never merges and never
# touches main; it files GITHUB_ISSUES only, one per engine, idempotently. Not manually dispatchable: a scheduled
# monitor needs no inputs and a dispatch form would only add a second way to confuse its idempotence — the guard
# that owns this file reads it from the tree, matching the ci-hf-live precedent (issue #1002).
#
# Trigger surface: schedule (three times daily — odd minutes not shared with another bot, issue #275) + push to
#                  main (a merge-time red is caught here too). NOTHING else — no pull_request, no non-main branch,
#                  no workflow_dispatch (see dispatch note above).
# Flow: make test-env
#       -> make check-engine-launchers CHECK_REGISTRY=1 (the liveness gate) -> on non-zero, name every
#       unpublished pin and open one tracking issue per engine (idempotent).
# Never: never in a pull request, never gated by a PR, never merges, never pushes to main, never weakens the gate.
on:
  schedule:
    - cron: "35 3 * * *"
    - cron: "49 11 * * *"
    - cron: "1 19 * * *"
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  # The dispatch step (below) must be able to start the engine-build producer on the SAME
  # repository — `gh workflow run` on a workflow in this repo requires `actions: write`
  # (issue #2259 closes the "the gate only names the gap, nothing performs the publish"
  # gap). This does NOT grant engine-build's registry write (that stays in
  # engine-build.yml's `packages: write`, unchanged), and it does not touch the fork guard.
  actions: write

concurrency:
  group: registry-liveness
  cancel-in-progress: false

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: make test-env
        run: make test-env
      # Issue #2592 (landed via #2593) + #2596 (this change): a liveness run races the run that
      # PUBLISHES the pins in this tree — the ci.yml run at the SAME head SHA. Measured: liveness
      # run #457 (head be92a32695) redded `mlx:93e6d4a6-e5ab3798-cpu resolves no
      # manifest` at 19:23:12Z while CI #5565 at that same head was still in_progress, and the tag
      # is published now; #454/#455 redded head 85be1b6a87 the same way. A manifest check that
      # decides before that publisher concludes cries red on a tag it is about to publish. So EVERY
      # run FIRST waits (bounded) for the same-head ci.yml run to conclude, and only a concluded
      # run lets the fleet gate decide. #2596 replaced the push-only gate and the fixed attempt
      # count: a scheduled run CAN catch a publisher mid-flight (measured publisher windows: 16 m
      # 51 s at 5ffc7cdc8, 40 m 21 s at be92a32695), and 108 polls of 10 s + API time exceed the
      # old 18-minute step bound — a step timeout cancels the loop BEFORE the defer path records
      # `publisher_still_running`, redding the job (live near-miss: wait 16 m 42 s, publisher
      # concluded 68 s before the bound). The bound is now a wall-clock budget the script enforces
      # via SECONDS, so the loop always ends through the defer path; a head with no same-head
      # publisher (the normal scheduled case) exits after a short registration grace.
      - name: wait for the same-head main-publisher (ci.yml) run to conclude (#2592/#2596)
        id: publisher
        timeout-minutes: 63
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          WAIT_BUDGET_SECONDS: "3600"       # 60 min wall clock > measured worst-case publisher 40 m 21 s (#2596)
          POLL_SECONDS: "10"
          REGISTRATION_GRACE_SECONDS: "120" # a push registers its ci.yml run slightly late; poll on
        run: |
          set -euo pipefail
          echo "waiting for the ci.yml run at head $HEAD_SHA (the publisher of these pins) to conclude (#2592/#2596)"
          still="true"
          # #2596: a wall-clock budget, not an attempt count. 108 polls of ~11.5 s each need
          # ~21 min, and the old 18-minute step timeout cancelled such a loop MID-LOOP, redding
          # the job before the defer path could record `publisher_still_running`. SECONDS is the
          # shell's own elapsed clock, so the loop always ends before its 63-minute step timeout.
          deadline=$(( SECONDS + WAIT_BUDGET_SECONDS ))
          grace=$(( SECONDS + REGISTRATION_GRACE_SECONDS ))
          seen_run="false"
          while [ "$SECONDS" -lt "$deadline" ]; do
            # The same-head ci.yml run only — NOT this workflow's own run (both fire on a push to
            # main at the same head_sha). `.path` disambiguates the workflow FILE; the newest run
            # at the head wins (a rerun supersedes: polling it is what the publisher would do).
            row=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100&event=push" \
              --jq '[.workflow_runs[] | select(.path | endswith("/ci.yml"))] | sort_by(.created_at) | last // empty' 2>/dev/null || true)
            if [ -n "$row" ]; then
              seen_run="true"
              run_id=$(printf '%s' "$row" | jq -r '.id')
              status=$(printf '%s' "$row" | jq -r '.status')
              conclusion=$(printf '%s' "$row" | jq -r '.conclusion // ""')
              echo "same-head ci.yml run $run_id status=$status conclusion=${conclusion:-none}"
              if [ "$status" = "completed" ]; then
                still="false"
                echo "publisher_run=$run_id" >> "$GITHUB_OUTPUT"
                echo "publisher_conclusion=$conclusion" >> "$GITHUB_OUTPUT"
                if [ "$conclusion" = "failure" ]; then
                  echo "publisher_failed=true" >> "$GITHUB_OUTPUT"
                fi
                break
              fi
            elif [ "$seen_run" = "false" ] && [ "$SECONDS" -ge "$grace" ]; then
              # No same-head ci.yml run surfaced after the registration grace: this head has no
              # publisher to race (the normal scheduled case) — go straight to the gate (#2596).
              still="false"
              echo "publisher_none=true" >> "$GITHUB_OUTPUT"
              echo "no same-head ci.yml run at $HEAD_SHA after ${REGISTRATION_GRACE_SECONDS}s grace; nothing to wait for"
              break
            fi
            sleep "$POLL_SECONDS"
          done
          echo "publisher_still_running=$still" >> "$GITHUB_OUTPUT"
          if [ "$still" = "true" ]; then
            # A cap-hit must never look like a verified green: name the deferral as a workflow
            # warning AND in the job output (#2596 AC: "never a silent rc=0 green").
            echo "::warning::registry-liveness DEFERRED: no same-head ci.yml publisher concluded within ${WAIT_BUDGET_SECONDS}s at head $HEAD_SHA — this run verified nothing; the verdict is deferred to a non-racing run (#2596)"
            echo "NO same-head ci.yml run concluded within ${WAIT_BUDGET_SECONDS}s; publisher still in flight — deferring the verdict to a non-racing run (#2596)"
          fi
      - name: full-fleet committed-tag pin-validity gate
        id: fleet
        run: |
          # The #2190 class: a committed engine tag (pin + params hash) that resolves
          # `manifest unknown` in ghcr must FAIL this job — not be filed as a soft issue
          # and swallowed. `check-engine-pins-published check --all` sweeps EVERY committed
          # enabled cell's exact tag (not just the songs a change repins), so a pin a prior
          # merged bump committed but the build never pushed (tensorfold/cuda @ #1519) reds
          # here and stays red until engine-build push=true publishes it. ALL=1 hard-fails:
          # the job's exit is the gate's, so a committed manifest-unknown turns the scheduled
          # run RED, not a silently-green issue-filer.
          set +e
          make check-engine-pins-published ALL=1 > fleet.out 2>&1
          rc=$?
          set -e
          sed 's/^/  /' fleet.out
          # #2592/#2596: on a run whose same-head publisher is STILL in flight, a NOT PUBLISHED
          # verdict is the race, not a gap — the tag is mid-publish. Never hard-fail a pin that is
          # being published; defer to the next (non-racing) run, which settles it definitively.
          if [ "${{ steps.publisher.outputs.publisher_still_running }}" = "true" ] && [ "$rc" -ne 0 ]; then
            echo "publisher still in flight (same head); suppressing the fleet hard-fail for this run — deferred (#2592)"
            rc=0
          fi
          echo "fleet_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "fleet_rc=$rc"
          exit "$rc"
      - name: file one tracking issue per unpublished pinned image
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          make check-engine-launchers CHECK_REGISTRY=1 ARCH=all > liveness.out 2>&1
          rc=$?
          set -e
          sed 's/^/  /' liveness.out
          # #2592: still-in-flight publisher — the gate deferred (fleet_rc forced to 0), so there
          # is nothing to file yet: the tag is mid-publish, not missing. Exit cleanly instead of
          # running the NOT PUBLISHED filer against a tag the same-head run is about to publish.
          if [ "${{ steps.publisher.outputs.publisher_still_running }}" = "true" ]; then
            echo "publisher still in flight (same head); nothing to file — deferred (#2592)"
            exit 0
          fi
          if [ "$rc" = "0" ] && [ "${{ steps.fleet.outputs.fleet_rc }}" = "0" ]; then
            echo "all committed engine tags published; nothing to file"
            exit 0
          fi
          grep "NOT PUBLISHED" liveness.out | sed -E 's/.*NOT PUBLISHED ([^:]+): ([^ ]+).*/\1 \2/' > unnamed.txt
          if [ ! -s unnamed.txt ]; then
            echo "gate red but no NOT PUBLISHED named:"
            cat liveness.out
            exit 1
          fi
          # #2592: a publisher that FAILED means the pin is unpublished because its own main run
          # failed — the tracking issue names that run as the diagnostic anchor instead of pointing
          # at a sweep that will reproduce the failure (a sweep is only dispatched on success).
          fail_note=""
          if [ "${{ steps.publisher.outputs.publisher_failed }}" = "true" ]; then
            pub_run="${{ steps.publisher.outputs.publisher_run }}"
            fail_note=" The same-head main-publisher run ${pub_run:-unknown} concluded FAILURE, so this pin is unpublished because that run failed — no sweep was dispatched here (dispatching would reproduce the publisher's own failure, #2592). Investigate the failed publisher run, then re-publish."
          fi
          while read -r engine tag; do
            [ -n "$engine" ] || continue
            title="engine: committed tag $tag ($engine) is not published in ghcr"
            body="BOT registry-liveness: committed image tag $tag ($engine) has NO manifest in ghcr. A publish is the remedy, and #2259 now makes this gate DISPATCH it: the next registry-liveness run (or the config-page rerun button) fires engine-build push=true for this cell. Either confirm that dispatch/PR landed the tag, or move the pin to a published commit (#1365 class). See #2190/#2259.${fail_note}"
            open=$(gh issue list --repo "$REPO" --state open --search "\"$tag\"" --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$open" ]; then
              echo "issue #$open already open for $tag"
              printf '%s %s\n' "$tag" "$open" >> tracking_issues.txt
            else
              num=$(gh issue create --repo "$REPO" --title "$title" --body "$body" --label bug --json number --jq .number 2>/dev/null) && echo "filed issue #$num for $engine ($tag)" && printf '%s %s\n' "$tag" "$num" >> tracking_issues.txt
            fi
          done < unnamed.txt
      - name: dispatch engine-build push=true for every missing committed tag (#2259)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          make check-engine-pins-published ALL=1 > dispatch.out 2>&1
          rc=$?
          set -e
          if [ "$rc" = "0" ] && [ "${{ steps.fleet.outputs.fleet_rc }}" = "0" ]; then
            echo "all committed engine tags published; nothing to dispatch"
            exit 0
          fi
          # #2592: never dispatch a sweep for a SHA whose own main-publisher run failed — it would
          # reproduce the publisher's own known failure (measured: sweeps #682/#684 at 85be1b6a87
          # failed `vllm-rocm ... Permission denied`, fixed only in b32594c8c4) just to file a second
          # red run. A still-in-flight publisher means nothing is missing yet; also no dispatch.
          if [ "${{ steps.publisher.outputs.publisher_still_running }}" = "true" ]; then
            echo "publisher still in flight (same head); nothing to dispatch — deferred (#2592)"
            exit 0
          fi
          if [ "${{ steps.publisher.outputs.publisher_failed }}" = "true" ]; then
            echo "publisher concluded failure; NO engine-build dispatch — the tracking issue names the failed publisher run and no sweep would pass it (#2592)"
            exit 0
          fi
          # Issue #2561: dispatch ONLY from the gate's own [select] contract lines —
          #   [select] <committed engine id> <variant> <tag suffix>
          # with dots intact. The previous parse derived the engine from the ghcr
          # package URL, and package names legally replace dots with dashes:
          # llama.cpp reached engine-build as engine=llama-cpp, matrix matched no
          # params id, synthesized its none/none placeholder, and nine runs completed
          # "success" having built and published nothing (runs 43149732453,
          # 43149735782, 43149739069, 43149741957, 43149744886, 43149748002,
          # 43149751256, 43149753954, 43149757005 on aa700cf27). Never reverse-parse
          # an engine id from a package name.
          grep -E '^\[select\] ' dispatch.out | sort -u > select.txt
          if [ ! -s select.txt ]; then
            echo "gate red but no [select] line in dispatch.out:"
            cat dispatch.out
            exit 0   # the fleet step already reds the run; dispatch cannot name a cell, so do not fail twice
          fi
          # Issue #2567: this loop once read THREE variables from a FOUR-token line, so
          # every field shifted one slot right — $engine became the literal "[select]",
          # $variant the engine id, $tag the variant+suffix. All 22 dispatches on
          # e6b9b4b4f (43187181181..43187252711) ran engine-build with engine="[select]":
          # no committed params id matched, the matrix synthesized none/none, and the runs
          # "succeeded" publishing nothing (same class as the nine on aa700cf27, #2561).
          # The marker now has its own field; a line that violates the contract is
          # reported, never dispatched, and fails this step.
          bad_line=0
          : > validated.txt
          while read -r sel engine variant tag extra; do
            if [ "$sel" != "[select]" ] || [ -z "$engine" ] || [ -z "$variant" ] \
               || [ -z "$tag" ] || [ -n "$extra" ]; then
              echo "UNRECOGNIZED select line (contract: '[select] <engine> <variant> <tag-suffix>'): $sel $engine $variant $tag $extra"
              bad_line=1
              continue
            fi
            printf '%s %s %s %s\n' "$sel" "$engine" "$variant" "$tag" >> validated.txt
          done < select.txt
          if [ "$bad_line" -ne 0 ]; then
            echo "registry-liveness: a select.txt line violated the [select] contract; malformed dispatch refused (#2567)"
            exit 1
          fi
          # Issue #2579: a per-cell dispatch is a WAVE, and the wave itself was the failure.
          # Eight one-cell runs queued at 1s intervals in the single engine-build-push
          # concurrency group (43211663538, 43211665298, 43211666762, 43211668277,
          # 43211670190, 43211672019, 43211685857, 43211688780), each occupying a group slot
          # and a runner for its whole wait while the already-running sweep starved (#2570).
          # engine-build ALREADY has the coalesced shape: empty engine/arch inputs = the
          # full matrix, push=true publishes every cell from its own green job (fleet run
          # #645 published 27 cells that way). So: more than one missing cell dispatches ONE
          # sweep; exactly one missing cell keeps the #2567 per-cell named-field dispatch.
          n=$(wc -l < validated.txt)
          if [ "$n" -gt 1 ]; then
            echo "coalescing $n missing cells into ONE full-matrix push=true sweep (#2579); sweep cells:"
            cat validated.txt
            gh workflow run engine-build.yml --repo "$REPO" --ref main -f push=true -f producer_run="${{ github.run_id }}" \
              || echo "sweep dispatch failed (rc $?); the tracking issues above stay the record"
          elif [ "$n" = "1" ]; then
            read -r sel engine variant tag < validated.txt
            echo "dispatching engine-build push=true for $engine/$variant (single missing cell)"
            gh workflow run engine-build.yml --repo "$REPO" --ref main \
              -f engine="$engine" -f arch="$variant" -f push=true -f producer_run="${{ github.run_id }}" \
              || echo "dispatch failed for $engine/$variant (rc $?); the tracking issue above stays the record"
          fi
          echo "dispatch shape chosen from $n contract-valid [select] cell(s); re-run registry-liveness after the builds publish"
          # Issue #2583: a tracking issue names the remedy it is waiting for. `gh
          # workflow run` returns no id; the dispatch queue does. Poll briefly for the
          # workflow_dispatch run this step just created on main and record it (or
          # `unknown`, honestly — a dispatch that failed is not a remedy).
          if [ -s validated.txt ]; then
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            rid=""
            for _i in 1 2 3 4 5 6; do
              sleep 10
              rid=$(gh api "repos/$REPO/actions/runs?event=workflow_dispatch&branch=main&per_page=10&created=%3E%3D$since" --jq '[.workflow_runs[] | select(.name == "engine-build — builds and verifies EVERY engine at its committed pin, in parallel (never merges)")] | .[0].id' 2>/dev/null)
              [ -n "$rid" ] && break
            done
            if [ "$n" -gt 1 ]; then
              shape="full-matrix sweep (#2579)"
            else
              read -r sel engine variant tag < validated.txt
              shape="per-cell $engine/$variant"
            fi
            printf '%s %s\n' "${rid:-unknown}" "$shape" > producer.txt
            echo "dispatched engine-build run id for the tracking issues: ${rid:-unknown} ($shape)"
          fi
      - name: record the dispatched engine-build run id on the tracking issues (#2583)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          if [ ! -s tracking_issues.txt ]; then
            echo "no tracking issues were filed this run; nothing to stamp"
            exit 0
          fi
          if [ ! -s producer.txt ]; then
            echo "no engine-build dispatch fired this run; the tracking issues keep their #2259 remedy text"
            exit 0
          fi
          read -r rid shape < producer.txt
          while read -r tag num; do
            [ -n "$num" ] || continue
            gh issue comment "$num" --repo "$REPO" --body "registry-liveness run ${{ github.run_id }} dispatched engine-build **run $rid** (shape: $shape, carrying producer_run=${{ github.run_id }} per #2578) for \`$tag\`. That dispatched run is the named remedy for this tracking issue (#2583)." >/dev/null \
              && echo "stamped #$num with dispatched engine-build run $rid" \
              || echo "stamp failed on #$num (rc $?)"
          done < tracking_issues.txt
