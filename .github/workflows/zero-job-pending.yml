name: zero-job-pending — a dispatched run that instantiates no jobs must be named, not left pending
run-name: zero-job-pending

# Issue #1410: a `workflow_dispatch` run whose workflow instantiates ZERO jobs stays `pending`
# forever, and no committed gate names it. `queued_run_alarm` (issue #254) scans a run's JOB ROWS —
# a zero-job run has none, so it renders "no job has been queued" and reads CLEAN. This is the
# run-level complement: it lists the repo's queued/in-progress runs and flags the ones `pending`
# past the threshold whose jobs.total_count is 0, naming run id + head sha + created time, and files
# ONE deduped issue per stuck run (idempotent by run-id marker). It is the after-the-fact reader
# that makes a runner-starved dispatch loud instead of an eternal pending placeholder; it never
# merges and never runs in a pull request.
#
# Trigger surface: schedule (twice an hour, an odd minute dropped from the shared minutes — issue
#                  #275) + workflow_dispatch (MINUTES override). NOTHING else — no pull_request, no
#                  non-main branch (a PR-run monitor here would name PRs whose jobs are legitimately
#                  not yet instantiated; this is about dispatched run liveness).
# Flow: guard (owner/collaborator, BEFORE anything runs) -> make check-zero-job-pending FILE=1
#       -> on a stuck run, file ONE deduped issue naming it.
# Never: never in a pull request, never gated by a PR, never merges, never cancels a run, never
#        weakens a gate.
on:
  schedule:
    - cron: "17,47 * * * *"   # twice an hour (odd minutes shared with no other bot, issue #275)
  workflow_dispatch:
    inputs:
      minutes:
        description: "flag runs pending/queued longer than this many minutes"
        required: false
        default: "30"

permissions:
  contents: read
  actions: read
  issues: write

# stacking is intended — each run files per-run issues idempotently (a marker each read back), so a
# race would read "no issue yet" on both sides and double-file (issue #917).
concurrency:
  group: zero-job-pending
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            if [ "$u" = "github-actions[bot]" ] && [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
              echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
              continue
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  monitor:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Name zero-job pending runs (file one deduped issue per stuck run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make check-zero-job-pending REPO="${{ github.repository }}" \
            MINUTES="${{ inputs.minutes || '30' }}" FILE=1
