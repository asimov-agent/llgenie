name: llgenie-hf-network — the daily real-Hub test pipeline (HF real-call tests, gated by the committed-link liveness check), never a PR or push check

# Issue #1000: the owner moved the real-call HF tests to their OWN pipeline — "the hf network tests
# must be part of another ci pipeline … they can't be part of ci unit anymore". Every test marked
# @pytest.mark.network is owned by THIS pipeline (ci-unit deselects them with `-m "not network"`; the
# network workflow runs the tester's seam, `make test-unit-network`, which runs exactly the
# network-marked set through the same discovery as unit — issue #393). Nothing here is a PR or a
# push check: a live-Hub flake or a rotating GGUF link must never red a pull request.
#
# The committed-link liveness gate (scripts/check_model_links_liveness.py, issue #1000) runs FIRST,
# with LIVE=1, over exactly the committed model/GGUF links the tests depend on, via
# tests/hub_probe.probe (#256) as the single authority: a dead URL is a NAMED message that fails
# the job, not a raw 404 and not a silent green. That gate is what makes this pipeline safe to run
# on a SCHEDULE rather than on every push — a dead link surfaces as a named failure on the next
# scheduled run, never as a silent rot.
# Flow: guard (owner / repository bot / collaborator with write, BEFORE any run) -> make test-env
#       (pull llgenie/test) -> make check-model-links LIVE=1 LIMIT=25 (liveness gate over the
#       pipeline's links) -> make test-unit-network (the @pytest.mark.network ownership set via the
#       tester's seam, scripts/unit_tests.py run --marker network, issue #393/1000); the job then
#       runs make test-clean. Order is the contract: a dead link fails the gate before any test runs,
#       so the red name is the URL, not a test's 404.
# Trigger surface: schedule daily 06:15 UTC (its own odd minute — no bot shares a slot, issue #275)
#                  and workflow_dispatch (owner / repository bot / collaborator with write), and
#                  NOTHING else — no pull_request and no push trigger (issue #1000).
# Never: never merges, never pushes to `main`, never runs in ci-unit, never gates a pull request or
#        a push, and never hand-edits a fixture (issue #987: fixtures regenerate via generators).
# dispatch: no inputs — the pipeline runs exactly the @pytest.mark.network ownership set, gated first
#           by the bounded liveness check; there is nothing to choose at dispatch time (issue #1000).
on:
  schedule:
    - cron: "15 6 * * *"    # daily 06:15 UTC — its own odd minute (issue #275: no bot shares a slot)
  workflow_dispatch:

permissions:
  contents: read

# concurrency: A bot never cancels an in-progress run (issue #275): the group is this workflow's own,
# and `cancel-in-progress` is false so a second scheduled run waits instead of killing one mid-test.
concurrency:
  group: llgenie-hf-network
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            if [ "$u" = "github-actions[bot]" ] && [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
              echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
              continue
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  hf-network:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # the seam's discovery needs the parent commit (unit-suite.json, issue #393)
      - uses: ./.github/actions/docker
        if: runner.os == 'Linux'
      - name: make test-env (Python 3.11 - Linux pulls llgenie/test from GHCR)
        run: make test-env
      - name: Liveness gate — every committed model/GGUF link a test depends on must resolve (issue #1000)
        run: make check-model-links LIVE=1 LIMIT=25
      - name: make test-unit-network (the @pytest.mark.network ownership set, via the seam, issue #1000)
        run: make test-unit-network
      - name: Prune orphaned test containers
        if: always()
        run: make test-clean
