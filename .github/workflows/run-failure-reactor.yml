name: run-failure-reactor — routes a failed run to a fix or a deduped issue (never merges)

# RUN-FAILURE-REACTOR — reacts to a FAILED CI run (issue #286): any run, not just a PR check.
#
# Trigger surface: `workflow_dispatch` ONLY (owner 2026-11-08, #2293). It used to run on
# `workflow_run: [completed]` over the repo's own workflows, and on a failed run with no pushable
# PR it filed a NEW issue on the board automatically. The owner's directive: a red PR is no longer
# an automatic issue factory — it is surfaced to a human, and the reactor runs only when a person
# dispatches it by hand. So the `workflow_run` trigger and its 32-name roster are gone, and the
# `gh issue create` arm below runs only on a human dispatch (its own header, issue #286, is
# updated to match — the old one said it was "reaction, not an action — so it carries no
# `workflow_dispatch`"; that is precisely what the owner reversed).
#
# The dispatch carries ONE required input, `run_id`: the completed run to route. A human dispatches
# with the run id (from `gh run list` / the Actions page), and the reactor reads the rest exactly as
# it did from `github.event.workflow_run` — the `run_id` replaces that event's id. There is no
# longer an automatic consumer, so `make check-workflows`' manual-only rule REFUSES a re-added
# `workflow_run`/`schedule` trigger in this file (#2293).
#
# Flow: guard (owner/collaborator, BEFORE any secret is read) -> the reactor step calls `make
#       run-failure-reactor` (scripts/run_failure_reactor.py), which decides in code (issue #107 —
#       never a job `if:` that can silently skip):
#         Route A — the failed run has a pushable same-repo PR: claim it (scripts/bot_claims.py,
#                    issues #279/#285) and dispatch the EXISTING fix-bot for it.
#         Route B — no pushable PR (a red main push, a red scheduled bot run, a red publish job):
#                    file ONE marker-deduped issue labelled with the OWNING LANE's label
#                    (classify_workflow, issue #2076) — a pipeline/gate/bot failure carries the
#                    ci-pipelines lane's label, a product failure keeps agent:implement, and an
#                    unclassified workflow is filed with no implementation label.
# Never: never repairs, commits, pushes or merges in the file-issue path — it files; the issue-bot
#        owns implementation, the fix-bot owns PR repair. A run it cannot diagnose is reported
#        loudly, never silently dropped.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "the completed CI run id to route to a fix or a deduped issue (from `gh run list` / the Actions page)"
        required: true
        type: string
      context:
        description: "what triggered this dispatch (a red PR, a red main push, a scan red) — recorded, not used by the route"
        required: false
        type: string
        default: "manual"

permissions:
  actions: write
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: run-failure-reactor
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          # The event + ref: on a `workflow_dispatch` the head repo is empty, so the bot's same-repo-head
          # intent is reached via event+ref instead (the all-pipelines sweep dispatching `main`, issue
          # #1571).
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            # It also passes on a `workflow_dispatch` of this repository (issue #1571): a dispatch can
            # only target this repository's own refs, and only this repository's own automation (a
            # workflow scoped `actions: write` dispatching via GITHUB_TOKEN) can make the bot the
            # actor of one — the same-repo-head intent reached via the event instead of the (empty)
            # HEAD_REPO. A workflow_dispatch is how the weekly all-pipelines sweep drives its targets.
            if [ "$u" = "github-actions[bot]" ]; then
              if [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
                echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
                continue
              fi
              if [ "${EVENT:-}" = "workflow_dispatch" ]; then
                echo "Repository bot $u on a workflow_dispatch of this repository - allowed."
                continue
              fi
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  react:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Route the failed run to a fix or a deduped issue
        env:
          # One credential for every written (issue #412): `github.token`, the repository-scoped
          # token this job's own `permissions:` block already grants the writes for. It posts the
          # claim/comment and files the issue with `issues: write` and dispatches the fix-bot with
          # `actions: write` — the owner PAT carries neither and died on both (issue #412, run
          # 42442836444). The dispatched fix-bot's actor is `github-actions[bot]`, which its own
          # guard now ADMITS on a `workflow_dispatch` of this repository (issue #1571) — so the
          # owner-PAT identity is no longer needed to pass it (issue #2091).
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          make run-failure-reactor REPO="$REPO" RUN_ID="$RUN_ID"

      - name: Report
        if: always()
        run: |
          echo "### run-failure-reactor" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Routed run ${{ inputs.run_id }} (see the reactor step above)." >> "$GITHUB_STEP_SUMMARY"
          echo "The reactor never merges; the issue-bot owns implementation, the fix-bot owns PR repair." >> "$GITHUB_STEP_SUMMARY"
