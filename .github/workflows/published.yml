name: published

# install-published, called from ci.yml for the Linux runner only (issue #120: macOS
# never runs an engine container, so it has no published images to test): after every image was built, tested, published and
# re-tested as published, the real `make install` per backend (cpu/cuda/rocm/vulkan
# mocked via LLAMA_BACKEND; GPU images run on CPU) may only PULL that backend's
# published images, llgenie answers "hi" through llama-server and prism-server,
# `llgenie --pick --engine` pulls the picked engine on first use, and make uninstall
# leaves nothing behind.
on:
  workflow_call:
    inputs:
      runner:
        description: runs-on label (ubuntu-latest)
        required: true
        type: string
      optional:
        description: unused; kept so an old caller still parses (issue #120: macOS is required)
        required: false
        default: false
        type: boolean
      pushed:
        description: >-
          "true" when this run built and pushed an image (issue #844). Anything else - a pull_request,
          which never publishes, or a push whose engine matrix was the `none` placeholder - selects the
          `none` row: the check name still reports, and the row states why it installed nothing.
        required: false
        default: "false"
        type: string

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  install-published:
    strategy:
      fail-fast: false
      # #844: the four install rows prove a PUSHED image, so they run only when this run pushed one.
      # The `none` placeholder keeps the family present (and the check names reporting) on every PR
      # without running a job whose subject cannot have changed - the same shape #828 gave the engine
      # family, and no job-level `if:` anywhere (`test_no_ci_step_or_job_is_skipped`).
      matrix:
        backend: ${{ inputs.pushed == 'true' && fromJSON('["cpu","cuda","rocm","vulkan"]') || fromJSON('["none"]') }}
    runs-on: ${{ inputs.runner }}
    continue-on-error: false
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    name: install-published-${{ matrix.backend }}
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      # Always runs, so the reason for the row is in the log whatever the row is. A silent skip is the
      # failure mode this repository keeps paying for: the check name alone never says why it did nothing.
      - name: Say which row this is, and why
        run: |
          if [ "${{ matrix.backend }}" = "none" ]; then
            echo "install-published-none: SKIPPED - no image pushed in this run (pushed=${{ inputs.pushed }})."
            echo "The four install rows run only when this run built and PUSHED an image, so their green"
            echo "means \"this PR's image installs\" rather than \"the registry still works\" (issue #844)."
          else
            echo "install-published-${{ matrix.backend }}: this run pushed an image (pushed=${{ inputs.pushed }}), so the published ${{ matrix.backend }} image is installed and checked here."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ matrix.backend != 'none' }}
      - name: make ci-free-disk (CUDA/ROCm images are large)
        if: ${{ matrix.backend != 'none' }}
        run: make ci-free-disk
      - uses: ./.github/actions/docker
        if: ${{ matrix.backend != 'none' }}
      - name: Log in to GHCR (read)
        if: ${{ matrix.backend != 'none' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: make test-env (pulls llgenie/test from GHCR)
        if: ${{ matrix.backend != 'none' }}
        run: make test-env
      - name: "make ci-engines BACKEND=${{ matrix.backend }} (make install pulls only this backend's images, llgenie hi via both shims + --pick --engine + interactive trend pick with a real GGUF download, uninstall)"
        if: ${{ matrix.backend != 'none' }}
        run: make ci-engines BACKEND=${{ matrix.backend }}
      - name: Prune orphaned test containers
        if: always()
        # The `none` row never starts a container (every step above is row-gated), and `make test-clean`
        # needs the docker action this row skips: measured 2026-10-28, the row FAILED in 4 s on step 9
        # after doing nothing, which is a red for a row that is supposed to prove nothing. The decision
        # lives in the shell, not in the `if:` - a compound `always() && …` is outside the conditions
        # `tests/test_ci_images.py` permits (row gates only).
        run: |
          if [ "${{ matrix.backend }}" = "none" ]; then
            echo "no containers to prune: the none row started none (issue #844)"
            exit 0
          fi
          make test-clean
