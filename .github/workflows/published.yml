name: published

# install-published, called from ci.yml for the Linux runner only (issue #120: macOS
# never runs an engine container, so it has no published images to test): after every image was built, tested, published and
# re-tested as published, the real `make install` per backend (cpu/cuda/rocm/vulkan
# mocked via LLAMA_BACKEND; GPU images run on CPU) may only PULL that backend's
# published images, llgenie answers "hi" through llama-server and prism-server,
# `llgenie --pick --engine` pulls the picked engine on first use, and make uninstall
# leaves nothing behind.
on:
  workflow_call:
    inputs:
      runner:
        description: runs-on label (ubuntu-latest)
        required: true
        type: string
      optional:
        description: unused; kept so an old caller still parses (issue #120: macOS is required)
        required: false
        default: false
        type: boolean

jobs:
  install-published:
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda, rocm, vulkan]
    runs-on: ${{ inputs.runner }}
    continue-on-error: false
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    name: install-published-${{ matrix.backend }}
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: make ci-free-disk (CUDA/ROCm images are large)
        run: make ci-free-disk
      - uses: ./.github/actions/docker
      - name: Log in to GHCR (read)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: make test-env (pulls llgenie/test from GHCR)
        run: make test-env
      - name: "make ci-engines BACKEND=${{ matrix.backend }} (make install pulls only this backend's images, llgenie hi via both shims + --pick --engine + interactive trend pick with a real GGUF download, uninstall)"
        run: make ci-engines BACKEND=${{ matrix.backend }}
      - name: Prune orphaned test containers
        if: always()
        run: make test-clean
