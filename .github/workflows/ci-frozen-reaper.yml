name: ci-frozen-reaper — cancel + re-run a run stuck in_progress past its threshold, every 2 hours

# Issue #1679: a run that hangs `in_progress` is invisible to BOTH healers — ci-requeue re-runs only
# cancelled runs, run-failure-reactor fires only on `conclusion: failure`. A frozen in_progress run
# matches neither predicate, so it blocks the PR verdict until a human intervenes (observed on #1671).
# This is the third, time-bounded trigger. It cancels + re-runs only a run whose `updated_at` is older
# than the threshold (default 90m) on an OPEN PR, and it posts the evidence (named owner, run id, both
# timestamps) to the PR thread BEFORE it cancels anything.

# Trigger surface: the every-2-hours schedule (minute 19 on six weekdays + minute 27 on Monday — the
# only odd, collision-free, all-day non-every-hour shape, issue #275/#301; an even minute is dropped
# by GitHub, #560) and `workflow_dispatch` — never a `pull_request` or a `push`: this workflow heals
# runs, it does not gate a change.
# Flow: `make ci-frozen-reaper` reads the in_progress runs, and collapses ONLY one that is both old
# (past the grace) AND non-advancing (updated_at older than the threshold) on an OPEN PR — posting the
# evidence comment first, then `gh run cancel` + `gh run rerun` for that one run.
# Never: never cancels a run that is still advancing (fresh updated_at) or younger than the grace, and
# never touches a push/schedule run (no open PR = not a PR verdict).
# dispatch: no inputs — the reaper takes no target: it sweeps every in_progress run. The threshold is a
# make variable (THRESHOLD=90m), not a dispatch input.
on:
  schedule:
    # Every 2 hours, all days: minute 19 on six weekdays + minute 27 on Monday. Every odd minute is
    # already owned on all 7 weekdays by an existing bot, an even minute is dropped by GitHub (#560),
    # and an every-hour cron would newly reserve a minute a day-specific bot already owns — so a
    # NON-every-hour shape on the two free minutes covering all weekdays is the only collision-free
    # cadence (issue #275/#301). A fresh sweep every 2h still collapses a run well inside the
    # 90m+15m threshold critical path.
    - cron: "19 */2 * * 0,2,3,4,5,6"
    - cron: "27 */2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # `gh run cancel` / `gh run rerun` are writes on the Actions API
  pull-requests: write # the evidence comment is posted to the PR thread

# a reaper round must never be cancelled by the next one — that is the bug; a collapsed round is evidence
concurrency:
  group: ci-frozen-reaper
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          # The event + ref: on a `workflow_dispatch` the head repo is empty, so the bot's same-repo-head
          # intent is reached via event+ref instead (the all-pipelines sweep dispatching `main`, issue
          # #1571).
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            # It also passes on a `workflow_dispatch` of this repository (issue #1571): a dispatch can
            # only target this repository's own refs, and only this repository's own automation (a
            # workflow scoped `actions: write` dispatching via GITHUB_TOKEN) can make the bot the
            # actor of one — the same-repo-head intent reached via the event instead of the (empty)
            # HEAD_REPO. A workflow_dispatch is how the weekly all-pipelines sweep drives its targets.
            if [ "$u" = "github-actions[bot]" ]; then
              if [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
                echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
                continue
              fi
              if [ "${EVENT:-}" = "workflow_dispatch" ]; then
                echo "Repository bot $u on a workflow_dispatch of this repository - allowed."
                continue
              fi
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  reap:
    name: reap
    needs: [guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
      - name: Collapse a run stuck in_progress past its threshold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make ci-frozen-reaper
      - name: Say what the round could not decide
        if: always()
        run: |
          echo "threshold=90m target=ci-frozen-reaper manual-equivalent=\"make ci-frozen-reaper DRY=1\""
