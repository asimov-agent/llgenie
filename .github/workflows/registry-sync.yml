name: registry-sync — syncs the vendored registry and regenerates the derived tables, then opens the PR

# Issue #105, #179: keep the vendored data/models.json (llgenie's trend pick) in
# sync with andyholst/trending-local-llms. Weekly cron, separate from the
# engine pin bump (engine-bump.yml, 23 6 * * 1). Opens or updates a PR when the
# file changed. An upstream engine with no llgenie skill is omitted from the
# offer; it does not fail this job. Never merges: a reviewer does.
#
# The sync job checks out, pushes and opens the PR with the owner PAT
# (secrets.BUMP_TOKEN), not GITHUB_TOKEN (issue #136). A PR authored by
# github-actions[bot] holds every pull_request workflow for manual approval,
# and a push made with GITHUB_TOKEN starts no workflows.
# Trigger surface: schedule weekly Monday 05:19 UTC (`19 5 * * 1`), and workflow_dispatch (owner/collaborator).
# Flow: guard -> make sync-registry -> make sync-quant-catalog -> make render-trend-list-matrix
#       -> make render-engine-skill-gap -> (when something changed) make check-registry,
#       check-quant-catalog, engine-skill-gap, skills-validate, test-unit -> make
#       spawn-engine-skill-issues -> push `chore/registry-sync` and open or update its PR.
#       The change issue and the per-engine spawn both run with `always()` (inside their `changed`
#       guard), so a RED gate still leaves the work items that explain it; the PR step stays gated
#       on the change alone (issue #758).
# Never: never merges, never pushes to `main`, never pushes a file the checks did not pass on.
# dispatch: no inputs — the sync has no modes: it always fetches the upstream registry, regenerates
#           every derived table, and opens or updates the same PR only when a file changed.
on:
  schedule:
    - cron: "19 5 * * 1"   # Monday 05:19 UTC (unique minute, issue #275)
  workflow_dispatch:

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            if [ "$u" = "github-actions[bot]" ] && [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
              echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
              continue
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  sync:
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          token: ${{ secrets.BUMP_TOKEN }}
      - name: make sync-registry
        run: make sync-registry
      - name: make sync-quant-catalog (regenerate the HF class table to match the registry)
        run: make sync-quant-catalog
      - name: make render-trend-list-matrix (the trending list per arch, vram, and ram)
        run: make render-trend-list-matrix
      - name: make render-engine-skill-gap (the per-engine list + the models no engine can offer)
        run: make render-engine-skill-gap
      - name: changed?
        id: diff
        run: |
          if git diff --quiet -- data/models.json data/trending-README.md data/trending-quant-catalog.json tests/fixtures/trending-quant-catalog.json tests/fixtures/trend-list-matrix.json data/engine-skill-gap.json; then echo "changed=" >> "$GITHUB_OUTPUT"; echo "data/models.json unchanged"
          else echo "changed=1" >> "$GITHUB_OUTPUT"; echo "utc=$(python3 -c 'import json;print(json.load(open("data/models.json"))["generated_utc"])')" >> "$GITHUB_OUTPUT"; fi
      - name: Build test image
        if: steps.diff.outputs.changed
        run: make test-image
      - name: make check-registry + check-quant-catalog + engine-skill-gap report + test-unit against the new registry
        if: steps.diff.outputs.changed
        # `make engine-skill-gap` NAMES a new unskilled engine instead of failing the
        # job: the sync must still carry the data (#219). The loud gate is
        # `make check-engine-skill-gap` in ci-unit, which this PR then fails until the
        # engine is shipped or its decision is recorded.
        run: |
          make check-registry
          make check-quant-catalog
          make engine-skill-gap
          # ci-unit's SCOPE (issue #319) — every shipped skill validated against the registry it is
          # about to be read with, and a decision in data/unsupported-engines.json honoured — with
          # ALLOW_NEW_ENGINES=1 (issue #683): an engine upstream has just started listing is CARRIED
          # here and named, not fatal. The step below opens one tracking issue per new engine, and
          # ci-unit's check-engine-skill-gap is what refuses it until the engine ships a skill or
          # gets a dated decision. Without the flag this job deadlocked: the store that names the
          # engine never landed, so the issue that would decide it never opened (measured: 16 new
          # engines on 2026-10-26, no sync PR since 2026-10-13).
          make skills-validate REGISTRY=data/models.json UNSUPPORTED=data/unsupported-engines.json ALLOW_NEW_ENGINES=1
          make test-unit
      - name: State what changed in ONE issue (runs even when a gate above is red)
        # issue #704: the analysis is most valuable exactly when the store cannot land, so this
        # step runs whatever the check step's outcome was. It UPDATEs the issue carrying this
        # store's generated_utc instead of filing another, so a re-run is idempotent.
        if: always() && steps.diff.outputs.changed
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: make sync-change-issue REPO="${{ github.repository }}"
      - name: Spawn one tracking issue per NEW unskilled engine (runs even when a gate above is red)
        # issue #758: a store that names an engine llgenie does not ship is EXACTLY the store whose
        # check step reds, so gating this on the check step's success suppressed the one work item
        # that explains how to un-red it. `always()` runs it whatever the gate above did; the
        # `changed` term keeps a no-change run filing nothing, and the recipe re-checks the diff
        # itself so the guard holds inside the step, not only in this condition.
        if: always() && steps.diff.outputs.changed
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: |
          if git diff --quiet -- data/models.json data/trending-README.md data/trending-quant-catalog.json tests/fixtures/trending-quant-catalog.json tests/fixtures/trend-list-matrix.json data/engine-skill-gap.json; then
            echo "no registry change in the working tree - nothing to spawn"
            exit 0
          fi
          make spawn-engine-skill-issues REPO="${{ github.repository }}"
      - name: Open / update the sync PR
        if: steps.diff.outputs.changed
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          UTC: ${{ steps.diff.outputs.utc }}
        run: |
          # Authored as one of the two identities a PR's commits may carry (`Asimov Agent`,
          # issue #345); `gh api user` would stamp the token owner's LOGIN instead, which is not an
          # allowed spelling and fails `make check-pr-authors` on this very PR. The push/PR keep
          # BUMP_TOKEN so the sync PR is opened by a real account and CI starts (issue #136).
          git config user.name "Asimov Agent"
          git config user.email "support@docondee.com"
          git switch -C chore/registry-sync
          git add data/models.json data/trending-README.md data/trending-quant-catalog.json tests/fixtures/trending-quant-catalog.json tests/fixtures/trend-list-matrix.json data/engine-skill-gap.json
          msg=$(printf 'Issue: the vendored registry (data/models.json, from andyholst/trending-local-llms) was stale — generated_utc %s.\n\nFix: re-synced the registry and regenerated every derived artifact (the quant catalog, the per-architecture / VRAM / RAM trend list, the per-engine list and the unskilled-engine gap), then re-ran the gates on the new files.\n\nBenefit: llgenie ranks and offers models from current upstream data instead of an aged copy.\n\nTechnical: make sync-registry + sync-quant-catalog + render-trend-list-matrix + render-engine-skill-gap, then check-registry, check-quant-catalog, engine-skill-gap, skills-validate and test-unit. The trend-list-matrix fixture diff is the new list llgenie --matrix shows.' "$UTC")
          git commit -m "chore(registry): sync data/models.json + quant catalog + README + trend list + engine-skill gap from trending-local-llms ($UTC)" -m "$msg"
          git push --force origin chore/registry-sync
          gap="$(make engine-skill-gap-md)"
          body="Automated sync of \`data/models.json\` from andyholst/trending-local-llms (\`generated_utc\` $UTC) by \`make sync-registry\`, with the trending-quant-catalog regenerated by \`make sync-quant-catalog\`, the trending list per architecture, VRAM, and RAM regenerated by \`make render-trend-list-matrix\`, and the per-engine list + unskilled-engine gap regenerated by \`make render-engine-skill-gap\`. The pull-request diff of \`tests/fixtures/trend-list-matrix.json\` is the new list llgenie --matrix shows. check-registry, check-quant-catalog, \`make engine-skill-gap\`, skills-validate and test-unit passed on the new files. Issue #105, #122, #179, #229.

          ${gap}

          An engine llgenie does not ship is tolerated ONLY when it is a dated decision in \`data/unsupported-engines.json\`; a NEW one fails \`make check-engine-skill-gap\` in ci-unit until it ships a skill or its decision is recorded, and this run opened one tracking issue per new engine (issue #229). Reviewers: decide each new engine here."
          if gh pr view chore/registry-sync --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit chore/registry-sync --title "chore(registry): sync models.json ($UTC)" --body "$body"
          else
            gh pr create --base main --head chore/registry-sync --title "chore(registry): sync models.json ($UTC)" --body "$body"
          fi
