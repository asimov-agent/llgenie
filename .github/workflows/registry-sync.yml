name: registry-sync

# Issue #105: keep the vendored data/models.json (llgenie's trend pick) in sync
# with andyholst/trending-local-llms. Daily + on demand; opens or updates a PR
# from chore/registry-sync when the file changed. Never merges: a reviewer does.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only collaborators, bots, and owners may trigger
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$ACTOR" = "github-actions[bot]" ] || [ "$ACTOR" = "$OWNER" ]; then
            echo "allowed"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/collaborators/$ACTOR")
          if [ "$code" = "204" ]; then
            echo "actor $ACTOR is a collaborator"
          else
            echo "::error::actor $ACTOR is not a collaborator, bot, or owner; refusing to run"
            exit 1
          fi

  sync:
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: make sync-registry
        run: make sync-registry
      - name: make sync-quant-catalog (regenerate the HF class table to match the registry)
        run: make sync-quant-catalog
      - name: changed?
        id: diff
        run: |
          if git diff --quiet -- data/models.json data/trending-README.md tests/fixtures/trending-quant-catalog.json; then echo "changed=" >> "$GITHUB_OUTPUT"; echo "data/models.json unchanged"
          else echo "changed=1" >> "$GITHUB_OUTPUT"; echo "utc=$(python3 -c 'import json;print(json.load(open("data/models.json"))["generated_utc"])')" >> "$GITHUB_OUTPUT"; fi
      - name: Build test image
        if: steps.diff.outputs.changed
        run: make test-image
      - name: make check-registry + check-quant-catalog + skills-validate + test-unit against the new registry
        if: steps.diff.outputs.changed
        run: |
          make check-registry
          make check-quant-catalog
          make skills-validate REGISTRY=data/models.json
          make test-unit
      - name: Open / update the sync PR
        if: steps.diff.outputs.changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UTC: ${{ steps.diff.outputs.utc }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C chore/registry-sync
          git add data/models.json data/trending-README.md tests/fixtures/trending-quant-catalog.json
          git commit -m "chore(registry): sync data/models.json + quant catalog + README from trending-local-llms ($UTC)"
          git push --force origin chore/registry-sync
          body="Automated sync of \`data/models.json\` from andyholst/trending-local-llms (\`generated_utc\` $UTC) by \`make sync-registry\`, with the trending-quant-catalog regenerated by \`make sync-quant-catalog\`. check-registry, check-quant-catalog, skills-validate and test-unit passed on the new files. Issue #105, #122."
          if gh pr view chore/registry-sync --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit chore/registry-sync --title "chore(registry): sync models.json ($UTC)" --body "$body"
          else
            gh pr create --base main --head chore/registry-sync --title "chore(registry): sync models.json ($UTC)" --body "$body"
          fi
