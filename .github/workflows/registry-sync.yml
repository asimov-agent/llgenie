name: registry-sync

# Issue #105, #179: keep the vendored data/models.json (llgenie's trend pick) in
# sync with andyholst/trending-local-llms. Weekly cron, separate from the
# engine pin bump (engine-bump.yml, 23 6 * * 1). Opens or updates a PR when the
# file changed. An upstream engine with no llgenie skill is omitted from the
# offer; it does not fail this job. Never merges: a reviewer does.
#
# The sync job checks out, pushes and opens the PR with the owner PAT
# (secrets.BUMP_TOKEN), not GITHUB_TOKEN (issue #136). A PR authored by
# github-actions[bot] holds every pull_request workflow for manual approval,
# and a push made with GITHUB_TOKEN starts no workflows.
on:
  schedule:
    - cron: "19 5 * * 1"   # Monday 05:19 UTC (unique minute, issue #275)
  workflow_dispatch:

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only collaborators, bots, and owners may trigger
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$ACTOR" = "github-actions[bot]" ] || [ "$ACTOR" = "$OWNER" ]; then
            echo "allowed"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/collaborators/$ACTOR")
          if [ "$code" = "204" ]; then
            echo "actor $ACTOR is a collaborator"
          else
            echo "::error::actor $ACTOR is not a collaborator, bot, or owner; refusing to run"
            exit 1
          fi

  sync:
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.BUMP_TOKEN }}
      - name: make sync-registry
        run: make sync-registry
      - name: make sync-quant-catalog (regenerate the HF class table to match the registry)
        run: make sync-quant-catalog
      - name: make render-trend-list-matrix (the trending list per arch, vram, and ram)
        run: make render-trend-list-matrix
      - name: make render-engine-skill-gap (the per-engine list + the models no engine can offer)
        run: make render-engine-skill-gap
      - name: changed?
        id: diff
        run: |
          if git diff --quiet -- data/models.json data/trending-README.md data/trending-quant-catalog.json tests/fixtures/trending-quant-catalog.json tests/fixtures/trend-list-matrix.json data/engine-skill-gap.json; then echo "changed=" >> "$GITHUB_OUTPUT"; echo "data/models.json unchanged"
          else echo "changed=1" >> "$GITHUB_OUTPUT"; echo "utc=$(python3 -c 'import json;print(json.load(open("data/models.json"))["generated_utc"])')" >> "$GITHUB_OUTPUT"; fi
      - name: Build test image
        if: steps.diff.outputs.changed
        run: make test-image
      - name: make check-registry + check-quant-catalog + engine-skill-gap report + test-unit against the new registry
        if: steps.diff.outputs.changed
        # `make engine-skill-gap` NAMES a new unskilled engine instead of failing the
        # job: the sync must still carry the data (#219). The loud gate is
        # `make check-engine-skill-gap` in ci-unit, which this PR then fails until the
        # engine is shipped or its decision is recorded.
        run: |
          make check-registry
          make check-quant-catalog
          make engine-skill-gap
          make skills-validate
          make test-unit
      - name: Spawn one tracking issue per NEW unskilled engine
        if: steps.diff.outputs.changed
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: make spawn-engine-skill-issues REPO="${{ github.repository }}"
      - name: Open / update the sync PR
        if: steps.diff.outputs.changed
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          UTC: ${{ steps.diff.outputs.utc }}
        run: |
          git config user.name "$(gh api user --jq .login)"
          git config user.email "$(gh api user --jq .id)+$(gh api user --jq .login)@users.noreply.github.com"
          git switch -C chore/registry-sync
          git add data/models.json data/trending-README.md data/trending-quant-catalog.json tests/fixtures/trending-quant-catalog.json tests/fixtures/trend-list-matrix.json data/engine-skill-gap.json
          git commit -m "chore(registry): sync data/models.json + quant catalog + README + trend list + engine-skill gap from trending-local-llms ($UTC)"
          git push --force origin chore/registry-sync
          gap="$(python3 scripts/engine_skill_gap.py report --md)"
          body="Automated sync of \`data/models.json\` from andyholst/trending-local-llms (\`generated_utc\` $UTC) by \`make sync-registry\`, with the trending-quant-catalog regenerated by \`make sync-quant-catalog\`, the trending list per architecture, VRAM, and RAM regenerated by \`make render-trend-list-matrix\`, and the per-engine list + unskilled-engine gap regenerated by \`make render-engine-skill-gap\`. The pull-request diff of \`tests/fixtures/trend-list-matrix.json\` is the new list llgenie --matrix shows. check-registry, check-quant-catalog, \`make engine-skill-gap\`, skills-validate and test-unit passed on the new files. Issue #105, #122, #179, #229.

          ${gap}

          An engine llgenie does not ship is tolerated ONLY when it is a dated decision in \`data/unsupported-engines.json\`; a NEW one fails \`make check-engine-skill-gap\` in ci-unit until it ships a skill or its decision is recorded, and this run opened one tracking issue per new engine (issue #229). Reviewers: decide each new engine here."
          if gh pr view chore/registry-sync --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit chore/registry-sync --title "chore(registry): sync models.json ($UTC)" --body "$body"
          else
            gh pr create --base main --head chore/registry-sync --title "chore(registry): sync models.json ($UTC)" --body "$body"
          fi
