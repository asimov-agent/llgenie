name: search-smoke — one real Firecrawl request proves the masked web reach

# Issue #381 (follow-up of #362 / the parent #357). FIRECRAWL_API_KEY reaches the agent image by
# NAME only (the Makefile's ONE `AGENT_SHELL_KEYS` list plus the `_HERMES_FORCE_<NAME>` seam,
# issue #358), and `make search-smoke` proves the masked fetch with ONE real request. While the
# repository secret did not exist the target was human-run only and recorded in
# `tests/fixtures/host-only-wiring.json`; that entry is DELETED with this change, because
# check-wiring fails a recorded exception CI now reaches.
#
# Trigger surface: schedule daily 07:11 UTC (`11 7 * * *`, an odd minute, its own slot — issue #275),
#                  and workflow_dispatch (owner/collaborator).
# dispatch: no inputs — the smoke takes no target: it always proves the same leg with one request.
# Flow: guard (owner/collaborator, BEFORE any secret is read) -> make agent-shell-keys-check
#       AGENT_SHELL_CHECK_KEYS=FIRECRAWL_API_KEY (the AGENT's own shell must see the key, issue #358)
#       -> make search-smoke (one bounded request; 401/402/403 and an empty 200 are LOUD failures)
#       -> make web-coverage (the URLs a bot run depends on must resolve, issue #380).
# Never: never merges, never pushes, never prints the key — the leg reads it from the environment and
#        scripts/scrub_log.py redacts the transcript.
on:
  schedule:
    - cron: "11 7 * * *"   # daily 07:11 UTC (an odd minute, its own slot, issue #275)
  workflow_dispatch:

permissions:
  contents: read

# concurrency: superseding is safe — one bounded request proves the same leg every time, so a newer run
# subsumes an older one instead of waiting behind it and burning a runner slot for a result nobody will read
# (issue #917).
concurrency:
  group: search-smoke
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            if [ "$u" = "github-actions[bot]" ] && [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
              echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
              continue
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  smoke:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Both keys travel by NAME into the container (`docker run -e`), never on a command line and
    # never baked into the image; the `_HERMES_FORCE_<NAME>` twin is exported by the Makefile.
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The agent's own shell must see the key before the smoke spends it (issue #358)
        run: make agent-shell-keys-check AGENT_SHELL_CHECK_KEYS=FIRECRAWL_API_KEY
      - name: One real request, hard budget, loud on 401/402/403 — never an empty result
        run: make search-smoke
      - name: The URLs a bot run depends on must resolve (issue #380) — no model call, no key
        run: make web-coverage
