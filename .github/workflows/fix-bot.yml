# PR fix-bot (issue #222): repair a red PR with Hermes, re-check, stop.
#
# Triggered by `workflow_dispatch` ONLY (by hand, or by the run-failure-reactor's dispatch call).
# Its OWN `schedule` and `workflow_run` triggers are gone — owner directive 2026-11-08 (#2293): a
# red PR is no longer an automatic issue/repair factory, so the bot runs only when a person (or a
# human-dispatched reactor) starts it. A re-added non-dispatch trigger makes `make check-workflows`
# FAIL (#2293). There is no conditional job in ci.yml either, because issue #107 requires that
# decision to live in code (scripts/fix_bot_sweep.py), not in a job `if:` that can silently skip a job.
#
# The loop (scripts/fix_loop.sh) runs the failing check, hands the failure to Hermes,
# re-checks, up to FIX_ROUNDS (default 3) — and NEVER commits or pushes. This workflow
# pushes the working tree as ONE commit only when the loop ends green, with the owner
# PAT so the push re-triggers CI, and never merges: a human reviews the result.
#
# Time budget: the loop can run FIX_ROUNDS rounds, and each round is the failing check
# plus an agent repair. `make ci-unit` (the default check) is measured at 11-20 minutes on
# a linux runner depending on container pulls, and a repair that reads AGENTS.md, edits and
# re-runs the gates is 10-30 minutes, so the worst case is 3 x (20 + 30) = 150 minutes —
# which a 120-minute job cap would cut off mid-round, leaving a CANCELLED run instead of the
# loop's own "still failing after N attempts" verdict. The job therefore allows 180 minutes
# (under GitHub's 360-minute ceiling for hosted runners). Nothing tighter bounds it: there
# are no step-level `timeout-minutes` here, `scripts/fix_loop.sh` imposes no per-round
# timeout, and Hermes is given no step or wall-clock cap (`hermes -z ... --yolo`).
# tests/test_bot_time_budget.py asserts this arithmetic against the loop's own default.
#
# Local equivalent (repo checked out on the PR branch):
#   NOUS_API_KEY=... FIX_ROUNDS=3 scripts/fix_loop.sh
name: fix-bot — repairs a failing PR branch until its checks pass (never merges)

# Trigger surface: `workflow_dispatch` only (by hand or by the run-failure-reactor's dispatch call).
# Flow: guard (owner/collaborator, BEFORE any secret is read) -> make fix-bot-sweep (decide which PR
#       deserves the bot) -> make fix-loop-image (run the failing check, hand it to Hermes, re-check,
#       up to `rounds`) -> push the green tree as ONE commit -> make fix-bot-report (comment).
# Never: never merges, never pushes to `main`, never commits or pushes a tree whose check is still
#        red, never loops past `rounds` attempts.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number whose branch should be repaired"
        required: false
        default: ""
      branch:
        description: "PR head branch (used when pr_number is empty)"
        required: false
        default: ""
      check:
        description: "the deterministic check to drive the loop"
        required: false
        default: "make ci-unit"
      rounds:
        description: "repair attempts (default 5)"
        required: false
        default: "5"
      report_file:
        description: "path to the failed run's captured log (repair context; empty = run the check locally)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: read

# concurrency: stacking is intended — it pushes a repair branch for a red PR and re-checks it, so two runs on
# the same PR would race the same ref and the second could revert the first's fix; the queued run re-reads the
# PR's checks when it starts (issue #917).
concurrency:
  group: fix-bot-${{ inputs.pr_number || inputs.branch }}
  cancel-in-progress: false

jobs:
  fix:
    # Only a real dispatch (a human's, or the run-failure-reactor's) repairs a PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # FIX_ROUNDS rounds x (check + agent); see the header for the measured arithmetic.
    timeout-minutes: 260
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
      # The JEV/provider key for the decision layer the agent image carries (issue #238):
      # fewer LLM calls, fewer tokens, fewer mistakes per repair. Run-time only, exactly like
      # NOUS_API_KEY: it travels into the container with `-e` and is never baked into the
      # image. `make fix-loop-image` runs the preflight first: it reports whether the layer is
      # available and never stops the repair (a missing key is annotated as a warning).
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      FIX_ROUNDS: ${{ inputs.rounds || '3' }}
      FIX_CHECK: ${{ inputs.check || 'make ci-unit' }}
      # The failed run's log, when a dispatch carried it (issue #538).
      REPORT_FILE: ${{ inputs.report_file }}
    steps:
      # ---------------------------------------------------------------- guards
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          # The event + ref: on a `workflow_dispatch` the head repo is empty, so the bot's same-repo-head
          # intent is reached via event+ref instead (the all-pipelines sweep dispatching `main`, issue
          # #1571).
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            # It also passes on a `workflow_dispatch` of this repository (issue #1571): a dispatch can
            # only target this repository's own refs, and only this repository's own automation (a
            # workflow scoped `actions: write` dispatching via GITHUB_TOKEN) can make the bot the
            # actor of one — the same-repo-head intent reached via the event instead of the (empty)
            # HEAD_REPO. A workflow_dispatch is how the weekly all-pipelines sweep drives its targets.
            if [ "$u" = "github-actions[bot]" ]; then
              if [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
                echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
                continue
              fi
              if [ "${EVENT:-}" = "workflow_dispatch" ]; then
                echo "Repository bot $u on a workflow_dispatch of this repository - allowed."
                continue
              fi
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
      - name: Resolve the PR branch (never main)
        id: pr
        env:
          REPO: ${{ github.repository }}
          IN_PR: ${{ inputs.pr_number }}
          IN_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [ -n "$IN_PR" ]; then
            read -r num branch < <(gh pr view "$IN_PR" --repo "$REPO" --json number,headRefName \
              -q '.number, .headRefName' | paste -sd' ' -)
          else
            read -r num branch < <(gh pr list --repo "$REPO" --head "$IN_BRANCH" --state open \
              --json number,headRefName -q '.[0] | .number, .headRefName' | paste -sd' ' -)
          fi
          case "$branch" in
            ""|main|master) echo "No open PR branch resolved (or it is $branch) — nothing to fix; the bot never touches main."; exit 0 ;;
          esac
          echo "PR #$num -> branch '$branch'"
          # The head repository decides which remote the repair is pushed to (issue #340): every
          # llgenie PR comes from the fork, and pushing it to `origin` would leave a stray branch.
          read -r headowner headrepo < <(gh pr view "$num" --repo "$REPO" \
            --json headRepositoryOwner,headRepository \
            -q '.headRepositoryOwner.login, .headRepository.nameWithOwner' | paste -sd' ' -)
          echo "head owner: ${headowner:-?} repo: ${headrepo:-?}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "number=$num" >> "$GITHUB_OUTPUT"
          echo "headowner=$headowner" >> "$GITHUB_OUTPUT"
          echo "headrepo=$headrepo" >> "$GITHUB_OUTPUT"

      - name: Checkout with the owner PAT (so the push re-triggers CI)
        if: steps.pr.outputs.branch != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          token: ${{ secrets.BUMP_TOKEN }}
          fetch-depth: 0

      # The PR's branch may live on the fork this bot may push to (`--own-fork`, issue #340). The
      # base checkout above is on `main`; this fetches the branch from its OWN remote and checks it
      # out, and records which remote the push must target.
      - name: Check the PR branch out from its head remote
        if: steps.pr.outputs.branch != ''
        env:
          BUMP_TOKEN: ${{ secrets.BUMP_TOKEN }}
          HEAD_REPO_NAME: ${{ steps.pr.outputs.headrepo }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$HEAD_REPO_NAME" ] || [ "${HEAD_REPO_NAME,,}" = "${BASE_REPO,,}" ]; then
            echo "REMOTE=origin" >> "$GITHUB_ENV"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git remote add fork "https://x-access-token:${BUMP_TOKEN}@github.com/${HEAD_REPO_NAME}.git" 2>/dev/null || \
              git remote set-url fork "https://x-access-token:${BUMP_TOKEN}@github.com/${HEAD_REPO_NAME}.git"
            git fetch fork "$BRANCH" --quiet
            git checkout -B "$BRANCH" "fork/$BRANCH"
            echo "REMOTE=fork" >> "$GITHUB_ENV"
          fi

      # ------------------------------------------------------------- the loop
      - name: Resolve the agent image (GHCR :latest, the tag publish points at the content hash)
        id: agent
        if: steps.pr.outputs.branch != ''
        run: |
          set -euo pipefail
          image=$(make agent-image-ref)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "agent image: $image"

      - name: Prove the JEV engine is active — the loop does not start without it (issue #238)
        run: make agent-jev-preflight NERVE_REQUIRE=1

      # Hermes strips provider credentials from its terminal tool, so `-e NOUS_API_KEY`
      # reaches the container while the AGENT's shell reads it EMPTY — a bot that then does
      # nothing while this run stays green (issue #358). Prove the agent can see what this
      # job forwards, and stop in seconds instead of after a 180-minute run.
      - name: Prove the agent's shell can see this job's credentials (issue #358)
        run: make agent-shell-keys-check AGENT_SHELL_CHECK_KEYS="NOUS_API_KEY GH_TOKEN TYPESAFE_API_KEY"
      - name: Sync the PR's branch with latest upstream main before repairing it (issue #303)
        id: sync
        run: |
          set +e
          make bot-sync-branch
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "2" ]; then
            echo "::notice title=Sync conflict::the PR does not rebase cleanly onto main; left to the rebase-bot (issue #246)"
          elif [ "$rc" != "0" ]; then
            echo "::error title=Sync failed::could not sync with upstream main (rc=$rc) - refusing to repair a stale base"
            exit "$rc"
          fi

      - name: Run the fix loop INSIDE the agent image (check -> repair -> re-check)
        id: loop
        if: steps.pr.outputs.branch != ''
        continue-on-error: true
        env:
          AGENT_IMAGE: ${{ steps.agent.outputs.image }}
        run: |
          set -o pipefail
          # The bot runs in the agent image (Hermes + git + gh + docker CLI), never on the
          # runner's whatever-is-installed. make agent-image-ref prints GHCR :latest, the
          # tag publish points at the current content hash.
          make fix-loop-image AGENT_IMAGE="$AGENT_IMAGE" LOG=/tmp/fix-loop.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------- publish
      # The whole point of the redaction seam (issue #359): the job publishes the REDACTED
      # transcript, never the raw capture (which holds the unredacted stream by construction).
      - name: Upload the REDACTED agent transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-transcript-redacted
          path: hermes-run.scrubbed.log
          if-no-files-found: ignore
      - name: The tree must not be left dirty without a commit
        if: steps.pr.outputs.branch != '' && steps.loop.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "The loop ended green with no changes — nothing to push."
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Push the repair as ONE commit (only when the loop ended green)
        id: push
        if: steps.pr.outputs.branch != '' && steps.loop.outcome == 'success'
        run: |
          set -euo pipefail
          git status --porcelain
          git diff --stat
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          # The commit is authored as one of the two identities a PR's commits may carry
          # (`Asimov Agent`, issue #345): an off-allowlist author fails `make check-pr-authors`,
          # so a repair pushed as anything else would red the very PR it repairs. The identity comes
          # from the ONE seam (issue #840) instead of a `-c` literal — a `-c` flag overrides every
          # config layer by design, which is how `andy@asimov.local` reached a head once.
          make git-identity-apply
          git commit -am "fix(bot): repair the failing check (#222)

          Repaired by the PR fix-bot loop (scripts/fix_loop.sh): the check ran, Hermes
          was handed the failure and the repo rules, and the check was re-run until it
          passed — all checks in the same round are the deterministic CI commands, and
          nothing was mocked, weakened or skipped."
          # the sync may have rewritten history (a rebase), so the push is guarded: if another bot
          # pushed meanwhile, this is REJECTED loudly instead of clobbering it (issue #303).
          # REMOTE is the PR's OWN head remote (fork or origin), set when the branch was checked
          # out: pushing a fork PR to origin would leave a stray branch (issue #340).
          git push --force-with-lease "${REMOTE:-origin}" "HEAD:${BRANCH}"
          echo "pushed=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}

      # The body a repair leaves behind must satisfy the same gate as a fresh PR (issue #2050): the
      # preflight pair is re-measured and re-written when the branch was synced onto the latest main
      # (a sync moves the base; a repair that could not sync keeps the base it opened with).
      - name: "Re-stamp the repaired PR body with the preflight AGENTS/BASE pair (issue #2050)"
        id: stamp
        if: steps.pr.outputs.number != '' && steps.push.outputs.pushed != '' && steps.sync.outputs.rc == '0'
        env:
          NUM: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr view "$NUM" --repo "${{ github.repository }}" --json body -q .body > /tmp/pr-body.md
          cp /tmp/pr-body.md /tmp/pr-body.before.md
          make bot-stamp-body BODY=/tmp/pr-body.md
          if cmp -s /tmp/pr-body.before.md /tmp/pr-body.md; then
            echo "stamped=0" >> "$GITHUB_OUTPUT"
          else
            gh pr edit "$NUM" --repo "${{ github.repository }}" --body-file /tmp/pr-body.md
            echo "stamped=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment the outcome on the PR
        if: always() && steps.pr.outputs.number != ''
        env:
          NUM: ${{ steps.pr.outputs.number }}
          OUTCOME: ${{ steps.loop.outcome }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          REPORT: /tmp/fix-report.txt
        run: |
          set -uo pipefail
          {
            if [ "$OUTCOME" = "success" ] && [ -n "${PUSHED:-}" ]; then
              echo "The fix-bot ran \`${FIX_CHECK}\`, repaired the failure, and the check is GREEN again."
              echo
              echo "Pushed \`${PUSHED}\` as one commit with the owner PAT, so CI re-runs on the new head. A human still reviews — the bot never merges."
            elif [ "$OUTCOME" = "success" ]; then
              # issue #2050: the loop's own verdict is not the fact. A green loop with a clean tree
              # pushed NOTHING, and claiming a push that never landed is what #2051 measured.
              echo "The fix-bot ran \`${FIX_CHECK}\` and ended green with NO tree change to commit — the PR head did not move, so there is nothing new to re-test. A human still reviews — the bot never merges."
            else
              make fix-bot-report REPORT="$REPORT" CHECK="$FIX_CHECK" 2>/dev/null \
                || echo "The fix-bot ran \`${FIX_CHECK}\` and it is still failing after ${FIX_ROUNDS} attempts; leaving it for a human."
            fi
            echo
            echo "_fix-bot: check \`${FIX_CHECK}\`, up to ${FIX_ROUNDS} attempt(s), never merges (issue #222)._"
            echo
            # RELEASE the claim (scripts/bot_claims.py, issues #279/#285): a repair that ends - green
            # or exhausted - has to say so, or the PR stays claimed for the whole TTL and the
            # rebase-bot never touches it. The claim is what the other bots read; this is its end.
            PYTHONPATH=scripts python3 -c "import datetime as dt, bot_claims; print(bot_claims.done_comment(bot_claims.FIXER, dt.datetime.now(dt.timezone.utc), 'fixed' if '${OUTCOME}' == 'success' else 'gave-up'))"
          } > /tmp/fix-comment.md
          gh pr comment "$NUM" --repo "${{ github.repository }}" --body-file /tmp/fix-comment.md

