# ENGINE-BUILD — builds and verifies EVERY engine image at its committed pin, in parallel, on demand.
#
# Issue #614: ci.yml builds only the images a PR CHANGED (`CHANGED=<base>`), which is the right merge
# gate but means no run ever exercises the whole pinned set — a stale-but-unbuildable pin, or an
# image that drifted from its params, is only discovered when that engine is next touched. This
# workflow is the independent whole-set sweep: one matrix row per engine x variant, straight from
# `containers/engines/params/*.json`, built and tested through the same make targets CI uses.
#
# It is NOT part of ci.yml on purpose: a full sweep is minutes x 27 rows and belongs to a maintainer
# asking "are all the pins good?", not to every pull request. ci.yml keeps its changed-images gate.
#
# Trigger surface: `workflow_dispatch` ONLY (owner/collaborator), nothing schedules it. Inputs narrow
#                  the sweep: `engine` (one id, empty = all), `arch` (one backend, empty = all),
#                  `push` (publish the built images to GHCR; default false = build and verify only),
#                  and `force` (rebuild from scratch with --no-cache instead of reusing a cached or
#                  already-available image; default false). `force=true` + `push=true` is how every
#                  tag is republished from a clean build — each image is published under its hash tag,
#                  its moving `:<arch>` tag, and (canonical variant only) `:latest`.
# Flow: guard (owner / collaborator with write, BEFORE any secret is read) -> make engine-build-matrix
#       (the committed params -> one row per engine x variant; the make target is the only list) ->
#       per row: make build-engine ENGINE= ARCH= (build only, never publishing) ->
#       make test-engine-stage ENGINE= ARCH= TEST=<row.test> (serve: the engine binary smoke
#       make test-engine — the binary in the built image answers the flags it documents, the
#       DEFAULT engine-build gate (issue #1717), never a serving-readiness wait; detect: GPU —
#       the binary reports its version and answers the flags a user types) ->
#       make push-engine ENGINE= ARCH= (ONLY when push=true, and only after that test passed;
#       push-engine re-checks the binary's flags before it pushes) ->
#       make test-published-engine ENGINE= ARCH= (published-binary-leg: pull the JUST-published image,
#       digest == :ARCH, verify the engine BINARY answers -h/--version only — no server is started in CI,
#       issue #2319) ->
#       make test-engine-install ENGINE= ARCH= (install-leg: install + the installed launcher's engine
#       version (test-built-engine) + uninstall the image this row just published; the product
#       `llgenie --dry` (ci-install-dry) is NOT here — the producer is product-LESS (#1027), the tool
#       installs in pipeline.yml's ci-install, which already drives it). The cuda install-leg is NOT
#       exercisable on GitHub-hosted (GPU-less) `ubuntu-latest` runners — it needs an NVIDIA GPU on
#       the run host to docker-run `--device nvidia.com/gpu=all` — and SKIPS there with a documented
#       reason (issue #1240); it runs on a GPU+CDI-capable host.
#       Serving is NOT exercised in CI (issue #2319): the published engine's binary is verified with
#       -h/--version only. The host-only serve test (make test-engine-host / make test-engine-serve)
#       is run manually by the llgenie-engine-improver.
# Never: never merges, never pushes to `main`, never runs on a schedule, never publishes an image
#        whose binary has not answered its test, and never builds the `none` placeholder row.
#
# QUEUEING. A build-and-verify run serialises only with the SAME engine/arch selection, so a narrow
#        dispatch runs while a full sweep is going; every PUBLISHING run shares one global group so two
#        pushes cannot race on the same `:<arch>` tag. Before #621 the group was the constant
#        `engine-build`, so a narrow dispatch was created with zero jobs and no runner until the sweep
#        finished — indistinguishable from a dispatcher that does not work (run 40199747645).
name: engine-build — builds and verifies EVERY engine at its committed pin, in parallel (never merges)

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Engine id to sweep (e.g. llama.cpp); empty = every engine in the committed params"
        required: false
        default: ""
      arch:
        description: "One backend to sweep (cpu|cuda|rocm|vulkan); empty = every variant of each engine"
        required: false
        default: ""
      push:
        description: "Publish the built images to GHCR (true) or build and verify only (false)"
        required: false
        default: "false"
      force:
        description: "Rebuild from scratch, ignoring the layer cache (true) or reuse a cached/available image (false)"
        required: false
        default: "false"
      producer_run:
        description: "Run id of the workflow instance that fired this dispatch (issue #2578); registry-liveness passes its own github.run_id. A human/PR-lane dispatch leaves it empty and the provenance step records the actor instead."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# concurrency: stacking is intended — it builds and publishes images at their pins, so a second run would rebuild what the first is publishing (issue #917).
concurrency:
  # A run that PUBLISHES serialises globally: two pushes could race on the same :<arch> tag and one
  # would overwrite the other's image. A build-and-verify run serialises only with the SAME selection,
  # so a narrow dispatch does not sit behind a four-hour sweep with ZERO jobs and no runner — measured:
  # `engine=llama.cpp arch=cpu push=false` dispatched as run 40199747645 waited, 0 jobs, behind the
  # full sweep 40199122842 (#621).
  group: engine-build-${{ inputs.push == 'true' && 'push' || format('build-{0}-{1}', inputs.engine, inputs.arch) }}
  cancel-in-progress: false
  # queue: max — a pending push run is never superseded by the next dispatch. GitHub's default
  # `queue: single` cancels-and-replaces a PENDING run in the group on every newer run, so a bump's
  # producer (queued behind a live build) was killed the instant a sibling re-dispatched — six engine
  # bumps red with "producer cancelled — nothing to wait for" (#2294). `cancel-in-progress: false`
  # protects only the RUNNING run, so the queue key is the load-bearing one for pending producers.
  # With `max` the group holds up to 100 pending runs FIFO and each reaches a real conclusion.
  queue: max

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          # The event + ref: on a `workflow_dispatch` the head repo is empty, so the bot's same-repo-head
          # intent is reached via event+ref instead (the all-pipelines sweep dispatching `main`, issue
          # #1571).
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            # It also passes on a `workflow_dispatch` of this repository (issue #1571): a dispatch can
            # only target this repository's own refs, and only this repository's own automation (a
            # workflow scoped `actions: write` dispatching via GITHUB_TOKEN) can make the bot the
            # actor of one — the same-repo-head intent reached via the event instead of the (empty)
            # HEAD_REPO. A workflow_dispatch is how the weekly all-pipelines sweep drives its targets.
            if [ "$u" = "github-actions[bot]" ]; then
              if [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
                echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
                continue
              fi
              if [ "${EVENT:-}" = "workflow_dispatch" ]; then
                echo "Repository bot $u on a workflow_dispatch of this repository - allowed."
                continue
              fi
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

      - name: Dispatch provenance (#2578 — every engine-build run names the run that fired it)
        run: |
          producer="${{ inputs.producer_run }}"
          if [ -n "$producer" ]; then
            echo "dispatched_by_run=$producer"
            echo "Dispatched by run $producer (producer_run dispatch input, issue #2578)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dispatched_by_run=none-recorded actor=${{ github.triggering_actor }}"
            echo "No producer run recorded; dispatched by ${{ github.triggering_actor }} (human or PR-lane re-drive)." >> "$GITHUB_STEP_SUMMARY"
          fi

  matrix:
    needs: [guard]
    runs-on: ubuntu-latest
    # (#1865, #1250-class) a job with no `timeout-minutes` has no bound to exceed, so a hung cell
    # can never be surfaced — the #1696 zombies (3h35m in_progress) were exactly that shape. This
    # job only runs `make engine-build-matrix`, a sub-second call, so a short window covers it and
    # any future unbounded creep here reds the guard in tests/test_engine_build_timeouts.py.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"   # the repo's pinned Python (issue #120)
      - id: m
        env:
          ENGINE: ${{ inputs.engine }}
          ARCH: ${{ inputs.arch }}
        # The list comes from the committed params, never from a hand-written roster: an engine that
        # ships a new variant is in the sweep the moment its params are committed.
        run: |
          echo "matrix=$(make -s engine-build-matrix ENGINE="$ENGINE" ARCH="$ARCH")" >> "$GITHUB_OUTPUT"

  build:
    needs: [guard, matrix]
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Per-cell budget (issue #1818, owner ruling 2026-11-02, measured band):
    # the vllm/rocm cell was cancelled on the flat 240m wall 5 times
    # (runs killed at exactly 241m) while its completed-success band is
    # p50 ~60m / max ~107m (#1694); rocm gets ~360 (3.4x max success) and every
    # other cell keeps the tight 240m budget. Capacity only, no check weakened.
    timeout-minutes: ${{ (matrix.variant == 'rocm') && 360 || 240 }}
    permissions:
      contents: read
      packages: write
    name: engine-build-${{ matrix.engine }}-${{ matrix.variant }}
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      # Owner-guarded dispatch run: it logs into GHCR, so it may write the registry layer cache
      # back even on a build-and-verify (push=false) cell, warming it for the NEXT run of the same
      # cell (#1694). engine_image.py only writes the cache when this is set — a PR/fork/local
      # runner never sets it and never attempts the privileged write.
      LLGENIE_CACHE_WRITE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ matrix.engine != 'none' }}
      - name: Disk headroom (CUDA/ROCm / oversized prebuilt bases like sglang carry multi-GB baked trees; a too-small runner must fail fast with the df line, never 13 minutes later with ENOSPC — issue #1893)
        if: ${{ matrix.engine != 'none' }}
        env:
          # A free-space floor, in GiB, for the cell's build + export. An oversized cell whose
          # runner cannot guarantee it below this floor reds HERE (a second, readable df verdict)
          # instead of spending the build writing layers and hitting `no space left on device`
          # mid-export. Tunable; the measured failure had 104G free and still exhausted the disk
          # (sglang-cuda prebuilt base), so the floor is a durable headroom policy, not a retry.
          LLGENIE_DISK_FLOOR_GB: "30"
        run: |
          set -euo pipefail
          # Free every reclaimable byte first: the docker/buildx layer cache (a previous cell's
          # giant prebuilt-derived image can be tens of GB) plus the remaining big toolchain dirs.
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /usr/local/share/powershell /opt/pipx /usr/lib/mono \
            ~/.cache/pip ~/.cache/uv ~/.cargo ~/.rustup 2>/dev/null || true
          if command -v docker >/dev/null 2>&1; then docker builder prune -af >/dev/null 2>&1 || true; fi
          read -r avail _ < <(df -B1 --output=avail / | tail -1)
          free_gb=$(( avail / 1024 / 1024 / 1024 ))
          echo "free_gb=${free_gb}"
          echo "FREE_DISK_GB=${free_gb}" >> "$GITHUB_OUTPUT"
          echo "::notice::engine=${{ matrix.engine }} variant=${{ matrix.variant }} free_disk_gb=${free_gb} floor_gb=${LLGENIE_DISK_FLOOR_GB} (issue #1893 disk-headroom policy)"
          df -h /
          if [ "$free_gb" -lt "${LLGENIE_DISK_FLOOR_GB}" ]; then
            echo "::error::engine=${{ matrix.engine }}/${{ matrix.variant }} free disk ${free_gb}G below the ${LLGENIE_DISK_FLOOR_GB}G oversized-cell floor — fail fast instead of a 13-minute ENOSPC (issue #1893)"
            exit 1
          fi
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
        if: ${{ matrix.engine != 'none' }}
      - name: Log in to GHCR (owner-guarded dispatch — every cell holds packages:write and may write the shared registry cache; the env comment at LLGENIE_CACHE_WRITE matches this, issue #1843)
        if: ${{ matrix.engine != 'none' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: make build-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }} (the committed params -> Dockerfile + params.json; FORCE=1 rebuilds with --no-cache)
        if: ${{ matrix.engine != 'none' }}
        env:
          FORCE: ${{ inputs.force == 'true' && '1' || '' }}
        run: make build-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }}
      - name: Pull the test image (GHCR, published by ci-images; the post-build pytest stage runs in llgenie/test)
        if: ${{ matrix.engine != 'none' }}
        run: make test-image-pull
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: ${{ matrix.engine != 'none' }}
      - name: "hf CLI (tiny test model): make hf-cli-install — installs the EXACT huggingface_hub version tools/requirements.in pins (issue #2380); a floating >= drifted to a 2.x, and the stale [cli] extra is gone"
        if: ${{ matrix.engine != 'none' }}
        run: make hf-cli-install
      - name: "verify: make test-engine-stage ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }} TEST=${{ matrix.test }} (serve: the engine binary smoke — the binary in the built image answers the flags it documents (issue #1717), never a serving-readiness wait; detect: the binary reports its version and answers the flags a user types; serving is NOT exercised in CI — the one and only engine gate is the binary answering -h/--version (issue #2319); the OpenAI-serving conformance tier is a host-only command (the `make test-engine-serve` target, run manually by the engine improver))"
        if: ${{ matrix.engine != 'none' }}
        run: make test-engine-stage ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }} TEST=${{ matrix.test }}
      - name: "bind-proof: record the head_sha this build-and-verify run proved (issue #1293) — the verdict a reader quotes is self-binding only when the run's head still equals the PR's current head"
        if: ${{ matrix.engine != 'none' }}
        run: |
          echo "head_sha=${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: make push-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }} (ONLY after the test above passed; re-checks the binary's flags before publishing)
        if: ${{ matrix.engine != 'none' && inputs.push == 'true' }}
        run: make push-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }}
      - name: "published-binary-leg: make test-published-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }} — pull the JUST-published image (digest == :ARCH) and verify the engine BINARY answers -h/--version only (issue #2319). No server is started in CI; the serve conformance test is host-only (make test-engine-host / make test-engine-serve, run manually by the llgenie-engine-improver with the smallest model that fits)."
        if: ${{ matrix.engine != 'none' && inputs.push == 'true' }}
        run: make test-published-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }}
      - name: "install-leg: make test-engine-install ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }} — install + the installed launcher's engine version (test-built-engine) + uninstall the image this row just published (product `llgenie --dry` lives in pipeline.yml's ci-install, not here; #1027)"
        if: ${{ matrix.engine != 'none' && inputs.push == 'true' }}
        run: make test-engine-install ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }}

