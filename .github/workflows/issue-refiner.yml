# The issue-refiner (issue #263): review the BACKLOG of not-yet-implemented issues so they are
# implementable BEFORE the implementer reaches them.
#
# HOURLY, one issue per run. It opens NO PR: its outcome is ONE comment plus the `agent:refined`
# label, which is also what stops it reviewing the same issue again. The only thing it will not
# do is race the implementer: while an issue is waiting for it (labelled agent:implement /
# agent:ready with no PR yet) the run yields and says so.
#
# Same guard shape as the issue-bot: workflow_dispatch is owner/collaborator only, and the
# `guard` job re-checks the actor before any secret is read. The decision (spare capacity?
# which issue?) lives in scripts/issue_refiner.py, not in a job `if:` — issue #107 requires
# that, and tests/test_issue_refiner.py asserts it.
# Trigger surface: its own schedule (hourly, `43 * * * *`) and `workflow_dispatch` by hand
#                  (owner/collaborator).
# Flow: guard (owner/collaborator, BEFORE any secret is read) -> make issue-refiner-pick (the oldest
#       eligible issue, or none) -> make issue-refiner (its first step is make agent-shell-keys-check
#       for FIRECRAWL_API_KEY, then make issue-evidence pre-fetches the URLs the issue names with the
#       masked fetch leg (issue #380); then the agent reads the issue + its whole thread + that
#       evidence and writes refine.md) -> make issue-refiner-apply (ONE comment + the `agent:refined`
#       label).
# Never: never opens a PR, never creates a branch, never edits an issue body, never merges, never
#        decides an open question for a human, never takes an issue the implementer has claimed.
# dispatch: no inputs — the bot decides by itself which ONE issue to review (scripts/issue_refiner.py);
# a hand dispatch means "run that decision now", never "review this one specific issue".
name: issue-refiner — reviews ONE not-yet-implemented issue, never opens a PR

on:
  schedule:
    - cron: "43 * * * *"   # hourly, at an odd minute: one issue reviewed per run
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-refiner
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  refine:
    needs: guard
    runs-on: ubuntu-latest
    # The review is one agent call plus the gates it is told to consult; 120 is the same
    # budget the implementer gets, and nothing inside bounds it (no step timeout, no cap).
    timeout-minutes: 120
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      # The masked web reach (issue #380): the review leg pre-fetches the URLs the picked issue
      # names, so the agent reads what the outside world says instead of guessing. Forwarded by
      # NAME only — `make agent-fetch` carries the `_HERMES_FORCE_` twin, never a value.
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      REPO: ${{ github.repository }}
    steps:
      - name: "Checkout main (read-only for this bot - it pushes nothing)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN }}

      - name: Decide (spare capacity? -> the oldest eligible issue -> refine-in.md)
        id: pick
        env:
          # The job's own `permissions:` grants the write; the owner PAT never could —
          # `secrets.BUMP_TOKEN` carries no Issues write, so every scheduled run died here with
          # "GraphQL: Resource not accessible by personal access token (addComment)" (issue #412).
          # github.token is scoped to this repo and this job, which is exactly the write being made.
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=$(make issue-refiner-pick REPO="$REPO")
          rc=$?
          echo "$out"
          # A crashed decision is NOT "nothing to pick" (issue #314): the pick died, so the run
          # must go red instead of writing action=unknown and reporting a green no-op.
          if [ "$rc" != "0" ]; then
            echo "::error::the refiner's pick failed (make issue-refiner-pick rc=$rc); refusing to treat a crashed decision as 'nothing to pick'"
            exit 1
          fi
          action=$(printf '%s\n' "$out" | sed -n 's/^action=//p' | tail -1)
          issue=$(printf '%s\n' "$out" | sed -n 's/^issue=//p' | tail -1)
          echo "action=${action:-unknown}" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          [ "$action" = "pick" ] && echo "picked=true" >> "$GITHUB_OUTPUT" || echo "picked=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prove the JEV engine is active — the review does not start without it (issue #238)
        if: steps.pick.outputs.picked == 'true'
        run: make agent-jev-preflight NERVE_REQUIRE=1

      # Hermes strips provider credentials from its terminal tool, so `-e NOUS_API_KEY`
      # reaches the container while the AGENT's shell reads it EMPTY — a bot that then does
      # nothing while this run stays green (issue #358). Prove the agent can see what this
      # job forwards, and stop in seconds instead of after a 120-minute run.
      - name: Prove the agent's shell can see this job's credentials (issue #358)
        if: steps.pick.outputs.picked == 'true'
        run: make agent-shell-keys-check AGENT_SHELL_CHECK_KEYS="NOUS_API_KEY TYPESAFE_API_KEY FIRECRAWL_API_KEY"

      - name: Review the issue (Hermes reads refine-in.md and writes refine.md)
        id: review
        if: steps.pick.outputs.picked == 'true'
        run: |
          set +e
          make issue-refiner
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "refine.md:"; sed -n '1,40p' refine.md 2>/dev/null || echo "  (the agent wrote no refine.md)"
          exit 0

      # The whole point of the redaction seam (issue #359): the job publishes the REDACTED
      # transcript, never the raw capture (which holds the unredacted stream by construction).
      - name: Upload the REDACTED agent transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-transcript-redacted
          path: hermes-run.scrubbed.log
          if-no-files-found: ignore
      - name: Apply the review (ONE comment + agent:refined; never a PR)
        id: apply
        if: steps.pick.outputs.picked == 'true'
        env:
          # The job's own `permissions:` grants the write; the owner PAT never could —
          # `secrets.BUMP_TOKEN` carries no Issues write, so every scheduled run died here with
          # "GraphQL: Resource not accessible by personal access token (addComment)" (issue #412).
          # github.token is scoped to this repo and this job, which is exactly the write being made.
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.pick.outputs.issue }}
        run: |
          set +e
          out=$(make issue-refiner-apply ISSUE="$ISSUE" REPO="$REPO")
          rc=$?
          echo "$out"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report the outcome on the issue
        if: always() && steps.pick.outputs.picked == 'true'
        env:
          # The job's own `permissions:` grants the write; the owner PAT never could —
          # `secrets.BUMP_TOKEN` carries no Issues write, so every scheduled run died here with
          # "GraphQL: Resource not accessible by personal access token (addComment)" (issue #412).
          # github.token is scoped to this repo and this job, which is exactly the write being made.
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.pick.outputs.issue }}
        run: |
          {
            echo "issue-refiner reviewed this issue (one issue per run, one comment, never a PR)."
            echo ""
            echo "- verdict applied: ${{ steps.apply.outputs.rc == '0' && 'yes' || 'no (see the step log)' }}"
            echo ""
            echo "The refined text is the comment above. A human decides anything it leaves open;"
            echo "the implementer (#248/#261) picks the issue up through its normal label flow."
          } | gh issue comment "$ISSUE" --repo "$REPO" --body-file - || echo "could not comment (leaving the review above)"

      - name: Fail loudly when a picked issue produced no review
        if: always() && steps.pick.outputs.picked == 'true' && steps.apply.outputs.rc != '0'
        run: |
          echo "::error::issue-refiner picked #${{ steps.pick.outputs.issue }} but applied no review (make issue-refiner-apply rc=${{ steps.apply.outputs.rc }})."
          exit 1
