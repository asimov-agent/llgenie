name: ci-verdict — holds a finished CI run to its published scope decision, and says "no verdict" out loud

# CI-VERDICT (issue #1111) — the consumer a cancelled fan-out did not have.
#
# MEASURED, run 41134761297 (`CI`, head 0bd5ac6e, conclusion `cancelled`):
#
#     guard success · ci-images cancelled · scanner-images cancelled · linux skipped
#     => success=3, failed=0, other=5, pending=0        (no `linux / unit` row existed at all)
#
# The same class of change at d92ee6a3 (run 41126873965) had the full set with `linux / unit failure`.
# So one head proved the change was wrong and the next head - after a push cancelled the fan-out -
# reported nothing, and the summary every board line quotes read "0 failures".
#
# WHY A `workflow_run` WORKFLOW AND NOT A JOB IN ci.yml: a cancelled run cancels ITS OWN jobs, so a
# terminal job inside the run cannot survive the very event it is meant to report. This workflow runs
# in the base repository after the run completes, whatever the conclusion, exactly like `auto-merge`
# and `run-failure-reactor` do.
#
# WHY IT POSTS A CHECK-RUN: a `workflow_run` run creates NO check-run of its own on the commit
# (measured on 0bd5ac6e - the cancelled CI run's rows are the only ones; `auto-merge`'s own run is
# absent), so a verdict that only reds its own workflow is invisible to every check-run reader. The
# `checks: write` permission below plus `POST /repos/{owner}/{repo}/check-runs` puts the answer where
# the question is asked: one `ci-verdict` row on the head, `failure` for a run with no verdict and
# `neutral` for a head a later run of the same workflow already owns.
#
# Flow: read the finished run's job rows -> read back the `ci-scope-decision` artifact (absent = no
#       decision, never an error) -> `make ci-verdict` (scripts/ci_verdict.py) decides -> read the
#       head's OTHER check-runs (issue #2116) -> post the check-run it wrote.
# UNJUDGED REDS (#2116): this file judges ONE workflow (`CI`). Any other `pull_request` workflow's
# check-run on the head is outside that judgment, and `scripts/auto_merge.py` refuses a merge on ANY
# blocking check-run at the head (#1386) — so a green `CI` beside a red `engine-build-pr-trigger` used
# to read `ci-verdict: success` with auto-merge armed and no merge possible (PR #1982 head aeac049f,
# run 42440650801). `scripts/ci_verdict.py` now reads the head's check-runs, resolves each blocking one
# to its workflow through the Actions run in `details_url`, and NAMES every one it did not judge; the
# conclusion is `failure`, never a plain `success`. The roster that decides which workflows are judged
# is `data/verdict-roster.json` + `scripts/verdict_roster.py` (`make verdict-roster`), gated by
# `make check-workflows` — a new `pull_request` workflow without a dated judgement decision reds CI.
# Trigger surface: `workflow_run` (every finished CI run, auto-judged) plus `workflow_dispatch`
#                  (a manual re-judge of one finished run, owner/collaborator-only) — never a
#                  `pull_request` or `push`.
# Never: re-runs or merges anything, edits no branch, and reads no repository secret. The ONE exception is
# a manual `workflow_dispatch` re-judge (issue #1886): an operator may dispatch this workflow to RE-JUDGE a
# specific finished run through the same judge steps — it still reads only that run's jobs + decision and
# posts a fresh check-run; it does not re-run the judged CI and edits nothing.
# The verdict's decisions live in scripts/ci_verdict.py (tested in tests/test_ci_verdict.py), never in
# a job-level `if:` - a skipped job is invisible in the job list and
# tests/test_ci_images.py::test_no_ci_step_or_job_is_skipped forbids that shape.
#
# WHY THE JOB IS NAMED `judge`, NOT `verdict` (#1871): GitHub auto-creates ONE check-run per job,
# named after the job's key/`name` and attached to the head the workflow ran on. A `workflow_run`
# workflow runs on the DEFAULT branch, so this job's auto row (`verdict` before #1871) lands on the
# default-branch head no matter which run it judged. A green `main` tip then showed a red `verdict`
# auto row that belonged to a judged PR (e.g. #1870) alongside the posted `ci-verdict: success` for
# the tip itself - #1864 relocated the POSTED check-run to the judged head, but GitHub's auto job row
# is not movable from the workflow side. Renaming the job to `judge` keeps the AUTHORITATIVE
# `ci-verdict` check-run the only "verdict"-named row a reader must trust, and names the auto row for
# what it is: the job that JUDGED a run. Verdict conclusions are untouched (#1862 AC-3).
on:
  workflow_run:
    workflows:
      # Matched VERBATIM against each workflow's top-level `name:` (no wildcard, #349): a rename here
      # or there stops this consumer silently, which is why `make check-workflows` compares the roster
      # with the workflows on disk.
      - CI
    types: [completed]
  # MANUAL RE-JUDGE (issue #1886): ci-verdict has no machine-facing re-run, so a run whose verdict was
  # red for a reason that has since cleared (or whose job records were about to be judged) could only be
  # re-judged by re-running the WHOLE heavy CI fan-out. A `workflow_dispatch` with `run_id` lets an
  # operator re-judge one finished run through the SAME `judge` steps as the auto path — it reads the
  # run's jobs + decision and posts a fresh check-run; it never re-runs the judged CI and edits nothing.
  workflow_dispatch:
    inputs:
      run_id:
        description: the finished run id to re-judge (a `CI` run that has published a scope decision)
        required: true
        type: string
      head_sha:
        description: "the commit the verdict is about; empty = the judged run's head sha"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read          # read the finished run's jobs and its artifacts
  checks: write          # post the verdict as a check-run on the head

# ONE GROUP PER FINISHED RUN, never superseded (issue #917's lesson: a shared group makes sweeps stack,
# and `cancel-in-progress: true` would let a verdict kill a verdict - the failure mode this whole file
# exists to report). Keyed by the run id, so two different CI runs never cancel each other. The dispatch
# path keys on the same run id it is asked to re-judge, so a manual re-judge and its auto twin collapse
# to one group member (never a second verdict racing the first).
concurrency:
  group: ci-verdict-${{ inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  guard:
    # Only the owner, a collaborator with WRITE access, or the bot may drive this workflow (the
    # byte-identical shape every dispatchable workflow carries, issue #295). A `workflow_dispatch`
    # re-judge is started by a person, so the trigger guard runs first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          # The event + ref: on a `workflow_dispatch` the head repo is empty, so the bot's same-repo-head
          # intent is reached via event+ref instead (the all-pipelines sweep dispatching `main`, issue
          # #1571).
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            # It also passes on a `workflow_dispatch` of this repository (issue #1571): a dispatch can
            # only target this repository's own refs, and only this repository's own automation (a
            # workflow scoped `actions: write` dispatching via GITHUB_TOKEN) can make the bot the
            # actor of one — the same-repo-head intent reached via the event instead of the (empty)
            # HEAD_REPO. A workflow_dispatch is how the weekly all-pipelines sweep drives its targets.
            if [ "$u" = "github-actions[bot]" ]; then
              if [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
                echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
                continue
              fi
              if [ "${EVENT:-}" = "workflow_dispatch" ]; then
                echo "Repository bot $u on a workflow_dispatch of this repository - allowed."
                continue
              fi
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  judge:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The BASE branch, never the head: this job holds a `checks: write` token, so it runs trusted
      # code only - the same rule `auto-merge` follows.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Read the finished run (jobs + the scope decision it published)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          # The optional dispatch `head_sha` is carried via env (never interpolated into the shell),
          # so a crafted value cannot inject shell commands into this `checks: write` job: GitHub
          # expands workflow expressions before the shell runs (security.run-shell-injection, #1972).
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verdict"
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/verdict/jobs.json"
          # The head the verdict is about: an explicit dispatch input wins, else the input's own run
          # (a dispatch fallback), else the workflow_run event's head. Always authoritative: a dispatch
          # must not post a check-run with an empty HEAD_SHA just because the operator omitted the input.
          if [ -n "$HEAD_SHA" ]; then
            echo "$HEAD_SHA" > "$RUNNER_TEMP/verdict/head_sha"
          else
            gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.head_sha' > "$RUNNER_TEMP/verdict/head_sha"
          fi
          if gh run download "$RUN_ID" --repo "$REPO" -n ci-scope-decision \
               -D "$RUNNER_TEMP/verdict/decision" >/dev/null 2>&1; then
            echo "Decision artifact read from run $RUN_ID."
          else
            # A cancelled run may never have reached the step that writes it. That is the VERDICT's
            # input (a run with no decision), not this step's failure - `make ci-verdict` reports it.
            echo "[ci-verdict] run $RUN_ID published no ci-scope-decision artifact."
          fi

      - name: make ci-verdict (hold the run to its decision; a skipped selected job or no decision is RED)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha }}
          CHECK_RUN_OUT: ${{ runner.temp }}/verdict/check-run.json
        # The verdict's exit code IS the job's: a red verdict fails this run, so the reactor routes it
        # to a remedy instead of the board reading "0 failures" (issue #286). A superseded head exits 0
        # and posts a `neutral` check-run, because a later run of this workflow owes that head its
        # verdict - never because the skip was fine.
        run: |
          set -euo pipefail
          JOBS="$RUNNER_TEMP/verdict/jobs.json"
          DECISION="$RUNNER_TEMP/verdict/decision/ci-scope-decision.json"
          test -f "$DECISION" || DECISION=""
          # HEAD_SHA: an explicit input/event wins; otherwise the run's own head (resolved above), never
          # an empty string — a check-run must land on a real head even for a bare run_id dispatch.
          test -s "$RUNNER_TEMP/verdict/head_sha" && HEAD_SHA="$(cat "$RUNNER_TEMP/verdict/head_sha")"
          make ci-verdict REPO="$REPO" RUN_ID="$RUN_ID" JOBS="$JOBS" DECISION="$DECISION" \
               HEAD_SHA="$HEAD_SHA" CHECK_RUN_OUT="$CHECK_RUN_OUT"

      - name: Post the verdict as a check-run on the head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHECKS_FILE: ${{ runner.temp }}/verdict/check-run.json
        # `always()`: the check-run is the REPORT, so it must be posted for a red verdict too - that is
        # the one case the reader needs it. An unreadable payload is a failure (a verdict nobody can
        # read is not a verdict); it never silently passes.
        run: |
          set -euo pipefail
          test -s "$CHECKS_FILE" || {
            echo "[ci-verdict] no check-run payload: the verdict step did not reach a verdict"
            exit 1
          }
          gh api -X POST "repos/$REPO/check-runs" --input "$CHECKS_FILE"
