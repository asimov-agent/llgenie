name: issue-bot — implements ONE issue per run as a reviewable PR (never merges)

# ISSUE-BOT — implements ONE issue per run (issue #248), at most 3 a day, each
# left as a draft-free reviewable PR that is NEVER merged.
#
# Trigger surface: the explicit `agent:implement` label, a daily schedule, and
# workflow_dispatch for the owner. Concurrency queues a second event for the
# SAME issue instead of launching a parallel implementer.
#
# Flow (all of it, or the run is a defect):
#   guard (owner/collaborator, BEFORE any secret is read)
#   -> dispatch (cap -> pick one -> claim -> issue.md + branch),
#      via make issue-bot-dispatch (scripts/issue_implementer.py)
#   -> implement it with Hermes (make implement-issue, AGENTS.md is the authority)
#   -> commit + push the feature branch (owner PAT, so CI really runs)
#   -> open a DRAFT-FREE PR (closes #<n>), never merged
#   -> report the outcome on the issue
#
# The bot NEVER merges, never pushes to main, and never implements a batch. The
# dispatch's cap is the hard bound: once 3 PRs exist today, the run stops before
# any work, with a "cap reached" log and no comment (no spam).

# Trigger surface: the explicit `agent:implement` label, schedule daily 06:23 UTC, and
#                  workflow_dispatch for the owner (`issue_number`).
# Flow: guard -> make issue-bot-dispatch (cap -> pick ONE issue -> claim -> issue.md + branch)
#       -> make issue-bot-triage (Hermes reads the body + the WHOLE thread and writes a verdict)
#       -> make issue-bot-verdict (implement | refine | close) -> make implement-issue (Hermes
#       implements it inside the agent image, runs the gates, pushes nothing) -> push the branch
#       -> make issue-bot-open-pr (draft-free PR that closes the issue) -> report on the issue.
# Never: never merges, never pushes to `main`, never implements a batch, never exceeds the 3 PRs/day
#        cap (the cap stops the run before any work, with no comment: no spam).
on:
  issues:
    types: [labeled]
  schedule:
    - cron: "23 6 * * *"   # daily 06:23 UTC (an odd minute; gets the agent a slot each day)
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to implement (owner only)"
        required: true
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: issue-bot
  cancel-in-progress: false

jobs:
  # Before anything touches a secret: only the owner or a collaborator with
  # write/maintain/admin may run the implementer (it spends the Nous key and
  # pushes with the owner PAT). A stranger's issue can never start it.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  implement:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      # The JEV/provider key for the decision layer the agent image carries (issue #238):
      # it answers the cheap decisions so this run makes FEWER LLM calls, with fewer tokens
      # and fewer mistakes. Run-time only, like NOUS_API_KEY: `docker run -e`, never baked
      # into the image. The step below REPORTS whether the layer is available; it never stops
      # the run, because the bots are autonomous (a missing key costs the run its decision
      # layer and is annotated as a warning on the run).
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      REPO: ${{ github.repository }}
      # The implementer leg forwards `-e GH_TOKEN` (so the agent's `gh` calls are authenticated),
      # and until now nothing set it for this job: the container received an EMPTY value that looked
      # exactly like a wired one (issue #364). `github.token` is enough — the job's permissions are
      # contents/issues/pull-requests: write, and the PUSH still uses the owner PAT (BUMP_TOKEN).
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main (PAT, so its push re-triggers CI)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN }}

      - name: Sync with latest upstream main (the branch must start from it - issue #303)
        run: make bot-sync-main

      - name: Dispatch (cap -> pick one -> claim -> issue.md + branch)
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          # A label event (`agent:implement`, the explicit ask) or a manual
          # dispatch pins FORCE_ISSUE to that issue; only a schedule run lets
          # the dispatcher pick the oldest labeled/ready issue itself.
          FORCE_ISSUE: ${{ github.event.issue.number || inputs.issue_number || '' }}
        run: |
          set +e
          out=$(make issue-bot-dispatch REPO="$REPO" FORCE_ISSUE="${FORCE_ISSUE:-}")
          rc=$?
          echo "$out"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          branch=$(printf '%s\n' "$out" | sed -n 's/^branch=//p' | tail -1)
          issue=$(printf '%s\n' "$out" | sed -n 's/^issue=//p' | tail -1)
          action=$(printf '%s\n' "$out" | sed -n 's/^action=//p' | tail -1)
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          # A CRASHED decision is not "nothing to do" (issue #312). Without this check an empty
          # `action` falls through the cap/none test below, so `dispatch=true` and the run marches on
          # to triage/implement with no issue picked — failing somewhere later, or not at all. Fail
          # HERE, naming the target and its rc.
          if [ "$rc" != "0" ]; then
            echo "::error::the issue-bot's decision failed (make issue-bot-dispatch rc=$rc); refusing to treat a crashed decision as 'nothing to pick'"
            exit 1
          fi
          if [ "$action" = "cap" ] || [ "$action" = "none" ]; then echo "dispatch=false" >> "$GITHUB_OUTPUT"; else echo "dispatch=true" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Prove the JEV engine is active — the run does not start without it (issue #238)
        if: steps.dispatch.outputs.dispatch == 'true'
        run: make agent-jev-preflight NERVE_REQUIRE=1

      # Hermes strips provider credentials from its terminal tool, so `-e NOUS_API_KEY`
      # reaches the container while the AGENT's shell reads it EMPTY — a bot that then does
      # nothing while this run stays green (issue #358). Prove the agent can see what this
      # job forwards, and stop in seconds instead of after a 120-minute run.
      - name: Prove the agent's shell can see this job's credentials (issue #358)
        if: steps.dispatch.outputs.dispatch == 'true'
        run: make agent-shell-keys-check AGENT_SHELL_CHECK_KEYS="NOUS_API_KEY GH_TOKEN TYPESAFE_API_KEY"

      - name: Hermes routing smoke (die in seconds, not after 20 min)
        if: steps.dispatch.outputs.dispatch == 'true'
        run: make hermes-smoke

      - name: Triage the issue (Hermes reviews the body AND the whole comment thread)
        id: triage
        if: steps.dispatch.outputs.dispatch == 'true'
        run: |
          set +e
          make issue-bot-triage
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "triage.md:"; sed -n '1,40p' triage.md 2>/dev/null || echo "  (the agent wrote no triage.md)"
          exit 0

      - name: Apply the verdict (refine -> one comment, no PR; close -> needs cited evidence)
        id: verdict
        if: steps.dispatch.outputs.dispatch == 'true' && steps.triage.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.dispatch.outputs.issue }}
        run: |
          set +e
          out=$(make issue-bot-verdict ISSUE="$ISSUE" REPO="$REPO")
          rc=$?
          echo "$out"
          v=$(printf '%s\n' "$out" | sed -n 's/^verdict=//p' | tail -1)
          echo "verdict=${v:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$rc" != "0" ]; then echo "verdict=error" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Implement the issue (Hermes reads issue.md + AGENTS.md)
        id: impl
        if: steps.dispatch.outputs.dispatch == 'true' && steps.verdict.outputs.verdict == 'implement'
        run: |
          set +e
          make implement-issue
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" != "0" ]; then echo "implemented=false" >> "$GITHUB_OUTPUT"; else echo "implemented=true" >> "$GITHUB_OUTPUT"; fi
          exit 0

      # The whole point of the redaction seam (issue #359): the job publishes the REDACTED
      # transcript, never the raw capture (which holds the unredacted stream by construction).
      - name: Upload the REDACTED agent transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-transcript-redacted
          path: hermes-run.scrubbed.log
          if-no-files-found: ignore
      - name: Commit + push the feature branch
        id: push
        if: steps.verdict.outputs.verdict == 'implement' && steps.impl.outputs.implemented == 'true'
        env:
          BRANCH: ${{ steps.dispatch.outputs.branch }}
        run: |
          # Authored as one of the two identities a PR's commits may carry (`Asimov Agent`,
          # issue #345); a github-actions[bot] branch is also held for approval on its PR.
          git config user.name "Asimov Agent"
          git config user.email "support@docondee.com"
          git checkout -b "$BRANCH"
          git add -A
          git reset -q -- issue.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "The implementation produced no file changes - nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg=$(printf 'Issue: #%s was chosen as actionable by the issue-bot (make issue-bot-verdict).\n\nFix: implemented the issue on this branch by the issue-implementer (Hermes, with AGENTS.md and the whole issue thread in context), then re-ran the repository gates in this job.\n\nBenefit: the issue lands as a reviewable pull request instead of waiting for a human to start it.\n\nTechnical: the change was produced by make implement-issue; the PR body, the claim comment and the closes marker are written by make issue-bot-open-pr (scripts/issue_implementer.py).' "${{ steps.dispatch.outputs.issue }}")
          git commit -m "feat(issue-bot): implement #${{ steps.dispatch.outputs.issue }}" -m "$msg"
          git push -u origin "$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open the PR (never merged; closes the issue)
        id: pr
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          BRANCH: ${{ steps.dispatch.outputs.branch }}
          ISSUE: ${{ steps.dispatch.outputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          out=$(make issue-bot-open-pr REPO="$REPO" ISSUE="$ISSUE" BRANCH="$BRANCH")
          echo "$out"
          pr_url=$(printf '%s\n' "$out" | sed -n 's/^pr_url=//p' | tail -1)
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Report the outcome on the issue
        if: always() && steps.dispatch.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.dispatch.outputs.issue }}
          BRANCH: ${{ steps.dispatch.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          IMPLEMENTED: ${{ steps.impl.outputs.implemented }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          {
            echo "issue-bot ran for this issue (at most 3/day, one at a time)."
            echo ""
            echo "- branch: \`$BRANCH\`"
            echo "- verdict: ${VERDICT:-none reached}"
            if [ "${VERDICT}" = "refine" ]; then
              echo "- outcome: the thread is not actionable yet, so this run posted a refined"
              echo "  restatement instead of guessing. No branch, no PR."
            elif [ "${VERDICT}" = "close" ]; then
              echo "- outcome: closed as no longer applicable, with the evidence cited above."
            else
              echo "- implementation: ${IMPLEMENTED:-not started}"
            fi
            echo "- PR: ${PR_URL:-none opened}"
            echo ""
            echo "The bot never merges. A reviewer approves the PR; #246 keeps it rebased,"
            echo "#222 repairs it when a check goes red."
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md

      - name: Fail loudly when the implementation did not happen
        # Only a verdict of `implement` owes a PR: a refine or a close ends the run on purpose,
        # so it must not be reported as a failure.
        if: always() && steps.dispatch.outputs.dispatch == 'true' && steps.verdict.outputs.verdict == 'implement' && steps.impl.outputs.implemented != 'true'
        run: |
          echo "::error::issue-bot produced no implementation for #${{ steps.dispatch.outputs.issue }} (verdict=implement, make implement-issue rc=${{ steps.impl.outputs.rc }})."
          exit 1
