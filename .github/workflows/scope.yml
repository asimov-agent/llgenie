name: ci-scope — selects the CI stages a diff needs, and runs the docs gates a docs-only PR still needs

# Trigger surface: `pull_request` with NO path filter, so one check of this exact name always reports
# (issue #824). `ci.yml` ignores a docs-only diff at the trigger, because a job-level `if:` that skips a
# stage is invisible in the job list and `tests/test_ci_images.py::test_no_ci_step_or_job_is_skipped`
# allows no such condition — so the docs class is selected before any job exists, and this workflow is
# where the docs gates still run.
# Flow: classify the diff (scripts/ci_scope.py) -> the docs-class gates -> the decision printed in the log.
# Never: publishes an image, reads a repository secret, or runs on a push (`ci.yml` owns those).

# dispatch: no inputs — dispatch re-classifies the current tree against `main`; the selected set is a
# function of the diff, so no input can change it (issue #824).
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# One PR supersedes its own previous run, exactly like ci.yml's pull_request group (issue #288). The
# value is EVALUATED per event, never a bare `true`: a bare true is what killed in-flight bot runs and
# half-pushed GHCR tags, and `tests/test_ci_concurrency.py` refuses it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The check-pr-closing step below reads the PR body LIVE via `gh api` (issue #1589) so a body-only
  # fix clears on `gh run rerun` without a new push; that read needs the pull-requests scope. Read-only.
  pull-requests: read

jobs:
  guard:
    # Only the owner, a collaborator with WRITE access, or the bot may drive this workflow (the
    # byte-identical shape every dispatchable workflow carries, issue #295). The classifier reads the
    # diff and runs the docs gates; a dispatch is started by a person, so the trigger guard runs first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          # The event + ref: on a `workflow_dispatch` the head repo is empty, so the bot's same-repo-head
          # intent is reached via event+ref instead (the all-pipelines sweep dispatching `main`, issue
          # #1571).
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            # It also passes on a `workflow_dispatch` of this repository (issue #1571): a dispatch can
            # only target this repository's own refs, and only this repository's own automation (a
            # workflow scoped `actions: write` dispatching via GITHUB_TOKEN) can make the bot the
            # actor of one — the same-repo-head intent reached via the event instead of the (empty)
            # HEAD_REPO. A workflow_dispatch is how the weekly all-pipelines sweep drives its targets.
            if [ "$u" = "github-actions[bot]" ]; then
              if [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
                echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
                continue
              fi
              if [ "${EVENT:-}" = "workflow_dispatch" ]; then
                echo "Repository bot $u on a workflow_dispatch of this repository - allowed."
                continue
              fi
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  scope:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # the classifier diffs against the PR base
      - name: make test-env (Python 3.11 + the test image the gates run in)
        run: make test-env
      - name: classify the diff (one class= line per class, one job= line per stage)
        # `github.base_ref` is empty for every non-`pull_request` event, so the dispatch path falls back
        # to `main` rather than diffing against the empty string and classifying nothing (issue #824).
        # The classifier itself is reached through the `ci-scope` make target, never inline (the repo
        # rule that every workflow step that runs a script must route through `make`).
        # nosemgrep: yaml.github-actions.security.run-shell-injection.run-shell-injection — base_ref constant, quoted, make-routed (issue #1595)
        run: |
          BASE="${{ github.base_ref }}"
          if [ -z "$BASE" ]; then
            echo "No github.base_ref for event '${{ github.event_name }}': reporting the diff against main."
            BASE=main
          fi
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          make ci-scope BASE="origin/$BASE"
      - name: make ci-lint (linefeed / editorconfig — the markdown gate)
        run: make ci-lint
      - name: make check-docs
        run: make check-docs
      - name: make check-wiring
        run: make check-wiring
      - name: make check-issue-bodies
        run: make check-issue-bodies
      - name: make check-pr-closing (a claimed issue needs the same adjacent close in the squash text and the body — issues #1329, #1417)
        env:
          # Docs-only pull requests skip the linux unit job. This step is the one that still reads
          # the squash range. The body is read LIVE from the PR record below (gh api, issue #1589),
          # NOT from the run's event snapshot, so a body-only fix clears on `gh run rerun`. A push to
          # main has no PR number: PR_BODY stays empty and only the squash half runs. PR_BASE is the
          # LIVE base branch ref (origin/main, refreshed below): the script anchors the range at
          # `git merge-base origin/main HEAD` (issue #1527).
          PR_BRANCH: ${{ github.head_ref || '' }}
          PR_BASE: origin/main
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --prune origin main   # refresh origin/main so the merge-base is live (issue #1527)
          PR_BODY=""
          if [ -n "$PR_NUMBER" ]; then
            PR_BODY="$(gh api "repos/$PR_REPO/pulls/$PR_NUMBER" --jq '.body // ""' 2>/dev/null || true)"
          fi
          if [ -n "$PR_BODY" ]; then printf '%s\n' "$PR_BODY" > /tmp/pr-body.md; export PR_BODY=/tmp/pr-body.md; fi
          make check-pr-closing
      - name: make check-pr-acceptance-form (a bot PR's body carries its own ## Acceptance criteria - [ ] checklist — the universal form rule, issue #1796)
        env:
          # Docs-only bot PRs skip linux/unit, so this step — beside check-pr-acceptance — is where
          # they are held to the #1796 form rule. Same live-body read (issue #1589), so a body-only
          # fix clears on rerun; verification/surface only — never a #1088 merge-blocker. This step
          # runs BEFORE check-pr-acceptance so its verdict is not masked when the sibling issue-state
          # gate reds on the introducing PR's own unticked issue boxes (#1796). A push to main has no
          # PR number and nothing to validate.
          PR_HEAD: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          PR_BASE: origin/main
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --prune origin main   # live origin/main, so the range read is not a stale ref (issue #1527)
          PR_BODY=""
          if [ -n "$PR_NUMBER" ]; then
            PR_BODY="$(gh api "repos/$PR_REPO/pulls/$PR_NUMBER" --jq '.body // ""' 2>/dev/null || true)"
          fi
          if [ -n "$PR_BODY" ]; then
            printf '%s\n' "$PR_BODY" > /tmp/pr-body.md; export PR_BODY=/tmp/pr-body.md
            make check-pr-acceptance-form
          else
            echo "[check-pr-acceptance-form] no PR body on this run (a push to main): nothing to validate"
          fi
      - name: make check-pr-acceptance (a merged PR must close an issue whose own acceptance criteria are checked — issues #1792/#745, and the squash-text close GitHub's native close reads is held too — issue #1815)
        env:
          # Docs-only bot PRs skip linux/unit, so this step — beside check-pr-closing — is where
          # they are held to the #1792 acceptance check. Same live-body read (issue #1589); the
          # linked issue's criteria are read LIVE at merge time. PR_BASE/PR_HEAD feed the squash
          # commit range so a `(closes #N)` in the squash text (GitHub's native close) is held too
          # (issue #1815).
          PR_BASE: origin/main
          PR_HEAD: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY=""
          if [ -n "$PR_NUMBER" ]; then
            PR_BODY="$(gh api "repos/$PR_REPO/pulls/$PR_NUMBER" --jq '.body // ""' 2>/dev/null || true)"
          fi
          if [ -n "$PR_BODY" ]; then
            printf '%s\n' "$PR_BODY" > /tmp/pr-body.md; export PR_BODY=/tmp/pr-body.md
            git fetch --no-tags --prune origin main
            make check-pr-acceptance
          else
            echo "[check-pr-acceptance] no PR body on this run (a push to main): nothing to validate"
          fi
      - name: make check-pr-agents-line (the #792 AGENTS-preflight: a bot PR's body cites an AGENTS:/BASE: rulebook reachable from both head and base)
        env:
          # Docs-only bot PRs skip linux/unit, so this step — beside check-pr-closing — is where
          # they are held to the #792 AGENTS preflight. Same live-body read as check-pr-closing
          # (issue #1589), so a body-only fix clears on rerun; a push to main has no PR number and
          # nothing to validate.
          PR_HEAD: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          PR_BASE: origin/main
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --prune origin main   # live origin/main, so the ancestry read is not a stale ref (issue #1527)
          PR_BODY=""
          if [ -n "$PR_NUMBER" ]; then
            PR_BODY="$(gh api "repos/$PR_REPO/pulls/$PR_NUMBER" --jq '.body // ""' 2>/dev/null || true)"
          fi
          if [ -n "$PR_BODY" ]; then
            printf '%s\n' "$PR_BODY" > /tmp/pr-body.md; export PR_BODY=/tmp/pr-body.md
            make check-pr-agents-line
          else
            echo "[check-pr-agents-line] no PR body on this run (a push to main): nothing to validate"
          fi
      - name: make check-pr-sync-line (the #1724 profile-propagation preflight: a profile-editing bot PR reports its live re-sync in a SYNC: line)
        env:
          # Docs-only bot PRs skip linux/unit, so this step — beside check-pr-closing/check-pr-agents-line —
          # is where they are held to the #1724 propagation preflight. Same live-body read (issue #1589),
          # so a body-only fix clears on rerun; a push to main has no PR number and nothing to validate.
          PR_HEAD: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          PR_BASE: origin/main
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --prune origin main   # live origin/main, so the diff read is not a stale ref (issue #1527)
          PR_BODY=""
          if [ -n "$PR_NUMBER" ]; then
            PR_BODY="$(gh api "repos/$PR_REPO/pulls/$PR_NUMBER" --jq '.body // ""' 2>/dev/null || true)"
          fi
          if [ -n "$PR_BODY" ]; then
            printf '%s\n' "$PR_BODY" > /tmp/pr-body.md; export PR_BODY=/tmp/pr-body.md
            make check-pr-sync-line
          else
            echo "[check-pr-sync-line] no PR body on this run (a push to main): nothing to validate"
          fi
      - name: make check-pr-openspec-change (the #1807 OpenSpec-presence preflight: an implementing bot PR adds or names its own OpenSpec change)
        env:
          # Docs+product bot PRs run here defensively; same live-body read (issue #1589), so a
          # body-only fix clears on rerun; a push to main has no PR number and nothing to validate.
          PR_HEAD: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          PR_BASE: origin/main
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --prune origin main   # live origin/main, so the diff read is not a stale ref (issue #1527)
          PR_BODY=""
          if [ -n "$PR_NUMBER" ]; then
            PR_BODY="$(gh api "repos/$PR_REPO/pulls/$PR_NUMBER" --jq '.body // ""' 2>/dev/null || true)"
          fi
          if [ -n "$PR_BODY" ]; then
            printf '%s\n' "$PR_BODY" > /tmp/pr-body.md; export PR_BODY=/tmp/pr-body.md
            make check-pr-openspec-change
          else
            echo "[check-pr-openspec-change] no PR body on this run (a push to main): nothing to validate"
          fi
      - name: make openspec-image (the OpenSpec CLI image the docs gates run in; a fork PR builds it from the change's own Dockerfile)
        # `ci.yml`'s `ci-images` job builds and tags this image; a workflow that runs `ci-openspec`
        # without it fails at `docker run llgenie/openspec:latest` with "pull access denied", which is
        # what this step exists to prevent (measured on run 40778404808, step 9). `ensure` pulls the
        # published hash when it exists and BUILDS the change's own Dockerfile when it cannot — a fork
        # PR's read-only token can never publish a NEW hash, so a hard `pull` would red the docs gate
        # for a write GitHub will never grant (issue #1673; same contract as ci_images.py publish()).
        run: make openspec-image
      - name: make ci-openspec (validate every active change, no unchecked task)
        run: make ci-openspec
      - name: Prune orphaned test containers
        if: always()
        run: make test-clean
