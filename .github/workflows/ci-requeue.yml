name: ci-requeue — re-runs only the cancelled runs no later run superseded, every 30 minutes

# Issue #843: 56% of the runs in a 300-run window are `cancelled`, and a bulk cancel to free runner
# capacity costs every killed PR its verdict - `gh pr checks` renders `completed/cancelled` as fail,
# auto-merge needs a green run, `run-failure-reactor` fires only on `conclusion: failure` and
# `run-failure-reactor` no longer treats a cancellation as "nothing to do". This is the scheduled half
# of the healer; `make ci-requeue-cancelled` is the manual half and takes WINDOW/DRY.

# Trigger surface: the 30-minute schedule (`15,45 * * * *`) and `workflow_dispatch` - never a
#   `pull_request` or a `push`: this workflow heals runs, it does not gate a change.
# Flow: `make ci-requeue-cancelled` reads the completed runs in the window, re-runs ONLY a cancelled
#   run with no later run of the same workflow on its branch, and reports every superseded one.
# Never: never cancels a run (a sweep that kills a 20-minute matrix is what it exists to undo), never
#   re-runs a superseded one, and never touches a `push` to main.
# dispatch: no inputs — the healer takes no target: it re-runs every cancelled run in the window that
# no later run of the same workflow superseded. The window is a make variable (WINDOW=2h), not
# a dispatch input.
on:
  schedule:
    - cron: "15,45 * * * *" # every 30 minutes at :15 and :45 — minutes no other bot owns (issue #275: a shared
                            # minute is a collision, and the collision test failed on :23 issue-bot and :53 engine-bump)
  workflow_dispatch:

permissions:
  contents: read
  actions: write # `gh run rerun` is a write on the Actions API
  pull-requests: read

# a requeue round must never be cancelled by the next one - that is the bug this workflow heals
concurrency:
  group: ci-requeue
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          # The event + ref: on a `workflow_dispatch` the head repo is empty, so the bot's same-repo-head
          # intent is reached via event+ref instead (the all-pipelines sweep dispatching `main`, issue
          # #1571).
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            # It also passes on a `workflow_dispatch` of this repository (issue #1571): a dispatch can
            # only target this repository's own refs, and only this repository's own automation (a
            # workflow scoped `actions: write` dispatching via GITHUB_TOKEN) can make the bot the
            # actor of one — the same-repo-head intent reached via the event instead of the (empty)
            # HEAD_REPO. A workflow_dispatch is how the weekly all-pipelines sweep drives its targets.
            if [ "$u" = "github-actions[bot]" ]; then
              if [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
                echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
                continue
              fi
              if [ "${EVENT:-}" = "workflow_dispatch" ]; then
                echo "Repository bot $u on a workflow_dispatch of this repository - allowed."
                continue
              fi
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  requeue:
    name: requeue
    needs: [guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
      - name: Re-run only the cancelled runs no later run superseded
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW: 2h
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make ci-requeue-cancelled
      - name: Say what the round could not decide
        if: always()
        run: |
          echo "window=2h target=ci-requeue-cancelled manual-equivalent=\"make ci-requeue-cancelled DRY=1\""
