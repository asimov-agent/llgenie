name: engine-bump — bumps pinned engines to their newest upstream release and opens the PR

# Issue #107: pin every engine skill to the latest upstream commit, derive the
# build parameters from the upstream tree (no LLM), and open a PR per changed
# engine whose CI builds/tests ONLY that engine's images. Runs on its OWN cron,
# separate from the registry sync (registry-sync.yml). Never merges: a reviewer
# does. A derive hard-fail (removed option/flag) still opens the PR and flags it
# in the body so a human fixes the skill (CI goes red on the build).
#
# The bump job checks out, pushes and opens the PR with the owner PAT
# (secrets.BUMP_TOKEN), not GITHUB_TOKEN (issue #136). A PR authored by
# github-actions[bot] holds every pull_request workflow for manual approval,
# and a push made with GITHUB_TOKEN starts no workflows.
# Trigger surface: schedule weekly Monday 06:53 UTC (`53 6 * * 1`), and workflow_dispatch (owner/collaborator;
#                  `engine` limits the run to one engine id, empty = every engine).
# Flow: guard (owner/collaborator/bot, BEFORE any secret is read) -> make engine-bump
#       (scripts/engine_bump.py: move the pin to the newest upstream tag, re-derive the build
#       parameters from the upstream tree, open or update the `chore/engine-bump-*` PR).
# Never: never merges, never pushes to `main`, never rewrites a skill it cannot re-derive (a removed
#        build option is recorded as a hard-fail instead, and the PR still opens).
on:
  schedule:
    - cron: "53 6 * * 1"   # weekly: Monday 06:53 UTC (unique minute, issue #275)
  workflow_dispatch:
    inputs:
      engine:
        description: "Only bump this engine (id); empty = all"
        required: false
        default: ""

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: engine-bump
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  plan:
    needs: [guard]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the repo's pinned Python (issue #120)
      - id: p
        env:
          ENGINE: ${{ github.event.inputs.engine }}
        run: |
          if [ -n "$ENGINE" ]; then
            echo "matrix=$(make -s engine-bump-plan ENGINE=$ENGINE | python3 -c 'import json,sys;print(json.dumps({"include":json.load(sys.stdin)}))')" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(make -s engine-bump-plan | python3 -c 'import json,sys;print(json.dumps({"include":json.load(sys.stdin)}))')" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: [plan]
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' && needs.plan.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    name: bump-${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the repo's pinned Python (issue #120)
      - name: make engine-bump (pin + derive + apply + regen)
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(make engine-bump ENGINE=${{ matrix.id }}) || {
            echo "::error::engine bump failed for ${{ matrix.id }}"
            exit 1
          }
          echo "$out"
          # a derive hard-fail is recorded, not fatal: the PR still opens, and the
          # body flags it so a human fixes the skill (CI goes red on the build).
          hf=$(echo "$out" | grep -o '"hard_fail": "[^"]*"' | head -1 | sed 's/.*: "//; s/"$//')
          echo "hard_fail=$hf" >> "$GITHUB_OUTPUT"
          deps=$(echo "$out" | sed -n 's/^\[engine-bump\] DEPS //p' | head -1)
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
      - name: Open / update the bump PR
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          ID: ${{ matrix.id }}
          OLD: ${{ matrix.old_sha }}
          NEW: ${{ matrix.new_sha }}
          REF: ${{ matrix.new_ref }}
          HARD_FAIL: ${{ steps.bump.outputs.hard_fail }}
          DEPS: ${{ steps.bump.outputs.deps }}
        run: |
          git config user.name "$(gh api user --jq .login)"
          git config user.email "$(gh api user --jq .id)+$(gh api user --jq .login)@users.noreply.github.com"
          branch="chore/engine-bump-${ID}"
          git switch -C "$branch"
          git add skills/engines/${ID}/SKILL.md containers/engines/params/${ID}.json containers/engines/dockerfiles/${ID}/ tests/ README.md data/strata_models.json
          msg=$(printf 'Issue: #107 — the weekly engine bump found %s at %s, pinned at %s.\n\nFix: re-derived the install recipe at %s and applied it to SKILL.md, the frozen per-arch Dockerfiles, the params and the Strata model list.\n\nBenefit: llgenie builds and serves this engine at the upstream release instead of a stale pin.\n\nTechnical: make engine-bump ENGINE=%s (derive -> pin -> apply -> make generate-engine-params). CI builds and tests the images of this engine only; a red PR means the new upstream commit needs a manual skill fix.' "$ID" "$REF" "${OLD:0:8}" "$REF" "$ID")
          git commit -m "chore(engine): bump ${ID} to ${REF}@${NEW:0:8}" -m "$msg" || { echo "nothing to commit"; exit 0; }
          git push --force origin "$branch"
          body=$(printf 'Automated engine pin bump (issue #107).\n\n- **Engine:** `%s`\n- **Pin:** `%s` -> `%s` (`%s`)\n- **Compare:** https://github.com/${{ github.repository }}/compare/%s...%s\n- CI builds and tests ONLY this engine'\''s images. A red PR means the new commit needs a manual skill fix.' "$ID" "${OLD:0:8}" "${NEW:0:8}" "$REF" "$OLD" "$NEW")
          if [ -n "$HARD_FAIL" ]; then
            body="$(printf '%b' "${body}" '\n' '\n' '> ⚠️ **Manual review required:** a build parameter could not be auto-derived — ' "$HARD_FAIL" '. The pin is bumped and the PR is open; CI will go red on the build until the skill is fixed by hand.')"
          fi
          if [ -n "$DEPS" ]; then
            body="$(printf '%b' "${body}" '\n' '- **Dependencies:** ' "$DEPS")"
          fi
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "chore(engine): bump ${ID} to ${REF}@${NEW:0:8}" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "chore(engine): bump ${ID} to ${REF}@${NEW:0:8}" --body "$body"
          fi
