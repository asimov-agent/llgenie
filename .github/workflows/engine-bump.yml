name: engine-bump — bumps pinned engines to their newest upstream release and opens the PR

# Issue #107: pin every engine skill to the latest upstream commit, derive the
# build parameters from the upstream tree (no LLM), and open a PR per changed
# engine whose CI builds/tests ONLY that engine's images. Runs on its OWN cron,
# separate from the registry sync (registry-sync.yml). Never merges: a reviewer
# does. A derive hard-fail (removed option/flag) still opens the PR and flags it
# in the body so a human fixes the skill (CI goes red on the build).
#
# The bump job checks out, pushes and opens the PR with the owner PAT
# (secrets.BUMP_TOKEN), not GITHUB_TOKEN (issue #136). A PR authored by
# github-actions[bot] holds every pull_request workflow for manual approval,
# and a push made with GITHUB_TOKEN starts no workflows.
# Trigger surface: schedule weekly Monday 06:53 UTC (`53 6 * * 1`), and workflow_dispatch (owner/collaborator;
#                  `engine` limits the run to one engine id, empty = every engine).
# Flow: guard (owner/collaborator/bot, BEFORE any secret is read) -> make engine-bump
#       (scripts/engine_bump.py: move the pin, re-derive, write the parameter list) ->
#       make test-engine-bump-live (tensorfold only, after that pin is written: list, checksum,
#       unpack and run the release archive) -> open or update the `chore/engine-bump-*` PR.
#       That PR's CI builds the engine images. ci.yml does not run this live archive test.
# Never: never merges, never pushes to `main`, never rewrites a skill it cannot re-derive (a removed
#        build option is recorded as a hard-fail instead, and the PR still opens).
on:
  schedule:
    - cron: "53 6 * * 1"   # weekly: Monday 06:53 UTC (unique minute, issue #275)
  workflow_dispatch:
    inputs:
      engine:
        description: "Only bump this engine (id); empty = all"
        required: false
        default: ""

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  issues: write

# concurrency: stacking is intended — it opens a PR per changed engine by pushing `chore/engine-bump-*`
# branches, so a second run starting mid-push would race those refs; the queued run re-derives from upstream
# when it starts (issue #917).
concurrency:
  group: engine-bump
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            if [ "$u" = "github-actions[bot]" ] && [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
              echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
              continue
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  plan:
    needs: [guard]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"   # the repo's pinned Python (issue #120)
      - id: p
        env:
          ENGINE: ${{ github.event.inputs.engine }}
        run: |
          if [ -n "$ENGINE" ]; then
            echo "matrix=$(make -s engine-bump-plan ENGINE=$ENGINE | python3 -c 'import json,sys;print(json.dumps({"include":json.load(sys.stdin)}))')" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(make -s engine-bump-plan | python3 -c 'import json,sys;print(json.dumps({"include":json.load(sys.stdin)}))')" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: [plan]
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' && needs.plan.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: read
    name: bump-${{ matrix.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"   # the repo's pinned Python (issue #120)
      - name: make engine-bump (pin + derive + apply + regen)
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(make engine-bump ENGINE=${{ matrix.id }}) || {
            echo "::error::engine bump failed for ${{ matrix.id }}"
            exit 1
          }
          echo "$out"
          # a derive hard-fail is recorded, not fatal: the PR still opens, and the
          # body flags it so a human fixes the skill (CI goes red on the build).
          hf=$(echo "$out" | grep -o '"hard_fail": "[^"]*"' | head -1 | sed 's/.*: "//; s/"$//')
          echo "hard_fail=$hf" >> "$GITHUB_OUTPUT"
          deps=$(echo "$out" | sed -n 's/^\[engine-bump\] DEPS //p' | head -1)
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
      # The documentation review of the params the bump just derived (issue #583). The deterministic
      # half writes the input (the engine's docs at the new pin + the params this repo builds with),
      # Hermes proposes only parameters whose flag AND quote are in the upstream tree, and the apply
      # step validates and writes them to the skill, then regenerates params + Dockerfiles.
      #
      # It never blocks the bump: a review that fails or proposes nothing still opens the PR, and the
      # body says so. What it MAY change is exactly what the docs quote proves; anything else is
      # dropped and listed in the body.
      - name: Documentation review of the derived params (issue #583)
        id: review
        continue-on-error: true
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ENGINE: ${{ matrix.id }}
        run: |
          set +e
          make engine-params-review-brief ENGINE="$ENGINE"
          brief_rc=$?
          if [ "$brief_rc" != "0" ]; then
            echo "::warning::the review brief failed for $ENGINE (rc=$brief_rc); no documentation review this run"
            exit 0
          fi
          make agent-jev-preflight NERVE_REQUIRE=1 || echo "::warning::the JEV layer is not active; the review leg still runs"
          make engine-params-review ENGINE="$ENGINE"
          review_rc=$?
          if [ "$review_rc" != "0" ]; then
            echo "::warning::the review leg exited $review_rc for $ENGINE; the PR opens without its proposals"
          fi
          make engine-params-review-apply ENGINE="$ENGINE" || \
            echo "::warning::the review apply step failed for $ENGINE; nothing was applied"
          exit 0
      # The live archive proof belongs here, after the new pin and parameter list exist, and
      # before the PR whose CI builds the engine. It reads the TensorFold pin, so only that
      # matrix row pays for the download. ci.yml's unit job does not run it (issue #995).
      - name: Set up Docker for the TensorFold archive proof
        if: matrix.id == 'tensorfold'
        uses: ./.github/actions/docker
      - name: make test-env
        if: matrix.id == 'tensorfold'
        run: make test-env
      - name: make test-engine-bump-live (pinned TensorFold release archive, after the new params)
        if: matrix.id == 'tensorfold'
        run: make test-engine-bump-live
      - name: Open / update the bump PR
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          ID: ${{ matrix.id }}
          OLD: ${{ matrix.old_sha }}
          NEW: ${{ matrix.new_sha }}
          REF: ${{ matrix.new_ref }}
          HARD_FAIL: ${{ steps.bump.outputs.hard_fail }}
          DEPS: ${{ steps.bump.outputs.deps }}
        run: |
          # Authored as one of the two identities a PR's commits may carry (`Asimov Agent`,
          # issue #345), sourced from the ONE seam that sets it (issue #840) instead of a literal
          # typed into this file. The PUSH/PR still use BUMP_TOKEN, so the PR is opened by a real
          # account and CI starts (issue #136) — only the git AUTHOR is pinned, because `gh api user`
          # would otherwise stamp the token owner's LOGIN (e.g. `asimov-agent`), which is not an
          # allowed spelling and fails `make check-pr-authors` on this very PR.
          make git-identity-apply
          branch="chore/engine-bump-${ID}"
          git switch -C "$branch"
          git add skills/engines/${ID}/SKILL.md containers/engines/params/${ID}.json containers/engines/dockerfiles/${ID}/ tests/ docs/ data/strata_models.json
          msg=$(printf 'Issue: #107 — the weekly engine bump found %s at %s, pinned at %s.\n\nFix: re-derived the install recipe at %s and applied it to SKILL.md, the frozen per-arch Dockerfiles, the params and the Strata model list.\n\nBenefit: llgenie builds and serves this engine at the upstream release instead of a stale pin.\n\nTechnical: make engine-bump ENGINE=%s (derive -> pin -> apply -> make generate-engine-params). CI builds and tests the images of this engine only; a red PR means the new upstream commit needs a manual skill fix.' "$ID" "$REF" "${OLD:0:8}" "$REF" "$ID")
          git commit -m "chore(engine): bump ${ID} to ${REF}@${NEW:0:8}" -m "$msg" || { echo "nothing to commit"; exit 0; }
          git push --force origin "$branch"
          # The author a reviewer sees, before the diff (issue #840): the identity the commit above
          # actually carries, read from the same seam that set it.
          author="$(make -s git-identity-line)"
          body=$(printf '%s\n\nAutomated engine pin bump (issue #107).\n\n- **Engine:** `%s`\n- **Pin:** `%s` -> `%s` (`%s`)\n- **Compare:** https://github.com/${{ github.repository }}/compare/%s...%s\n- CI builds and tests ONLY this engine'\''s images. A red PR means the new commit needs a manual skill fix.' "$author" "$ID" "${OLD:0:8}" "${NEW:0:8}" "$REF" "$OLD" "$NEW")
          if [ -n "$HARD_FAIL" ]; then
            body="$(printf '%b' "${body}" '\n' '\n' '> ⚠️ **Manual review required:** a build parameter could not be auto-derived — ' "$HARD_FAIL" '. The pin is bumped and the PR is open; CI will go red on the build until the skill is fixed by hand.')"
          fi
          if [ -n "$DEPS" ]; then
            body="$(printf '%b' "${body}" '\n' '- **Dependencies:** ' "$DEPS")"
          fi
          # The documentation review of the derived params (issue #583): what the engine's own docs
          # proved, and every proposal the host refused. Written by the review step above.
          if [ -s params-review-section.md ]; then
            body="$(printf '%b' "${body}" '\n')$(cat params-review-section.md)"
          fi
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "chore(engine): bump ${ID} to ${REF}@${NEW:0:8}" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "chore(engine): bump ${ID} to ${REF}@${NEW:0:8}" --body "$body"
          fi
