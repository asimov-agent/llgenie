name: CI

on:
  push:
    branches: ["**"]      # ALL branches
  pull_request:

# Every verification stage is its own independent job (GitHub Actions runs
# jobs in parallel by default). Each job drives a Makefile target — the SAME
# commands that `make loop` runs locally — and everything runs in the
# containerized test image (python + pytest + CPU llama-server), so CI, the
# local nerdctl host, and the local loop behave identically.
#
# Each stage builds the test image first (cached by the runner), runs the
# equivalent `make <stage>`, then prunes any orphaned test containers via
# `make test-clean` ("always removed"). The container is always started by the
# make target (RUNTIME resolves nerdctl->docker), never invoked directly.
jobs:
  # ------------------------------------------------------------------
  # lint: linefeed / editorconfig (make lint)
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build test image
        run: make test-image
      - name: make lint
        run: make lint
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # unit: hermetic unit tests (make test-unit)
  # ------------------------------------------------------------------
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: make test-image
      - name: make test-unit
        run: make test-unit
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # cron: exercise the REAL make cron-* targets (issue #67)
  # Runs make cron-snapshot, then drives make cron-install (x2, idempotency)
  # and make cron-uninstall against a FAKE crontab (CRONTAB_CMD shim) — so the
  # make layer is literally executed in CI without touching any real crontab.
  # ------------------------------------------------------------------
  cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make cron-snapshot (real make invocation of the cron machinery)
        run: make cron-snapshot
      - name: Drive make cron-install/uninstall against a fake crontab shim
        run: |
          set -eu
          export CRONTAB_CMD="$PWD/tests/fixtures/fake-crontab.sh"
          export FAKE_CRONTAB_FILE="$(mktemp)"
          echo "seed unrelated line" > "$FAKE_CRONTAB_FILE"
          # install twice -> exactly one entry (idempotency)
          make cron-install
          make cron-install
          test "$(grep -c '^\*/20' "$FAKE_CRONTAB_FILE")" = "1" || { echo "FAIL: expected exactly 1 */20 line"; exit 1; }
          grep -q "seed unrelated line" "$FAKE_CRONTAB_FILE" || { echo "FAIL: unrelated line lost"; exit 1; }
          # uninstall -> watch line gone, unrelated preserved
          make cron-uninstall
          if grep -q '^\*/20' "$FAKE_CRONTAB_FILE"; then echo "FAIL: */20 line still present"; exit 1; fi
          grep -q "seed unrelated line" "$FAKE_CRONTAB_FILE" || { echo "FAIL: unrelated line lost on uninstall"; exit 1; }
          echo "CRON MAKE-TARGETS OK: install idempotent, uninstall preserves unrelated"
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # watch-report: exercise the REAL make watch-report target end-to-end
  # against a FAKE .watchloop tree + a FAKE gh shim (mirrors the cron job's
  # fake-crontab pattern). No real loop data / no GitHub token / no network.
  # Asserts the command exits 0 and prints the report sections.
  # ------------------------------------------------------------------
  watch-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make watch-report (fixture .watchloop + fake gh shim)
        run: |
          set -eu
          # Point PATH at the fake gh shim so watch_report's `gh` calls return
          # fixture JSON without a real token or network.
          mkdir -p "$HOME/fakebin"
          cp tests/fixtures/watch-report/fake-gh.sh "$HOME/fakebin/gh"
          chmod +x "$HOME/fakebin/gh"
          export PATH="$HOME/fakebin:$PATH"
          export WATCH_REPORT_FIXTURE_ROOT="$PWD"
          # Run the real make target against the fixture .watchloop tree.
          out="$(make watch-report WATCHLOOP="$PWD/tests/fixtures/watch-report")"
          # Assert the report produced its sections from the fixtures.
          printf '%s\n' "$out"
          echo "$out" | grep -q "## LIVE GitHub state" || { echo "FAIL: missing GitHub state section"; exit 1; }
          echo "$out" | grep -q "## Worker sessions" || { echo "FAIL: missing Worker sessions section"; exit 1; }
          echo "$out" | grep -q "## Dispatcher timeline" || { echo "FAIL: missing Dispatcher timeline section"; exit 1; }
          echo "$out" | grep -q "## CI-red reaction" || { echo "FAIL: missing CI-red reaction section"; exit 1; }
          echo "$out" | grep -q "1 FAIL" || { echo "FAIL: expected the fixture's 1 failing CI check to be surfaced"; exit 1; }
          echo "WATCH-REPORT MAKE-TARGET OK: command runs and prints all sections"

  # ------------------------------------------------------------------
  # dispatch-e2e: REAL agent-spawn end-to-end (issue #63) — drives the actual
  # dispatcher spawn/kill/respawn against a fake worker that does README
  # issue-work, asserted. Runs in <1 minute via make test-agents-e2e (only
  # tests/*_e2e*.py). No GitHub API / no LLM / no network.
  # ------------------------------------------------------------------
  dispatch-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: make test-image
      - name: make test-agents-e2e (real dispatcher spawn/reclaim, README issue-work)
        run: make test-agents-e2e
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # install: REAL host-install tests (make test-install-ci) — performs a real
  # `make install` + seeds a model + asserts the artifacts, all in ONE container.
  # NO SKIPS: a missing prerequisite fails the job loudly, it never silently skips.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: make test-image
      - name: make test-install-ci (real install, no skips)
        run: make test-install-ci
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # agents-read: AGENTS.md must not match Hermes context-file threat patterns.
  # Runs on its OWN python:3.12 image (hermes-agent needs Python >=3.11) so it
  # does NOT bump the heavy 3.10 test image and avoids its dep conflicts. The
  # guard imports the REAL hermes-agent PyPI package (pinned ==0.19.0, a
  # 3rd-party dependency), never a vendored copy.
  # ------------------------------------------------------------------
  agents-read:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install hermes-agent + pytest (hermes is a declared PyPI dep)
        run: pip install --no-cache-dir "hermes-agent==0.19.0" pytest
      - name: Scan AGENTS.md (fail-closed guard)
        run: python scripts/scan_agents_md.py AGENTS.md
      - name: Unit-test the guard (edge cases + permutation corpus; --noconftest to skip the gguf venv root conftest)
        run: python -m pytest tests/test_agents_read.py --noconftest -p no:cacheprovider -q

  # ------------------------------------------------------------------
  # openspec: validate the active OpenSpec change (make openspec-validate)
  # ------------------------------------------------------------------
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: make openspec-image
        run: make openspec-image
      - name: make openspec-validate
        run: make openspec-validate NAME=ci-pipeline
      # Scan ALL active OpenSpec changes, not just NAME=ci-pipeline. A feature PR
      # introduces its OWN new change dir under openspec/changes/<name>; scoping
      # this check to a single always-present change (ci-pipeline) would let a PR
      # land with unticked `- [ ]` tasks in its own change and CI stay green.
      # check_openspec_tasks.py with no NAME walks every active change, so a PR
      # that adds an incomplete change fails RED here.
      - name: Assert all active changes have all tasks checked (fails on any unchecked `- [ ]`)
        run: make openspec-tasks-check
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # cpu-health: Real CPU-only lightweight-LLM check (make test-health).
  # `test-health` == download-test-model && pytest test_health.py, all inside
  # the container that bundles the CPU-built llama-server. NO GPU anywhere.
  # ------------------------------------------------------------------
  cpu-health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build test image (incl. CPU llama-server)
        run: make test-image
      - name: make test-health (CPU LLM answers "hi")
        run: make test-health
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # top-tier: REAL (no-mock) top-tier acceptance (issue #49) — live HF
  # trending + dynamic fit gate + provider-aware placement + real `hf`
  # download, containerized/CPU. Deterministic card size (16 GB) so any runner
  # passes; no mock/skip.
  # ------------------------------------------------------------------
  top-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Build test image (bundles hf + gguf + CPU llama-server)"
        run: make test-image
      - name: "make test-top-tier-ci (real acceptance: download, no mocks, CPU)"
        run: make test-top-tier-ci
      - name: "make test-top-tier-serve-ci (lightweight download + load + hi + RAM)"
        run: make test-top-tier-serve-ci
      - name: "REAL CLI dry run (llgenie --download-top-tier --dry --count 2 in-container)"
        run: make test-top-tier-cli-ci
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # #84/#89 variant matrix: build + verify EVERY tree x backend variant.
  #
  #   server-variants        (ubuntu-latest)  -> prism+cpu, prism+cuda,
  #                                                upstream+cpu, upstream+cuda
  #   server-variants-mac    (macos-14)       -> prism+metal, prism+cpu,
  #                                                upstream+metal, upstream+cpu
  #
  # The two jobs run in PARALLEL. Each variant is built via
  # scripts/build_llama_server.sh (clone-or-pull + cmake, always to the
  # latest commit) and the resulting CLI binary is verified with --version
  # + --help (exit 0). CUDA variants additionally assert that ldd links the
  # cuda runtime libs; CPU variants run the 0.5B "hi" health check
  # (scripts/ci_health.py) so the binary actually serves a model.
  #
  # The ubuntu job runs everything inside the CUDA+python variant image
  # (gguf-tools/ci-variant:latest) which bundles nvcc + build toolchain +
  # python/deps/hf, so the build and the "hi" check share one code path.
  # The macos job runs on the native Apple-Silicon toolchain (Metal is
  # Apple-only; the metal builds can only run there).
  # ------------------------------------------------------------------

  server-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the CUDA+python variant image
        run: make test-variant-image
      - name: make install-prism-cpu (real install + 0.5B "hi")
        run: |
          set -eu
          docker run --rm -e HOME=/root -v "$PWD":/repo:rw \
            --entrypoint bash gguf-tools/ci-variant:latest -c '
            cd /repo
            make install-prism-cpu
            srv="$(readlink ~/bin/llama-server)"
            [ -x "$srv" ] || { echo "prism+cpu: installed server not executable"; exit 1; }
            "$srv" --version 2>&1 | grep -m1 version || { echo "prism+cpu --version FAILED"; exit 1; }
            "$srv" --help >/dev/null 2>&1 || { echo "prism+cpu --help FAILED"; exit 1; }
            echo "prism+cpu: make install OK -> $srv"
            python3 scripts/ci_health.py --server-bin "$srv"
            '
      - name: make install-prism-cuda (real install + cuda link check)
        run: |
          set -eu
          docker run --rm -e HOME=/root -v "$PWD":/repo:rw \
            --entrypoint bash gguf-tools/ci-variant:latest -c '
            cd /repo
            make install-prism-cuda
            srv="$(readlink ~/bin/llama-server)"
            [ -x "$srv" ] || { echo "prism+cuda: installed server not executable"; exit 1; }
            "$srv" --version 2>&1 | grep -m1 version || { echo "prism+cuda --version FAILED"; exit 1; }
            "$srv" --help >/dev/null 2>&1 || { echo "prism+cuda --help FAILED"; exit 1; }
            ldd "$srv" 2>/dev/null | grep -Eq "libcudart|libcublas" \
              || { echo "prism+cuda: installed server does NOT link cuda runtime libs"; exit 1; }
            echo "prism+cuda: make install OK + cuda libs linked -> $srv"
            '
      - name: make install-upstream-cpu (real install + 0.5B "hi")
        run: |
          set -eu
          docker run --rm -e HOME=/root -v "$PWD":/repo:rw \
            --entrypoint bash gguf-tools/ci-variant:latest -c '
            cd /repo
            make install-upstream-cpu
            srv="$(readlink ~/bin/llama-server)"
            [ -x "$srv" ] || { echo "upstream+cpu: installed server not executable"; exit 1; }
            "$srv" --version 2>&1 | grep -m1 version || { echo "upstream+cpu --version FAILED"; exit 1; }
            "$srv" --help >/dev/null 2>&1 || { echo "upstream+cpu --help FAILED"; exit 1; }
            echo "upstream+cpu: make install OK -> $srv"
            python3 scripts/ci_health.py --server-bin "$srv"
            '
      - name: make install-upstream-cuda (real install + cuda link check)
        run: |
          set -eu
          docker run --rm -e HOME=/root -v "$PWD":/repo:rw \
            --entrypoint bash gguf-tools/ci-variant:latest -c '
            cd /repo
            make install-upstream-cuda
            srv="$(readlink ~/bin/llama-server)"
            [ -x "$srv" ] || { echo "upstream+cuda: installed server not executable"; exit 1; }
            "$srv" --version 2>&1 | grep -m1 version || { echo "upstream+cuda --version FAILED"; exit 1; }
            "$srv" --help >/dev/null 2>&1 || { echo "upstream+cuda --help FAILED"; exit 1; }
            ldd "$srv" 2>/dev/null | grep -Eq "libcudart|libcublas" \
              || { echo "upstream+cuda: installed server does NOT link cuda runtime libs"; exit 1; }
            echo "upstream+cuda: make install OK + cuda libs linked -> $srv"
            '
      - name: Prune orphaned test containers
        run: make test-clean

  server-variants-mac:
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install bash 5 + python 3.10 and put them on PATH
        # macOS ships bash 3.2 (no `set -o pipefail`/`[[ ]]` reliably) and a
        # python that may not be 3.10. build_llama_server.sh needs bash 4+ and
        # the gguf venv needs python 3.10, so install both via Homebrew and
        # prepend them to PATH for every subsequent step in this job.
        run: |
          set -eu
          brew install bash python@3.10
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/python@3.10/bin" >> "$GITHUB_PATH"
          bash --version | head -1
          python3 --version
      - name: python env for the 0.5B "hi" health check
        run: |
          set -eu
          python3 -m venv "$HOME/cihealth"
          "$HOME/cihealth/bin/pip" install --quiet gguf numpy "huggingface_hub[cli]>=0.30"
      - name: Build + verify prism+metal (--version/--help)
        run: |
          set -eu
          SERVER_ROOT="$HOME/repository/git"
          ./scripts/build_llama_server.sh prism metal
          B="$SERVER_ROOT/prism-llama.cpp/build-metal/bin/llama-server"
          "$B" --version 2>&1 | grep -m1 version || { echo "prism+metal --version FAILED"; exit 1; }
          "$B" --help >/dev/null 2>&1 || { echo "prism+metal --help FAILED"; exit 1; }
          echo "prism+metal: --version/--help OK (Apple Silicon)"
      - name: Build + verify prism+cpu, run 0.5B "hi"
        run: |
          set -eu
          SERVER_ROOT="$HOME/repository/git"
          ./scripts/build_llama_server.sh prism cpu
          B="$SERVER_ROOT/prism-llama.cpp/build-cpu/bin/llama-server"
          "$B" --version 2>&1 | grep -m1 version || { echo "prism+cpu --version FAILED"; exit 1; }
          "$B" --help >/dev/null 2>&1 || { echo "prism+cpu --help FAILED"; exit 1; }
          echo "prism+cpu: --version/--help OK"
          HF_BIN="$HOME/cihealth/bin/hf" "$HOME/cihealth/bin/python" scripts/ci_health.py --server-bin "$B"
      - name: Build + verify upstream+metal (--version/--help)
        run: |
          set -eu
          SERVER_ROOT="$HOME/repository/git"
          ./scripts/build_llama_server.sh upstream metal
          B="$SERVER_ROOT/llama.cpp/build-metal/bin/llama-server"
          "$B" --version 2>&1 | grep -m1 version || { echo "upstream+metal --version FAILED"; exit 1; }
          "$B" --help >/dev/null 2>&1 || { echo "upstream+metal --help FAILED"; exit 1; }
          echo "upstream+metal: --version/--help OK (Apple Silicon)"
      - name: Build + verify upstream+cpu, run 0.5B "hi"
        run: |
          set -eu
          SERVER_ROOT="$HOME/repository/git"
          ./scripts/build_llama_server.sh upstream cpu
          B="$SERVER_ROOT/llama.cpp/build-cpu/bin/llama-server"
          "$B" --version 2>&1 | grep -m1 version || { echo "upstream+cpu --version FAILED"; exit 1; }
          "$B" --help >/dev/null 2>&1 || { echo "upstream+cpu --help FAILED"; exit 1; }
          echo "upstream+cpu: --version/--help OK"
          HF_BIN="$HOME/cihealth/bin/hf" "$HOME/cihealth/bin/python" scripts/ci_health.py --server-bin "$B"
