name: CI

on:
  push:
    branches: ["**"]      # ALL branches
  pull_request:

# Every verification stage is its own independent job (GitHub Actions runs
# jobs in parallel by default). Each job drives a Makefile target — the SAME
# commands that `make loop` runs locally — and everything runs in the
# containerized test image (python + pytest + hf + docker CLI), so CI, the
# local nerdctl host, and the local loop behave identically.
#
# Each stage builds the test image first (cached by the runner), runs the
# equivalent `make <stage>`, then prunes any orphaned test containers via
# `make test-clean` ("always removed"). The container is always started by the
# make target (RUNTIME resolves nerdctl->docker), never invoked directly.
jobs:
  # ------------------------------------------------------------------
  # lint: linefeed / editorconfig (make lint)
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build test image
        run: make test-image
      - name: make lint
        run: make lint
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # unit: hermetic unit tests (make test-unit)
  # ------------------------------------------------------------------
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: make test-image
      - name: make test-unit
        run: make test-unit
      - name: make skills-validate (engine skills vs the trending-local-llms registry, issue #98)
        run: make skills-validate
      - name: make check-engine-params (committed per-arch engine params match the skills)
        run: make check-engine-params
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # cron: exercise the REAL make cron-* targets (issue #67)
  # Runs make cron-snapshot, then drives make cron-install (x2, idempotency)
  # and make cron-uninstall against a FAKE crontab (CRONTAB_CMD shim) — so the
  # make layer is literally executed in CI without touching any real crontab.
  # ------------------------------------------------------------------
  cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make cron-snapshot (real make invocation of the cron machinery)
        run: make cron-snapshot
      - name: Drive make cron-install/uninstall against a fake crontab shim
        run: |
          set -eu
          export CRONTAB_CMD="$PWD/tests/fixtures/fake-crontab.sh"
          export FAKE_CRONTAB_FILE="$(mktemp)"
          echo "seed unrelated line" > "$FAKE_CRONTAB_FILE"
          # install twice -> exactly one entry (idempotency)
          make cron-install
          make cron-install
          test "$(grep -c '^\*/20' "$FAKE_CRONTAB_FILE")" = "1" || { echo "FAIL: expected exactly 1 */20 line"; exit 1; }
          grep -q "seed unrelated line" "$FAKE_CRONTAB_FILE" || { echo "FAIL: unrelated line lost"; exit 1; }
          # uninstall -> watch line gone, unrelated preserved
          make cron-uninstall
          if grep -q '^\*/20' "$FAKE_CRONTAB_FILE"; then echo "FAIL: */20 line still present"; exit 1; fi
          grep -q "seed unrelated line" "$FAKE_CRONTAB_FILE" || { echo "FAIL: unrelated line lost on uninstall"; exit 1; }
          echo "CRON MAKE-TARGETS OK: install idempotent, uninstall preserves unrelated"
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # watch-report: exercise the REAL make watch-report target end-to-end
  # against a FAKE .watchloop tree + a FAKE gh shim (mirrors the cron job's
  # fake-crontab pattern). No real loop data / no GitHub token / no network.
  # Asserts the command exits 0 and prints the report sections.
  # ------------------------------------------------------------------
  watch-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make watch-report (fixture .watchloop + fake gh shim)
        run: |
          set -eu
          # Point PATH at the fake gh shim so watch_report's `gh` calls return
          # fixture JSON without a real token or network.
          mkdir -p "$HOME/fakebin"
          cp tests/fixtures/watch-report/fake-gh.sh "$HOME/fakebin/gh"
          chmod +x "$HOME/fakebin/gh"
          export PATH="$HOME/fakebin:$PATH"
          export WATCH_REPORT_FIXTURE_ROOT="$PWD"
          # Run the real make target against the fixture .watchloop tree.
          out="$(make watch-report WATCHLOOP="$PWD/tests/fixtures/watch-report")"
          # Assert the report produced its sections from the fixtures.
          printf '%s\n' "$out"
          echo "$out" | grep -q "## LIVE GitHub state" || { echo "FAIL: missing GitHub state section"; exit 1; }
          echo "$out" | grep -q "## Worker sessions" || { echo "FAIL: missing Worker sessions section"; exit 1; }
          echo "$out" | grep -q "## Dispatcher timeline" || { echo "FAIL: missing Dispatcher timeline section"; exit 1; }
          echo "$out" | grep -q "## CI-red reaction" || { echo "FAIL: missing CI-red reaction section"; exit 1; }
          echo "$out" | grep -q "1 FAIL" || { echo "FAIL: expected the fixture's 1 failing CI check to be surfaced"; exit 1; }
          echo "WATCH-REPORT MAKE-TARGET OK: command runs and prints all sections"

  # ------------------------------------------------------------------
  # dispatch-e2e: REAL agent-spawn end-to-end (issue #63) — drives the actual
  # dispatcher spawn/kill/respawn against a fake worker that does README
  # issue-work, asserted. Runs in <1 minute via make test-agents-e2e (only
  # tests/*_e2e*.py). No GitHub API / no LLM / no network.
  # ------------------------------------------------------------------
  dispatch-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: make test-image
      - name: make test-agents-e2e (real dispatcher spawn/reclaim, README issue-work)
        run: make test-agents-e2e
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # install: REAL host-install tests (make test-install-ci) — performs a real
  # `make install` + seeds a model + asserts the artifacts, all in ONE container.
  # NO SKIPS: a missing prerequisite fails the job loudly, it never silently skips.
  install:
    # The real user path, in the python test container: make install pulls/builds
    # every engine image with a cpu variant through the host docker socket and
    # writes the ~/bin start scripts, then make test-built-engine (each script
    # prints its engine version through its image), the install tests, llgenie
    # answering "hi" through the container llama-server, and make uninstall.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (engine images are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build test image
        run: make test-image
      - name: make test-install-ci (test container -> make install -> test-built-engine -> install tests -> hi -> uninstall)
        run: make test-install-ci ARCH=cpu
      - name: Prune orphaned test containers
        if: always()
        run: make test-clean

  # ------------------------------------------------------------------
  # engine-images (issue #98). Pure make, no LLM, nothing built on a laptop:
  #   engine-base: one shared toolchain image per backend (cpu/cuda/rocm/vulkan,
  #     containers/engines/base/Dockerfile.<backend>), built once, published to
  #     GHCR with a registry layer cache; every compiled engine builds FROM it.
  #   engine-matrix: job list from the committed params
  #     (make list-engine-images CI=1 JSON=1) - ONE image per engine x backend,
  #     GPU arch coverage is a fat build (CUDA 75..120, ROCm gfx1030..gfx1201).
  #   engine-image: all engine x backend images in PARALLEL via
  #     make build-engine ENGINE=… ARCH=… PUSH=1 (buildx, --cache-from/--cache-to
  #     GHCR). A tag already published (unchanged Dockerfile/params) is pulled,
  #     not rebuilt. cpu images are started and curl-tested (make test-engine).
  # ------------------------------------------------------------------
  engine-base:
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda, rocm, vulkan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    name: engine-base-${{ matrix.backend }}
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      # Publish (push images + registry cache) from EVERY push run, feature branches
      # included (default for now, #101): the repo's own GHCR (ghcr.io/<owner>),
      # so a fork's push run publishes to the fork's packages. pull_request runs
      # get a read-only token: they build, use the published cache, and test.
      PUBLISH: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (publishing runs only)
        if: ${{ env.PUBLISH == '1' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: make build-engine-base BACKEND=${{ matrix.backend }} (PUSH=1 on upstream pushes)
        run: make build-engine-base BACKEND=${{ matrix.backend }} PUSH=$PUBLISH

  engine-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(make -s list-engine-images CI=1 JSON=1)" >> "$GITHUB_OUTPUT"

  engine-image:
    needs: [engine-matrix, engine-base]
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.engine-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    name: engine-image-${{ matrix.engine }}-${{ matrix.variant }}
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      PUBLISH: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (CUDA/ROCm bases are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (publishing runs only)
        if: ${{ env.PUBLISH == '1' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: make build-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }} (built locally; pushed only after its tests pass)
        run: make build-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }}
      - name: Build test image (the post-build pytest stage runs in llgenie/test)
        run: make test-image
      - uses: astral-sh/setup-uv@v6
        if: matrix.test == 'serve'
      - name: hf CLI (tiny test model)
        if: matrix.test == 'serve'
        run: uv tool install "huggingface_hub[cli]>=0.30"
      # POST-BUILD TEST STAGE: every engine image is tested once built, in parallel
      # (matrix.test: 'serve' cpu images, 'detect' GPU images). Runs the python
      # tests/test_engine_runs.py: cpu images serve a tiny model and must answer
      # on the OpenAI endpoint (GET /v1/models -> llm-local, chat completion "hi");
      # GPU images can't serve on a GPU-less runner, so their entrypoint must at
      # least report the engine version (they are intentionally NOT started).
      - name: "post-build test: pytest tests/test_engine_runs.py in llgenie/test (endpoint: serve + answer on the OpenAI API)"
        if: matrix.test == 'serve'
        run: make test-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }}
      - name: "post-build test: pytest tests/test_engine_version.py (engine binary reports its version; GPU images can't serve here)"
        if: matrix.test == 'detect'
        run: make test-engine-image ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }}
      # PUBLISH STAGE: every push run (any branch), only after the build AND its tests passed
      # (any failed step above skips this). Pushes <registry>/<name>:<hash-arch>
      # and the moving <registry>/<name>:<arch> tag to GHCR.
      - name: make push-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }} (every push run, after tests passed)
        if: ${{ success() && env.PUBLISH == '1' }}
        run: make push-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }}

  # ------------------------------------------------------------------
  # engine-published-test (issue #102): SECOND MATRIX, one job per published
  # container image (test-published-<engine>-<arch>). After every image is built, tested and
  # pushed, test each one AGAIN as published, on a fresh runner with no build
  # and no cache: pull the pinned tag from GHCR, check its digest equals the
  # moving :<arch> tag, check the binary version, start the container and chat
  # "hi" on /v1/chat/completions (GPU images without GPU devices), then the real
  # install path (make engine-launchers pulls it, never builds; make test-built-engine).
  # Every push run (any branch: they all publish), so a feature branch's images
  # are pulled back and chatted with before the PR is merged.
  # ------------------------------------------------------------------
  engine-published-test:
    needs: [engine-matrix, engine-image]
    # runs even when some build jobs failed: every published image is still
    # tested; an image whose build/test failed was never pushed, so its job here
    # fails loudly on the pull (no skip)
    if: ${{ !cancelled() && github.event_name == 'push' && needs.engine-matrix.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.engine-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    name: test-published-${{ matrix.engine }}-${{ matrix.variant }}
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (CUDA/ROCm images are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      # a package published for the first time can be private until linked: pull
      # with the run's token (packages: read) instead of anonymously
      - name: Log in to GHCR (read)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: astral-sh/setup-uv@v6
      - name: hf CLI (tiny test model)
        run: uv tool install "huggingface_hub[cli]>=0.30"
      - name: Build test image
        run: make test-image
      # Every published image (GPU ones included) is started as a container and
      # must answer "hi" on its OpenAI chat endpoint. Hosted runners have no GPU:
      # GPU images run without GPU devices and their engine falls back to CPU.
      - name: "make test-published-engine (pull from GHCR, digest check, binary version, container answers hi on /v1/chat/completions)"
        run: make test-published-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }}
      - name: "install from the published image only (pull, never build) + make test-built-engine"
        # GPU-less runner: no CDI spec, the start script runs the GPU image on CPU
        env:
          LLGENIE_NO_GPU: "1"
        run: |
          make engine-launchers BIN="$RUNNER_TEMP/bin" ENGINES=${{ matrix.engine }} ARCH=${{ matrix.variant }}
          make test-built-engine BIN="$RUNNER_TEMP/bin"

  # ------------------------------------------------------------------
  # install-published: LAST stage. After every image was built, tested,
  # published and re-tested as published, the real `make install` runs on a
  # clean runner per backend (cpu/cuda/rocm/vulkan mocked via LLAMA_BACKEND; GPU
  # images run on CPU): it may only PULL that backend's published images,
  # llgenie answers "hi" through llama-server and prism-server, `llgenie --pick
  # --engine` pulls the picked engine on first use, and make uninstall leaves
  # nothing behind. Every push run (they all publish).
  # ------------------------------------------------------------------
  install-published:
    needs: [engine-published-test]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda, rocm, vulkan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    name: install-published-${{ matrix.backend }}
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (CUDA/ROCm images are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Log in to GHCR (read)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build test image
        run: make test-image
      - name: "make test-install-published BACKEND=${{ matrix.backend }} (pull only this backend's images, llgenie hi via both shims + --pick --engine, uninstall)"
        run: make test-install-published BACKEND=${{ matrix.backend }}
      - name: Prune orphaned test containers
        if: always()
        run: make test-clean

  # ------------------------------------------------------------------
  # engine-smoke-mac: Metal cannot run in a container, so macOS installs the
  # Metal engines natively through their skills on the hosted Apple runner.
  # ------------------------------------------------------------------
  engine-smoke-mac:
    strategy:
      fail-fast: false
      matrix:
        engine: [ollama, mlx]
    runs-on: macos-14
    timeout-minutes: 60
    name: engine-smoke-${{ matrix.engine }}-metal
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: hf CLI (tiny smoke models)
        run: uv tool install "huggingface_hub[cli]>=0.30"
      - name: make engine-smoke ENGINE=${{ matrix.engine }} BACKEND=metal
        env:
          LLAMA_BACKEND: metal
        run: make engine-smoke ENGINE=${{ matrix.engine }} BACKEND=metal
  # ------------------------------------------------------------------
  # agents-read: AGENTS.md must not match Hermes context-file threat patterns.
  # Runs on its OWN python:3.12 image (hermes-agent needs Python >=3.11) so it
  # does NOT bump the heavy 3.10 test image and avoids its dep conflicts. The
  # guard imports the REAL hermes-agent PyPI package (pinned ==0.19.0, a
  # 3rd-party dependency), never a vendored copy.
  # ------------------------------------------------------------------
  agents-read:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install hermes-agent + pytest (hermes is a declared PyPI dep)
        run: pip install --no-cache-dir "hermes-agent==0.19.0" pytest
      - name: Scan AGENTS.md (fail-closed guard)
        run: python scripts/scan_agents_md.py AGENTS.md
      - name: Unit-test the guard (edge cases + permutation corpus; --noconftest to skip the gguf venv root conftest)
        run: python -m pytest tests/test_agents_read.py --noconftest -p no:cacheprovider -q

  # ------------------------------------------------------------------
  # openspec: validate the active OpenSpec change (make openspec-validate)
  # ------------------------------------------------------------------
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: make openspec-image
        run: make openspec-image
      - name: make openspec-validate
        run: make openspec-validate NAME=ci-pipeline
      # Scan ALL active OpenSpec changes, not just NAME=ci-pipeline. A feature PR
      # introduces its OWN new change dir under openspec/changes/<name>; scoping
      # this check to a single always-present change (ci-pipeline) would let a PR
      # land with unticked `- [ ]` tasks in its own change and CI stay green.
      # check_openspec_tasks.py with no NAME walks every active change, so a PR
      # that adds an incomplete change fails RED here.
      - name: Assert all active changes have all tasks checked (fails on any unchecked `- [ ]`)
        run: make openspec-tasks-check
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # cpu-health: Real CPU-only lightweight-LLM check (make test-health).
  # pytest runs in the test container; llgenie serves the 0.5B model through
  # the llama.cpp ENGINE IMAGE (host docker socket) and must answer "hi".
  # ------------------------------------------------------------------
  cpu-health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: make test-image
      - name: make test-health (CPU LLM answers "hi")
        run: make test-health
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # top-tier: REAL (no-mock) top-tier acceptance (issue #49) — live HF
  # trending + dynamic fit gate + provider-aware placement + real `hf`
  # download, containerized/CPU. Deterministic card size (16 GB) so any runner
  # passes; no mock/skip.
  # ------------------------------------------------------------------
  top-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Build test image (bundles hf + gguf + docker CLI)"
        run: make test-image
      - name: "make test-top-tier-ci (real acceptance: download, no mocks, CPU)"
        run: make test-top-tier-ci
      - name: "make test-top-tier-serve-ci (lightweight download + load + hi + RAM)"
        run: make test-top-tier-serve-ci
      - name: "REAL CLI dry run (llgenie --download-top-tier --dry --count 2 in-container)"
        run: make test-top-tier-cli-ci
      - name: Prune orphaned test containers
        run: make test-clean

  # ------------------------------------------------------------------
  # #84/#89 native macOS variants (Metal cannot run in a container). The Linux
  # variants (prism/upstream x cpu/cuda) are now the engine images above:
  # engine-image-llama.cpp-* / engine-image-llama.cpp-prism-*, built from their
  # own base image and tested on the OpenAI endpoints by `make test-engine`.
  # ------------------------------------------------------------------
  server-variants-mac:
    name: ${{ matrix.name }}
    runs-on: macos-14
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server-build-prism-cpu-mac
            tree: prism
            backend: cpu
          - name: server-build-prism-metal
            tree: prism
            backend: metal
          - name: server-build-upstream-cpu-mac
            tree: upstream
            backend: cpu
          - name: server-build-upstream-metal
            tree: upstream
            backend: metal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install bash 5 + python 3.10 and put them on PATH
        # macOS ships bash 3.2 (no `set -o pipefail`/`[[ ]]` reliably) and a
        # python that may not be 3.10. build_llama_server.sh needs bash 4+ and
        # the gguf venv needs python 3.10, so install both via Homebrew and
        # prepend them to PATH for every subsequent step in this job.
        run: |
          set -eu
          brew install bash python@3.10
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix)/opt/python@3.10/bin" >> "$GITHUB_PATH"
          bash --version | head -1
          python3 --version
      - name: Restore the llama.cpp build cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llama-build
          key: llama-${{ runner.os }}-${{ matrix.tree }}-${{ matrix.backend }}-${{ github.run_id }}
          restore-keys: |
            llama-${{ runner.os }}-${{ matrix.tree }}-${{ matrix.backend }}-
      - name: python env for the 0.5B "hi" health check
        run: |
          set -eu
          python3 -m venv "$HOME/cihealth"
          "$HOME/cihealth/bin/pip" install --quiet gguf numpy "huggingface_hub[cli]>=0.30"
      - name: Build + verify ${{ matrix.tree }}+${{ matrix.backend }}
        env:
          VARIANT_TREE: ${{ matrix.tree }}
          VARIANT_BACKEND: ${{ matrix.backend }}
        run: |
          set -eu
          export PATH="$HOME/cihealth/bin:$PATH"
          export HF_BIN="$HOME/cihealth/bin/hf"
          export BUILD_JOBS="$(sysctl -n hw.ncpu)"
          export SERVER_ROOT="${RUNNER_TEMP}/llama-build"
          mkdir -p "$SERVER_ROOT"
          echo "runner cores: ${BUILD_JOBS}"
          make build-variant TREE="$VARIANT_TREE" BACKEND="$VARIANT_BACKEND"
          make test-serve-variant TREE="$VARIANT_TREE" BACKEND="$VARIANT_BACKEND"
          echo "${VARIANT_TREE}+${VARIANT_BACKEND}: make test-serve-variant OK"
