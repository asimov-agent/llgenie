name: CI

# ONE run per push, on every branch: a push to a branch with an open PR is not run a
# second time as a pull_request event (its checks show on the PR from this run).
on:
  push:
    branches: ["**"]      # ALL branches

# Two pipelines run in parallel (issue #112): `linux` (ubuntu-latest) and `macos`
# (macos-15-intel). Both run the same `make ci-<job>` commands and asserts:
# both call pipeline.yml, one job per target (issue #120: no combined jobs). Linux sets
# up Docker; macOS runs the same targets in the Python 3.11 venv and never runs a Docker
# GitHub Action. Both must succeed for the run to be green.
# macOS never runs an inference server in a container and its runners have no Metal
# GPU (issue #120): there is no macOS published-image stage and no native-engine CI
# job. Native Metal engines are verified on an Apple-Silicon host with
# `make ci-engines BACKEND=metal`.
#
# ci-images (issue #117) publishes the CI images (llgenie/test, llgenie/openspec) to GHCR
# once per content hash; every other job PULLS them (make test-image-pull /
# make openspec-image-pull) and never builds them.
#
# The engine images are built ONCE (engine-base / engine-image / engine-published-test,
# Linux: the images are linux containers), then installed from GHCR on Linux only
# (published.yml: make test-install-published per backend).
jobs:
  # ------------------------------------------------------------------
  # ci-images (issue #117): the test image and the OpenSpec CLI image, tagged with a
  # hash of their Dockerfile + lockfiles (scripts/ci_images.py). A hash already on
  # GHCR is one manifest lookup; a new one is built ONCE for linux/amd64 + linux/arm64
  # (registry layer cache) and pushed. Every job below pulls it instead of building.
  # ------------------------------------------------------------------
  ci-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: make publish-ci-images (build + push only the hashes not on GHCR yet)
        run: make publish-ci-images
      - name: make ci-image-refs
        run: make ci-image-refs

  linux:
    needs: [ci-images]
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: read
      packages: read
    with:
      runner: ubuntu-latest

  macos:
    needs: [ci-images]
    uses: ./.github/workflows/pipeline.yml  # the SAME file as linux: one job per make ci-<job>, no combined jobs (issue #120)
    permissions:
      contents: read
      packages: read
    with:
      runner: macos-15-intel   # required: a macOS failure fails the run, same as Linux

  # ------------------------------------------------------------------
  # engine-images (issue #98). Pure make, no LLM, nothing built on a laptop:
  #   engine-base: one shared toolchain image per backend (cpu/cuda/rocm/vulkan,
  #     containers/engines/base/Dockerfile.<backend>), built once, published to
  #     GHCR with a registry layer cache; every compiled engine builds FROM it.
  #   engine-matrix: job list from the committed params
  #     (make list-engine-images CI=1 JSON=1) - ONE image per engine x backend,
  #     GPU arch coverage is a fat build (CUDA 75..120, ROCm gfx1030..gfx1201).
  #   engine-image: all engine x backend images in PARALLEL via
  #     make build-engine ENGINE=… ARCH=… PUSH=1 (buildx, --cache-from/--cache-to
  #     GHCR). A tag already published (unchanged Dockerfile/params) is pulled,
  #     not rebuilt. cpu images are started and curl-tested (make test-engine).
  # ------------------------------------------------------------------
  engine-base:
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda, rocm, vulkan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    name: engine-base-${{ matrix.backend }}
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      # Publish (push images + registry cache) from EVERY push run, feature branches
      # included (default for now, #101): the repo's own GHCR (ghcr.io/<owner>),
      # so a fork's push run publishes to the fork's packages. pull_request runs
      # get a read-only token: they build, use the published cache, and test.
      PUBLISH: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (every run is a push run and publishes)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: make build-engine-base BACKEND=${{ matrix.backend }} (PUSH=1 on push runs)
        run: make build-engine-base BACKEND=${{ matrix.backend }} PUSH=$PUBLISH

  engine-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(make -s list-engine-images CI=1 JSON=1)" >> "$GITHUB_OUTPUT"

  engine-image:
    needs: [engine-matrix, engine-base, ci-images]
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.engine-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    name: engine-image-${{ matrix.engine }}-${{ matrix.variant }}
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      PUBLISH: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (CUDA/ROCm bases are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (every run is a push run and publishes)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: make build-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }} (built locally; pushed only after its tests pass)
        run: make build-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }}
      - name: Pull the test image (GHCR, published by ci-images; the post-build pytest stage runs in llgenie/test)
        run: make test-image-pull
      - uses: astral-sh/setup-uv@v6
      - name: hf CLI (tiny test model)
        run: uv tool install "huggingface_hub[cli]>=0.30"
      # POST-BUILD TEST STAGE: every engine image is tested once built, in parallel, by ONE
      # step (no skipped step, issue #117): make test-engine-stage TEST=<matrix.test> runs
      # tests/test_engine_runs.py for 'serve' (cpu images serve a tiny model and must answer
      # on the OpenAI endpoint: GET /v1/models -> llm-local, chat completion "hi") and
      # tests/test_engine_version.py for 'detect' (GPU images can't serve on a GPU-less
      # runner, so their entrypoint must at least report the engine version).
      - name: "post-build test: make test-engine-stage TEST=${{ matrix.test }} (serve: pytest tests/test_engine_runs.py in llgenie/test (endpoint: answers on the OpenAI API); detect: pytest tests/test_engine_version.py (engine binary reports its version))"
        run: make test-engine-stage ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }} TEST=${{ matrix.test }}
      # PUBLISH STAGE: every push run (any branch), only after the build AND its tests passed
      # (a failed step above fails the job before this). Pushes <registry>/<name>:<hash-arch>
      # and the moving <registry>/<name>:<arch> tag to GHCR.
      - name: make push-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }} (every push run, after tests passed)
        run: make push-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }}

  # ------------------------------------------------------------------
  # engine-published-test (issue #102): SECOND MATRIX, one job per published
  # container image (test-published-<engine>-<arch>). After every image is built, tested and
  # pushed, test each one AGAIN as published, on a fresh runner with no build
  # and no cache: pull the pinned tag from GHCR, check its digest equals the
  # moving :<arch> tag, check the binary version, start the container and chat
  # "hi" on /v1/chat/completions (GPU images without GPU devices), then the real
  # install path (make engine-launchers pulls it, never builds; make test-built-engine).
  # Every push run (any branch: they all publish), so a feature branch's images
  # are pulled back and chatted with before the PR is merged.
  # ------------------------------------------------------------------
  engine-published-test:
    needs: [engine-matrix, engine-image, ci-images]
    # runs even when some build jobs failed: every published image is still
    # tested; an image whose build/test failed was never pushed, so its job here
    # fails loudly on the pull (no skip)
    if: ${{ !cancelled() && github.event_name == 'push' && needs.engine-matrix.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.engine-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    name: test-published-${{ matrix.engine }}-${{ matrix.variant }}
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (CUDA/ROCm images are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      # a package published for the first time can be private until linked: pull
      # with the run's token (packages: read) instead of anonymously
      - name: Log in to GHCR (read)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: astral-sh/setup-uv@v6
      - name: hf CLI (tiny test model)
        run: uv tool install "huggingface_hub[cli]>=0.30"
      - name: Pull the test image (GHCR, published by ci-images)
        run: make test-image-pull
      # Every published image (GPU ones included) is started as a container and
      # must answer "hi" on its OpenAI chat endpoint. Hosted runners have no GPU:
      # GPU images run without GPU devices and their engine falls back to CPU.
      - name: "make test-published-engine (pull from GHCR, digest check, binary version, container answers hi on /v1/chat/completions)"
        run: make test-published-engine ENGINE=${{ matrix.engine }} ARCH=${{ matrix.variant }}
      - name: "install from the published image only (pull, never build) + make test-built-engine"
        # GPU-less runner: no CDI spec, the start script runs the GPU image on CPU
        env:
          LLGENIE_NO_GPU: "1"
        run: |
          make engine-launchers BIN="$RUNNER_TEMP/bin" ENGINES=${{ matrix.engine }} ARCH=${{ matrix.variant }}
          make test-built-engine BIN="$RUNNER_TEMP/bin"

  # ------------------------------------------------------------------
  # install-published: LAST stage, Linux only (macOS has no published images to test:
  # it never runs an engine container, issue #120). Every push run (issue #117).
  # ------------------------------------------------------------------
  linux-published:
    needs: [engine-published-test]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    uses: ./.github/workflows/published.yml
    permissions:
      contents: read
      packages: read
    with:
      runner: ubuntu-latest
