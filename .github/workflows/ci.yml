name: CI

# Runs on pull requests (targeting main) AND on merges to main — never on a bare
# feature-branch push. This keeps the upstream pipeline (and the GHCR publish on
# main) working while feature branches don't burn CI by themselves. For cross-repo
# fork PRs the upstream pipeline runs the PR and its checks report on the PR.
on:
  pull_request:
    branches: ["main"]
    # A docs-only diff does not start this workflow at all (issue #824): the class is selected at the
    # TRIGGER, because a job-level `if:` that skips a stage is invisible in the job list and
    # `tests/test_ci_images.py::test_no_ci_step_or_job_is_skipped` allows no such shape. The docs gates
    # themselves (`lint`, `check-docs`, `check-wiring`, `check-issue-bodies`, `openspec`) run in
    # `scope.yml`, which carries no path filter and reports one always-present `scope` check.
    #
    # This list is `scripts/ci_scope.py::DOCS_TRIGGER_IGNORE` — the `docs` class MINUS its wildcards, so
    # a path that can change what any gate proves re-includes the whole matrix (`AGENTS.md` is a `*.md`).
    # `tests/test_ci_scope.py` asserts the two agree, so the YAML cannot drift from the classifier.
    paths-ignore:
      - "docs/**"
      - "agent-wiki/**"
      - "openspec/**"
      - "README.md"
      - "CHANGES.md"
  push:
    branches: ["main"]    # merges: run the PR gate suite (engine build/publish lives in engine-build)

# Hub calls (unit pick, hf download, engine containers) send this. The value is
# the repo Actions secret HF_TOKEN. Reusable workflows receive it via secrets: inherit.
env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# A push to a PR SUPERSEDES the run it replaces (issue #288): the group carries `github.ref`, which
# for a pull_request run is `refs/pull/<n>/merge`, so one PR cancels its own previous run and two
# different PRs never cancel each other. Without it a second push left the first run's jobs alive —
# measured 2026-10-15: `feat/bot-pipeline-isolation` had run 38680205632 (sha 345e7eb8) and run
# 38683422700 (sha 846d4ed8) both live — and a same-repo PR run PUBLISHED engine images to GHCR
# (`make push-engine` was an unconditional step of the engine-image job), so both were building and
# pushing the same images while the superseded one sat in the runner queue. Engine publish has since
# moved to the engine-build producer (#1027), so ci.yml cancels no engine publish from here.
#
# `cancel-in-progress` is TRUE for pull_request ONLY: a `push` to main must never cancel a main run
# that is mid-publish (a cancelled publish leaves the content-hash tag half-pushed and the next run
# republishes all of it). The bots are untouched — they keep `cancel-in-progress: false`, because a
# repair/rebase that is 40 minutes into a 180-minute agent job must never be killed by its next tick.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ONE pipeline runs: `linux` (ubuntu-latest), issue #112. There is no macOS group in CI any more
# (#870, owner instruction "no more mac runners, disable the stages").
#
# Why, measured: the hosted macOS pool on this account is not reliably issued. Probe run
# 40741670180 queued all three hosted macOS labels for 14 minutes each with `runner=NONE`, while the
# repository holds 10 SUCCESSFUL macOS jobs in the same "GitHub Actions" runner group and 54 macOS
# jobs were cancelled with no runner ever assigned.
# The resource exists but is not issued in parallel, so any PR that depends on a macOS row depends
# on a queue that may never reach it - measured on #767 (one documentation file): 26 green jobs,
# zero failures, waiting two hours on `macos / unit` alone.
#
# Consequence, stated so it is not discovered later: **a macOS-path change now needs hand review.**
# `pipeline.yml` is untouched and still capable of running on a macOS runner (it takes the label as
# an input), so the coverage can be restored by adding a caller back - but nothing requests a macOS
# runner today, which means no check on this repository exercises macOS. `make ci-engines
# BACKEND=metal` and the native-engine targets remain verified on an Apple-Silicon host by hand.
#
# ONE HEAVY ROW IS NOT A PR GATE (issue #859). `linux / top-tier` downloads and serves a real model
# on every pull request; what it proves is a property of `main` and of the weekly engine/registry
# data, not of a diff. It does not run on a pull request any more, and it DOES run on every non-PR
# event (this file's `push` to main: one run per merge still catches a model/engine regression) and
# on a pull request carrying the `ci:slow` label — the decision is scripts/ci_slow_rows.py behind
# `make ci-slow-rows`, published by the `guard` job and consumed by `pipeline.yml`'s `top-tier`
# matrix (see "ROW SELECTION" there). Every other row is unchanged: `linux / unit` remains the PR
# gate for the suite, and `linux / cpu-health` still serves a real model on a PR. docs/BOTS.md
# states the trade. The macOS rows #859 also named are gone by deletion (#870), not by a condition.
#
# ci-images (issue #117) publishes the CI images (llgenie/test, llgenie/openspec) to GHCR
# once per content hash; every other job PULLS them (make test-image-pull /
# make openspec-image-pull) and never builds them.
#
# The engine images are built, verified, published to GHCR and install-tested by the
# engine-build PRODUCER workflow (build-engine -> test-engine-stage -> push-engine ->
# test-engine-install), not by ci.yml: this pipeline builds and tests no engine (issue #1027).
jobs:
  # ------------------------------------------------------------------
  # guard (issue #122): only collaborators, the github-actions[bot], and the repo
  # owner may trigger this workflow. A push to a fork runs the workflow in the FORK
  # (its own GHCR), never upstream; this guard additionally fails the run when the
  # actor is not a collaborator/owner/bot, so a non-collaborator can never drive the
  # upstream's publish jobs (ci-images pushes CI images to GHCR; engine images are published
  # only by the engine-build producer, which has its own owner/collaborator guard).
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # guard (issue #122, hardened by #295): only the owner, a collaborator with WRITE access, or
  # the bot may drive this workflow. Both `github.actor` and `github.triggering_actor` are checked,
  # and the refusal is this step's non-zero exit — every publishing job needs `guard` (directly or
  # through `ci-images`), so a refused run never reaches GHCR. (The old form accepted ANY
  # collaborator level, because `GET /collaborators/<user>` answers 204 for read and triage too.)
  # ------------------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WHICH HEAVY ROWS THIS RUN SCHEDULES (issue #859). `linux / top-tier` downloads and serves a
    # real model — a property of `main` and of the weekly engine/registry data, not of an arbitrary
    # diff — and it is one of the longest rows. It is therefore NOT scheduled on a pull request and
    # IS scheduled on every non-PR event (the `push` to `main`, so one run per merge still catches a
    # model/engine regression), and on a pull request carrying the `ci:slow` label.
    # (The macOS half of #859 is moot by deletion: `ci.yml` has no `macos` group since #870.)
    # The decision is scripts/ci_slow_rows.py (make ci-slow-rows), not an expression in this file,
    # so it is tested — tests/test_ci_slow_rows.py. The `linux` caller passes the result into
    # pipeline.yml, whose `top-tier` job uses it as its ONE matrix axis; a row the run does not
    # schedule is the `["none"]` placeholder, which runs no make target and prints why it did
    # nothing. Nothing is skipped silently, and no other row changes: `linux / unit` is still the
    # PR gate for the suite. docs/BOTS.md states the trade.
    outputs:
      top_tier_rows: ${{ steps.rows.outputs.top_tier_rows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The author gate below reads the commits a PR ADDS (`base..HEAD`), so the base branch has
          # to exist locally; a shallow clone has neither it nor the PR's own history (issue #840).
          fetch-depth: 0
      # The commit identity, checked in SECONDS instead of at the end of `linux / unit` (issue #840).
      # `git-identity-apply` writes the ONE allowlisted identity (`scripts/git_identity.py`) into this
      # checkout's git config, and `check-git-identity` fails — naming the identity, where it came
      # from (`GIT_AUTHOR_EMAIL`, a config file) and the allowlist — when git would commit as anyone
      # else. The author scan below is the second half: it reads the commits the PR actually carries.
      - name: make git-identity-apply (source the one commit identity, issue #840)
        run: make git-identity-apply
      - name: make check-git-identity (fail in seconds when the identity is off the allowlist)
        run: make check-git-identity
      - name: make check-pr-authors (the same author gate linux/unit runs, at the top of the cheapest job)
        env:
          # A pull request measures its own base; a push to main has no base_ref, and `origin/main`
          # is then HEAD, so only the static half (producers + AGENTS.md) is read there.
          PR_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: make check-pr-authors PR_BASE="$PR_BASE"
      - name: Decide which heavy rows this run schedules (make ci-slow-rows)
        id: rows
        env:
          # A non-PR event has no pull_request payload: the script reads that as "schedule the row"
          # (fail closed), so only a pull request can lose it.
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: make ci-slow-rows
      # THE DECISION THIS RUN IS HELD TO (issue #1111). A cancelled run and a legitimately skipped job
      # produce the same check-run row (`skipped`, or no row at all: measured on run 41134761297, where
      # `linux` was skipped and no `linux / unit` row existed while the summary read `0 failures`).
      # The scope decision is therefore published as DATA, and `ci-verdict.yml` holds the finished run
      # to it. It is computed here, in the cheapest job, because a decision nobody published cannot be
      # read back — and `guard` is the one job no fan-out depends on.
      - name: Publish the scope decision this run is held to (make ci-scope DECISION=...)
        env:
          # A pull request measures its own base sha; a push to main keeps the full matrix, which is
          # the classifier's documented contract for a push (scripts/ci_scope.py).
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          export DECISION="$RUNNER_TEMP/ci-scope-decision.json"
          if [ -n "$BASE_SHA" ]; then
            make ci-scope BASE="$BASE_SHA"
          else
            make ci-scope ALL=1
          fi
      - name: Upload the decision (the artifact `make ci-verdict` reads back on the finished run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-scope-decision
          path: ${{ runner.temp }}/ci-scope-decision.json
          # A run that cannot publish its decision must fail HERE, not look decided.
          if-no-files-found: error
          retention-days: 7
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            if [ "$u" = "github-actions[bot]" ] && [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
              echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
              continue
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  # ------------------------------------------------------------------
  # ci-images (issue #117): the test image and the OpenSpec CLI image, tagged with a
  # hash of their Dockerfile + lockfiles (scripts/ci_images.py). A hash already on
  # GHCR is one manifest lookup; a new one is built ONCE for linux/amd64 + linux/arm64
  # (registry layer cache) and pushed. Every job below pulls it instead of building.
  # ------------------------------------------------------------------
  ci-images:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: make publish-ci-images (build + push only the hashes not on GHCR yet)
        run: make publish-ci-images
      - name: make ci-image-refs
        run: make ci-image-refs

  # ------------------------------------------------------------------
  # scanner-images (issue #714, parent #713): one immutable image per scanner —
  # containers/scanners/<id>/Dockerfile, Wolfi base pinned BY DIGEST, scanner pinned to an
  # exact version, published under a content-hash tag (scripts/scanner_image.py). A build +
  # version test runs on every PR; the publish runs on a push only, and that policy lives in
  # the script (`ci`), never in a scenario-scoped `if:` here.
  # ------------------------------------------------------------------
  scanner-images:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: make ci-scanner-images (build + version-test every scanner; publish on a push run)
        run: make ci-scanner-images

  linux:
    # `guard` is in `needs` for its row-selection output (issue #859): `linux / top-tier` follows
    # the `ci:slow` label, every other row of this call does not.
    needs: [ci-images, guard]
    uses: ./.github/workflows/pipeline.yml
    # A called workflow can never grant MORE than the caller passes it, so a permission
    # `pipeline.yml` needs must be named HERE too: `actions: read` is what lets its
    # `install` job read the producer cells' job state (issue #893). Granting it only in
    # the callee made GitHub refuse the whole workflow — a completed/failure run with
    # ZERO jobs and nothing to open (run 40819108106).
    permissions:
      contents: read
      packages: read
      actions: read
    secrets: inherit
    with:
      runner: ubuntu-latest
      top_tier_rows: ${{ needs.guard.outputs.top_tier_rows }}

  # ------------------------------------------------------------------
  # auto-merge is NOT a job here (issue #493). A `pull_request` run from a fork receives NO repository
  # secrets, so `secrets.BUMP_TOKEN` was the empty string: this job reported `success` while merging
  # nothing (#481), and every agent PR in this repository is pushed to the fork. It lives in
  # `.github/workflows/auto-merge.yml`, a `workflow_run` workflow, which runs in the BASE repository with
  # the base repository's secrets and merges only a CI run that concluded `success`.
  # ------------------------------------------------------------------
