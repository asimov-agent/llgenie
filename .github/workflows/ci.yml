name: CI

# Runs on pull requests (targeting main) AND on merges to main — never on a bare
# feature-branch push. This keeps the upstream pipeline (and the GHCR publish on
# main) working while feature branches don't burn CI by themselves. For cross-repo
# fork PRs the upstream pipeline runs the PR and its checks report on the PR.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]    # merges: build + publish engine images to GHCR

# Hub calls (unit pick, hf download, engine containers) send this. The value is
# the repo Actions secret HF_TOKEN. Reusable workflows receive it via secrets: inherit.
env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# A push to a PR SUPERSEDES the run it replaces (issue #288): the group carries `github.ref`, which
# for a pull_request run is `refs/pull/<n>/merge`, so one PR cancels its own previous run and two
# different PRs never cancel each other. Without it a second push left the first run's jobs alive —
# measured 2026-10-15: `feat/bot-pipeline-isolation` had run 38680205632 (sha 345e7eb8) and run
# 38683422700 (sha 846d4ed8) both live — and a same-repo PR run PUBLISHES to GHCR (`make push-engine`
# is an unconditional step of every engine-image job), so both were building and pushing the same
# images while the superseded one sat in the runner queue.
#
# `cancel-in-progress` is TRUE for pull_request ONLY: a `push` to main must never cancel a main run
# that is mid-publish (a cancelled publish leaves the content-hash tag half-pushed and the next run
# republishes all of it). The bots are untouched — they keep `cancel-in-progress: false`, because a
# repair/rebase that is 40 minutes into a 180-minute agent job must never be killed by its next tick.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two pipelines run in parallel (issue #112): `linux` (ubuntu-latest) and `macos`
# (macos-15-intel). Both run the same `make ci-<job>` commands and asserts:
# both call pipeline.yml, one job per target (issue #120: no combined jobs). Linux sets
# up Docker; macOS runs the same targets in the Python 3.11 venv and never runs a Docker
# GitHub Action. Both must succeed for the run to be green.
# macOS never runs an inference server in a container and its runners have no Metal
# GPU (issue #120): there is no macOS published-image stage and no native-engine CI
# job. Native Metal engines are verified on an Apple-Silicon host with
# `make ci-engines BACKEND=metal`.
#
# ci-images (issue #117) publishes the CI images (llgenie/test, llgenie/openspec) to GHCR
# once per content hash; every other job PULLS them (make test-image-pull /
# make openspec-image-pull) and never builds them.
#
# The engine images are built ONCE (engine-base / engine-image / engine-published-test,
# Linux: the images are linux containers), then installed from GHCR on Linux only
# (published.yml: make test-install-published per backend).
jobs:
  probe-15-intel:
    name: probe macos-15-intel
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - run: sw_vers && uname -m

  probe-14:
    name: probe macos-14
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - run: sw_vers && uname -m

  probe-13:
    name: probe macos-13
    runs-on: macos-13
    timeout-minutes: 5
    steps:
      - run: sw_vers && uname -m
