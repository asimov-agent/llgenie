name: pipeline

# The verification pipeline, called from ci.yml for Linux and for macOS with the same
# make commands and asserts (issue #112). Every job runs ONE `make ci-<job>` target
# (Makefile). Docker is set up only on Linux; macOS runs the same targets in the
# Python 3.11 venv and never runs a Docker GitHub Action.
#
# The CI images (llgenie/test, llgenie/openspec) are never built here: ci.yml's
# `ci-images` job publishes them to GHCR once per content hash and every job PULLS
# them (make test-image-pull / make openspec-image-pull, issue #117).
#
# Linux runs one job per ci-<job> target, in parallel (the required checks).
# macOS calls THIS file too (issue #120): the same jobs, one make ci-<job> each, the
# same asserts, no combined jobs; only the runner label differs. tests/test_ci_images.py
# locks that both OSes call this one file.
on:
  workflow_call:
    inputs:
      runner:
        description: runs-on label (ubuntu-latest | macos-15-intel)
        required: true
        type: string
      optional:
        description: unused; kept so an old caller still parses (issue #120: macOS is required)
        required: false
        default: false
        type: boolean
      # ROW SELECTION (issue #859). A JSON list and the ONLY matrix axis of the `top-tier` job:
      # `["run"]` runs the stage, `["none"]` is a placeholder that runs no make target. ci.yml
      # supplies it from `make ci-slow-rows` — `["none"]` on a pull request that does not carry the
      # `ci:slow` label, `["run"]` on every non-PR event (a push to main) and on a labelled PR. The
      # default is `["run"]`: an old caller, or a caller that says nothing, keeps the full matrix.
      top_tier_rows:
        description: 'JSON list — ["run"] runs the top-tier stage, ["none"] is the placeholder row (issue #859)'
        required: false
        default: '["run"]'
        type: string

# Passed in by ci.yml (secrets: inherit). Every make ci-* job can call the Hub with it.
env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # lint: linefeed / editorconfig
  lint:
    timeout-minutes: 15   # measured 27 s on ubuntu-latest; 15 min is a hang ceiling, not a budget
    runs-on: ${{ inputs.runner }}
    continue-on-error: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/docker
        if: runner.os == 'Linux'  # macOS: the 3.11 venv, no container
      - name: make test-env (Python 3.11 - Linux pulls llgenie/test from GHCR, macOS builds the 3.11 venv)
        run: make test-env
      - name: make ci-lint
        run: make ci-lint
      # No credential VALUE may reach the repo, and the scanner must be proven able to catch one
      # (issue #360). Linux only: the scan runs gitleaks in its own image, and the macOS job has no
      # container engine here.
      - name: make secret-scan (a committed credential VALUE fails the build)
        if: runner.os == 'Linux'
        run: make secret-scan
      - name: make secret-scan-self-test (the planted credential is caught)
        if: runner.os == 'Linux'
        run: make secret-scan-self-test
      - name: Prune orphaned test containers
        if: always()
        run: make test-clean

  # unit: hermetic unit tests + registry/skill/param checks
  unit:
    timeout-minutes: 60   # measured minutes on ubuntu-latest; 60 catches a hang that the 360-min default hides
    runs-on: ${{ inputs.runner }}
    continue-on-error: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # matrix(changed=origin/main) needs the parent commit
      - uses: ./.github/actions/docker
        if: runner.os == 'Linux'  # unit tests are Python; macOS Colima would shadow python3
      - name: make test-env (Python 3.11 - Linux pulls llgenie/test from GHCR, macOS builds the 3.11 venv)
        run: make test-env
      - name: make ci-unit (test-unit, skills-validate, check-registry, check-strata-models, check-engine-params)
        run: make ci-unit
      - name: Prune orphaned test containers
        if: always()
        run: make test-clean

  # install: ci-install only prepares the environment. make install, the
  # installed llgenie dry run, and make uninstall are separate steps.
  install:
    runs-on: ${{ inputs.runner }}
    continue-on-error: false
    # Product-only (issue #1027): ci-install installs the llgenie tool (venv + launcher) and runs
    # llgenie --dry + uninstall. The inference-engine install-test lives in the engine-build
    # producer's `test-engine-install` (on the just-published image), so this row neither waits for
    # nor pulls nor version-tests any engine image.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      LLGENIE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: make ci-free-disk (engine images are large)
        run: make ci-free-disk
      - uses: ./.github/actions/docker
        if: runner.os == 'Linux'  # macOS: make install in the 3.11 venv, no Colima
      - name: make ci-install (product-only llgenie install + dry + uninstall; the engine install-test runs in engine-build)
        run: make ci-install
      - name: Prune orphaned test containers
        if: always()
        run: make test-clean

  # agents-read: AGENTS.md must not match Hermes context-file threat patterns.
  # setup-python only provides python3.12; make builds the venv (hermes-agent + pytest),
  # scans AGENTS.md and runs the guard's tests, the same as on a dev host.
  agents-read:
    timeout-minutes: 15   # measured 20 s; the default 360 min would hide a hang for six hours
    runs-on: ${{ inputs.runner }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: make ci-agents-read (Python 3.12 venv -> AGENTS.md scan -> guard tests)
        run: make ci-agents-read

  # openspec: validate the OpenSpec changes; every active change has all tasks checked
  openspec:
    timeout-minutes: 15   # measured 20 s; the default 360 min would hide a hang for six hours
    runs-on: ${{ inputs.runner }}
    continue-on-error: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: runner.os == 'macOS'  # no Docker: install the pinned openspec CLI
        with:
          node-version: "22"
      - uses: ./.github/actions/docker
        if: runner.os == 'Linux'  # macOS: the pinned openspec CLI, no Docker GitHub Action
      - name: Pull the OpenSpec image (GHCR, published by ci-images; Linux only, macOS has no Docker)
        if: runner.os == 'Linux'
        run: make openspec-image-pull
      - name: make ci-openspec (openspec-validate + openspec-tasks-check, fails on any unchecked `- [ ]`)
        run: make ci-openspec

  # cpu-health: llgenie serves the 0.5B model through the llama.cpp engine image, "hi"
  cpu-health:
    runs-on: ${{ inputs.runner }}
    continue-on-error: false
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/docker
        if: runner.os == 'Linux'  # macOS: no Colima
      - name: make test-env (Python 3.11 - Linux pulls llgenie/test from GHCR, macOS builds the 3.11 venv)
        run: make test-env
      - name: make ci-cpu-health (0.5B answers hi through the llama.cpp image; macOS Colima, not a Docker GitHub Action)
        run: make ci-cpu-health
      - name: Prune orphaned test containers
        if: always()
        run: make test-clean

  # top-tier: REAL (no-mock) top-tier acceptance (issue #49)
  # 90 minutes, not 60: the macOS stage alone measured 2278 s (38 min) for 15 cases, and a
  # dry run that outlives its 780 s deadline now gets the one retry the seam promises
  # (issue #676) — up to another 780 s, which did not fit in 60 with the job's setup.
  # ROW SELECTION (issue #859): `row` is this job's ONE matrix axis, supplied by ci.yml from
  # `make ci-slow-rows`. `["run"]` runs the stage; `["none"]` is a placeholder that runs no make
  # target — the row downloads and serves a real model, which is a property of `main` and of the
  # weekly engine/registry data, not of a pull request's diff. No job-level `if:`: a skipped job
  # makes its check name disappear (tests/test_ci_images.py::test_no_ci_step_or_job_is_skipped), so
  # the absence stays VISIBLE as a row whose one unguarded step says why it did nothing.
  top-tier:
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(inputs.top_tier_rows) }}
    runs-on: ${{ inputs.runner }}
    continue-on-error: false
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - name: Say which row this is, and why (issue #859)
        run: |
          if [ "${{ matrix.row }}" = "none" ]; then
            echo "[slow-rows] top-tier on ${{ inputs.runner }} = NOT SCHEDULED: it runs on a push to main and on a pull request labelled ci:slow."
          else
            echo "[slow-rows] top-tier on ${{ inputs.runner }} = RUN: the ci-top-tier stage."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: matrix.row != 'none'
      - uses: ./.github/actions/docker
        if: matrix.row != 'none' && runner.os == 'Linux'  # macOS: no Colima
      - name: make test-env (Python 3.11 - Linux pulls llgenie/test from GHCR, macOS builds the 3.11 venv)
        if: matrix.row != 'none'
        run: make test-env
      - name: make ci-top-tier (same targets on both OSes; macOS Colima, not a Docker GitHub Action)
        if: matrix.row != 'none'
        run: make ci-top-tier
      - name: Prune orphaned test containers
        if: matrix.row != 'none' && always()
        run: make test-clean
