name: security-scan — the daily vulnerability pipeline (Trivy + Syft + Grype + Semgrep), never a PR or push check

# Issue #715 (parent #713), own-pipeline rule #738. Every scanner runs from ITS OWN immutable image,
# named by containers/scanners/digests.json (a content hash of the Dockerfile, built by this
# repository — issue #714). Nothing is installed at scan time and no `uses:` here floats on a tag.
#
# THIS IS NOT PART OF PR OR MAIN CI. The trigger surface is its own daily `schedule` (04:05 UTC, an
# odd minute no bot shares — issue #275) and `workflow_dispatch`, and nothing else: a pre-existing
# advisory in an upstream package must never red a pull request or a push to `main` (measured: run
# 40525155122 failed a push on certifi/filelock/urllib3 pins that nothing bumped). `make
# check-security-scan` fails if a `push:` or `pull_request:` trigger is added back.
# Flow: guard (owner / repository bot / collaborator with write, BEFORE any secret is read) ->
#       make check-security-scan (policy + digests + triggers sane) -> make security-scan-all
#       (Syft SBOM, then Trivy, Grype and Semgrep from their pinned images) -> make security-verdict
#       EVENT=<event> (the policy decides whether that event may gate; its outcome is CAPTURED, not
#       raised) -> make security-issues (one tagged issue per finding) -> make security-bumps (the
#       floor the scanner demands, regenerated into ONE bump PR that closes the issues it fixes) ->
#       upload SARIF + the CycloneDX SBOM -> the LAST step turns a gated verdict into the run's red.
#       Order is the contract: a gated verdict must still file its issues and open its PR, so the
#       red is the final step and never a mid-job exit (measured defect: the 2026-10-28 daily run
#       died at the verdict and filed nothing while four fixable CVEs sat in the reports).
# Trigger surface: schedule daily 04:05 UTC (its own odd minute — no bot shares a slot, issue #275) and
#                  workflow_dispatch (owner / repository bot / collaborator with write), and NOTHING
#                  else — no pull_request and no push trigger (issue #738).
# Never: never merges, never pushes to `main`, never installs a scanner, never runs a scanner from a
#        floating tag, never needs a scanner secret (no scanner takes one), and never gates a pull
#        request or a push.
on:
  schedule:
    - cron: "5 4 * * *"    # daily 04:05 UTC — its own odd minute (issue #275: no bot shares a slot)
  workflow_dispatch:
    inputs:
      tools:
        description: "Which scanners to run: all, or one of syft / trivy / grype / semgrep"
        type: choice
        options: [all, syft, trivy, grype, semgrep]
        default: all
      enforce:
        description: "Failure policy for THIS dispatch: full = the daily policy, report = never gate"
        type: choice
        options: [full, report]
        default: full

permissions:
  contents: read

concurrency:
  # A bot never cancels an in-progress run (issue #275): the group is this workflow's own, and
  # `cancel-in-progress` is false so a second scan waits instead of killing one mid-upload.
  group: security-scan
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            if [ "$u" = "github-actions[bot]" ] && [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
              echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
              continue
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  scan:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write          # the `fix/security-floors` bump branch (#738)
      packages: read
      pull-requests: write     # the one bump PR (#738)
      issues: write            # tagged vulnerability issues (#716)
      security-events: write   # SARIF upload, scoped to this job only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Pushed and pulled with the owner PAT, never GITHUB_TOKEN (issue #136): a push made with
          # GITHUB_TOKEN starts no workflows, so the bump PR would arrive untested.
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: make check-security-scan (policy + pinned scanner refs + triggers must be sane)
        run: make check-security-scan

      - name: make security-scan-all (or one tool from the dispatch input)
        run: |-
          set -euo pipefail
          tools="${{ github.event.inputs.tools || 'all' }}"
          if [ "$tools" = "all" ]; then
            make security-scan-all
          else
            make sbom
            make security-scan TOOL="$tools"
          fi

      - name: make security-verdict (the policy decides whether THIS event may gate)
        # The verdict must NOT abort the job: filing the tagged issues (#716) and opening the floor
        # bump PR (#738) are the reason this pipeline exists, and both used to be skipped whenever
        # the verdict gated (measured: the 2026-10-28 daily run went red at this step and produced
        # zero issues and zero PRs while four fixable CVEs sat in the reports). The outcome is
        # captured here and turned into the run's exit code by the LAST step of the job.
        id: verdict
        continue-on-error: true
        run: |-
          set -euo pipefail
          ENFORCE="${{ github.event.inputs.enforce || '' }}"
          if [ "$ENFORCE" = "report" ]; then ENFORCE=pr; fi
          make security-verdict EVENT="${{ github.event_name }}" ENFORCE="$ENFORCE"

      - name: make security-issues (file or update one tagged issue per finding)
        # Runs even when the verdict gated — that is the point. Still skipped when the scan itself
        # died before writing reports, so a scanner crash never files a bogus "0 findings" issue.
        if: always() && hashFiles('security-reports/*') != ''
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          SECURITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: make security-issues SLUG="${{ github.repository }}" RUN_URL="$SECURITY_RUN_URL"

      - name: make security-bumps (the floor the scanner demands, regenerated into ONE bump PR)
        # Also `always()`: a failed issue-filing pass must never hide the pinned floors the scan
        # demands, and a gated verdict is exactly when the bump PR matters most.
        if: always() && hashFiles('security-reports/*') != ''
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          SECURITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: make security-bumps SLUG="${{ github.repository }}"

      - name: Upload SARIF to the Security tab
        if: always() && hashFiles('security-reports/trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: security-reports/trivy.sarif
          category: trivy

      - name: Upload the CycloneDX SBOM and the scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: security-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Hand the verdict to the run's exit code (LAST, so nothing above is skipped)
        # The single place a red daily scan comes from. By the time this runs, the tagged issues,
        # the floor bump PR, the SARIF upload and the artifact have all happened — so a red run
        # always means "findings were filed and a PR is waiting", never "the pipeline broke before
        # it did its job".
        if: always() && steps.verdict.outcome == 'failure'
        run: |
          echo "::error::security-verdict gated this run — the tagged issues were filed and the floor bump PR was regenerated before this step; see the verdict log above for the findings."
          exit 1
