name: engine-bump-rebase — rebases every open engine-bump PR onto the latest main

# Issue #208: keep the open engine-bump PRs (chore/engine-bump-*, created by
# engine-bump.yml, issue #107) current with the latest `main`. The engine-bump
# workflow only CREATES those PRs; nothing in CI kept them rebased except the
# watch-loop dispatcher's host crontab. This daily job finds every open
# chore/engine-bump-* PR and, when one is behind `main`, forward-merges the
# latest `main` into it and force-with-lease-pushes it back — automatically,
# and only when the merge applies cleanly (a conflict is left for a human).
#
# It reuses the SAME sync logic as the dispatcher (scripts/engine_bump_sync.py,
# imported by scripts/engine_bump_rebase.py) — no duplicated implementation.
#
# The job checks out, pushes and opens with the owner PAT (secrets.BUMP_TOKEN),
# not GITHUB_TOKEN (issue #136): a push made with GITHUB_TOKEN starts no
# workflows, and the PAT is what engine-bump.yml already uses to write the
# upstream branches.
# Trigger surface: schedule daily 05:41 UTC (`41 5 * * *`), and workflow_dispatch (owner/collaborator; `dry=true`
#                  prints the plan and pushes nothing).
# Flow: guard (owner/collaborator/bot, BEFORE any secret is read) -> make engine-bump-rebase
#       (scripts/engine_bump_rebase.py: every open `chore/engine-bump-*` PR that is behind `main`
#       gets the latest `main` forward-merged in and is force-with-lease pushed).
# Never: never merges a PR, never pushes to `main`, never touches a branch whose merge conflicts —
#        a conflicting PR is left for a human.
on:
  schedule:
    - cron: "41 5 * * *"   # daily: 05:41 UTC (unique minute, issue #275)
  workflow_dispatch:
    inputs:
      dry:
        description: "print the PRs it would rebase and push nothing (no branch is touched)"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write
  issues: write

# concurrency: stacking is intended — it force-pushes the `chore/engine-bump-*` branches it rebases, so two
# runs racing the same ref would rewrite a head the other just pushed; the queued run re-reads the open PRs
# when it starts (issue #917).
concurrency:
  group: engine-bump-rebase
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # The run's head repository: empty for every non-PR event (issue #510).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            # The repository's own bot is a GitHub App login, so it is never a collaborator and the
            # permission read below answers 404 -> `none`: every bot-opened PR was refused (run
            # 39650944430, #495). It may pass ONLY when the run's head is a branch in THIS repository —
            # a same-repo head can be produced only by a token with write access — while the bot as the
            # actor of a FOREIGN head (a bot commenting on a stranger's PR) is still refused (#510).
            if [ "$u" = "github-actions[bot]" ] && [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO:-}" = "$REPO" ]; then
              echo "Repository bot $u on a same-repo head ($HEAD_REPO) - allowed."
              continue
            fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  rebase:
    needs: [guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"   # the repo's pinned Python (issue #120)
      - name: Rebase open engine-bump PRs onto the latest main
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          DRY_INPUT: ${{ inputs.dry }}   # empty on a scheduled run; "true"/"false" by hand
        run: |
          # A forward-merge preserves the commits it replays and stamps only the merge commit, so
          # this decides the identity of that commit — one of the two a PR's commits may carry
          # (`Asimov Agent`, issue #345), sourced from the ONE seam that sets it (issue #840) rather
          # than a literal here. `gh api user` would stamp the token owner's LOGIN, which is not an
          # allowed spelling.
          make git-identity-apply
          # `dry` is OFF unless a dispatcher ticks the box: the daily cron REBASES each open
          # chore/engine-bump-* PR onto main and force-with-lease pushes it. Spelled out rather than
          # folded into one expression, so the mode this run took is readable in the log. (The
          # expression syntax is NOT written out here on purpose: a `#` line inside this run block is
          # script text, not a YAML comment, so a literal expression would be parsed — and an
          # unparseable one makes GitHub refuse the whole file, issue #330.)
          if [ "${DRY_INPUT}" = "true" ]; then
            echo "==> DRY RUN: printing the PRs that would be rebased; nothing is pushed"
            make engine-bump-rebase DRY=1
          else
            echo "==> REAL REBASE: forward-merging main into each open engine-bump PR and pushing it back"
            make engine-bump-rebase
          fi
