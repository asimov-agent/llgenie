# Queued-run alarm (issue #254).
#
# A job whose runner label matches nothing does not FAIL — it stays `queued` forever, so the
# run never concludes and every PR's checks sit at "pending" (that is main today: the `macos`
# jobs queue on `macos-15-intel`). This sweep makes that state loud instead of silent.
#
# No conditional job anywhere (`needs: [guard]` is a gate, not an `if:`): issue #107 requires the
# decision to live in code, and it does — scripts/queued_run_alarm.py decides what counts as
# stuck and what to report. The guard job is what makes a hand dispatch owner/collaborator-only
# (issue #295: this workflow was the only dispatchable one without it).
name: queued-alarm — reports CI jobs queued far too long, once per affected run

# Trigger surface: schedule twice an hour (`7,37 * * * *` — GitHub drops top-of-hour runs), and
#                  workflow_dispatch (`minutes` = the queue-age threshold).
# Flow: guard -> make queued-alarm (scripts/queued_run_alarm.py: list the runs still `queued` past
#       the threshold, then DELIVER the report - to the run's own PR when it has one, else one issue
#       per stuck label so a queue that never moves becomes visible somewhere a human looks).
# Never: never cancels a run, never merges, never delivers twice for the same run or the same label.
on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour (an odd minute; GitHub drops top-of-hour runs)
  workflow_dispatch:
    inputs:
      minutes:
        description: "report jobs queued longer than this many minutes"
        required: false
        default: "30"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: queued-run-alarm
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"
  alarm:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Report jobs queued far too long, delivered to the run's PR (else one issue per stuck label)
        env:
          # It comments on a PR / files ONE deduped issue: `issues: write` is declared above and
          # granted to github.token, while the owner PAT carries no Issues write (issue #412).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make queued-alarm REPO="${{ github.repository }}" \
            MINUTES="${{ inputs.minutes || '30' }}" COMMENT=1
