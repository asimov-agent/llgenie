name: agent-leg — the reusable agent leg

# The reusable agent leg (issue #798): ONE job that checks out the repo, runs
# the ordered preflight (JEV #238, shell-keys #358, routing-smoke #407) through
# the `.github/actions/agent-leg` composite action, runs the `make <target>` the
# caller names, and uploads the REDACTED transcript (#359). The caller keeps its
# own guard and its seed/post steps; a leg whose whole post-guard job IS
# "preflight -> one make target -> upload" becomes the caller below.
#
# A `uses:` job in the CALLER may not carry `steps`, `env`, or `timeout-minutes`
# (issue #882 — GitHub refuses the whole file at load), so the ceiling and the
# checkout live here, in this workflow's own job, and the caller passes only
# inputs + `secrets: inherit`.
on:
  workflow_call:
    inputs:
      target:
        description: >-
          The Makefile target that IS the leg (e.g. "issue-refiner",
          "architecture-bot-doc"). Required.
        required: true
        type: string
      skill:
        description: >-
          The Hermes skill the leg runs under (informational today — the caller's Makefile target wires the actual skill).
        required: false
        default: ""
        type: string
      push:
        description: >-
          "true" when the leg pushes a branch/PR: sync with upstream main
          (issue #303) and resolve the agent image first.
        required: false
        default: "false"
        type: string
      timeout:
        description: The leg job's timeout-minutes ceiling.
        required: false
        default: 120
        type: number
      transcript:
        description: The REDACTED transcript artifact's retention in days (0 = default).
        required: false
        default: 0
        type: number
      shell_keys:
        description: >-
          AGENT_SHELL_CHECK_KEYS — the space-separated KEY NAMES the leg
          forwards, for the preflight proof (issue #358).
        required: false
        default: ""
        type: string
      routing_smoke:
        description: '"true" to run `make hermes-smoke` in the preflight (a routed leg, issue #407).'
        required: false
        default: "false"
        type: string

jobs:
  agent:
    runs-on: ubuntu-latest
    # The ceiling lives here, not on a caller `uses:` job (issue #882).
    timeout-minutes: ${{ inputs.timeout }}
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout main with the owner PAT (so a pushed branch re-triggers CI)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN }}

      - name: Sync with latest upstream main (the branch must start from its tip - issue #303)
        if: inputs.push == 'true'
        run: make bot-sync-main

      - name: Resolve the agent image (GHCR :latest, the tag publish points at the content hash)
        if: inputs.push == 'true'
        id: agent
        run: |
          set -euo pipefail
          image=$(make agent-image-ref)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "agent image: $image"

      - name: agent-leg preflight (JEV #238, shell-keys #358, routing-smoke #407)
        uses: ./.github/actions/agent-leg
        with:
          phase: preflight
          shell_keys: ${{ inputs.shell_keys }}
          routing_smoke: ${{ inputs.routing_smoke }}

      - name: Run the leg (the caller's target, via env so the wiring guard reads no phantom)
        id: leg
        env:
          # The target travels by env, not by literal make <expr>: the wiring guard (make
          # check-wiring) refuses a `make <token>` whose token is no Makefile target, and an
          # input-driven target is dynamic by construction (#798). A quoted $TARGET is not a
          # literal target name for the guard's scan, and at runtime `make "$TARGET"` runs
          # exactly the target the caller named.
          TARGET: ${{ inputs.target }}
          AGENT_IMAGE: ${{ steps.agent.outputs.image }}
        run: |
          set -euo pipefail
          make "$TARGET"

      - name: agent-leg transcript upload (the REDACTED stream, issue #359)
        if: always()
        uses: ./.github/actions/agent-leg
        with:
          phase: upload
